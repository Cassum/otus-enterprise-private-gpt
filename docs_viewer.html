- | --------- |\n| **ISO 27001 & SOC 2 Type I audit**               | Completed |\n| **ISO 27001 surveillance & SOC 2 Type II audit** | Q1 2027   |\n| **HIPAA Security Rule self-assessment**          | Q3 2026   |\n| **GDPR & EU AI Act compliance monitoring**       | Ongoing   |\n| **Ultralytics Platform Penetration Test**        | Completed |\n| Annual compliance metrics review                 | Annually  |\n| Annual risk assessments                          | Annually  |\n| Policy reviews                                   | Annually  |\n| Continuous security monitoring                   | Ongoing   |\n| Annual information security audits               | Annually  |\n"}]}, {"type": "dir", "name": "tools", "path": "tools", "children": [{"type": "file", "name": "email-signatures.md", "path": "tools/email-signatures.md", "content": "---\ndescription: Ultralytics email signature setup with automated Google Workspace integration, profile pictures, and legal disclaimers for professional communication.\nkeywords: Ultralytics email signatures, Google Workspace automation, Gmail signatures, professional email template, legal disclaimers, company branding\n---\n\n# Email Signatures 📧\n\n## 1. Official Signature Template\n\nAll Ultralytics email signatures are automatically generated and updated using our Google Workspace automation. Here is the standard format:\n\n<img width=\"1920\" alt=\"Ultralytics Email Signature\" src=\"https://github.com/user-attachments/assets/c8add3bf-a06d-436c-99c8-0e605a9aa612\" />\n\n### Example\n\nThe standard signature will appear in your email client as shown below.\n\n<table style=\"border: none; margin: 0; padding: 0; font-family: Arial, sans-serif; font-size: 13px\">\n  <tr>\n    <td style=\"vertical-align: middle\">\n      <img\n        src=\"https://lh3.googleusercontent.com/a/ACg8ocL27P7pVeDI5jgSam8g64HCBR1C_C1mbkBUZJ0rANJLrAk89fIC=s96-c\"\n        width=\"75\"\n        height=\"75\"\n        style=\"border-radius: 50%; margin-right: 10px; object-fit: cover; display: block\"\n      />\n    </td>\n    <td style=\"vertical-align: middle; line-height: 1.25; color: #666\">\n      <span style=\"font-weight: bold; font-size: 15px; color: #333\">Glenn Jocher</span><br />\n      Founder & CEO, Ultralytics<br />\n      +1 123 456 7890<br />\n      <a href=\"https://www.ultralytics.com\" style=\"text-decoration: none; color: #666\">ultralytics.com</a>\n    </td>\n  </tr>\n</table>\n<div style=\"font-size: 11px; color: #999; padding-top: 8px\">\n  This email and any attachments are confidential and intended solely for the addressee. Copying, forwarding, or\n  distributing is strictly prohibited. If received in error, please delete immediately and notify the sender.\n</div>\n\n### HTML Template\n\nFor manual setup in other email clients, use the HTML code below.\n\n```html\n<table style=\"border: none; margin: 0; padding: 0; font-family: Arial, sans-serif; font-size: 13px\">\n    <tr>\n        <td style=\"vertical-align: middle\">\n            <img\n                src=\"https://lh3.googleusercontent.com/a/ACg8ocL27P7pVeDI5jgSam8g64HCBR1C_C1mbkBUZJ0rANJLrAk89fIC=s96-c\"\n                width=\"75\"\n                height=\"75\"\n                style=\"border-radius: 50%; margin-right: 10px; object-fit: cover; display: block\"\n            />\n        </td>\n        <td style=\"vertical-align: middle; line-height: 1.25; color: #666\">\n            <span style=\"font-weight: bold; font-size: 15px; color: #333\">Glenn Jocher</span><br />\n            Founder & CEO, Ultralytics<br />\n            +1 123 456 7890<br />\n            <a href=\"https://www.ultralytics.com\" style=\"text-decoration: none; color: #666\">ultralytics.com</a>\n        </td>\n    </tr>\n</table>\n<div style=\"font-size: 11px; color: #999; padding-top: 8px\">\n    This email and any attachments are confidential and intended solely for the addressee. Copying, forwarding, or\n    distributing is strictly prohibited. If received in error, please delete immediately and notify the sender.\n</div>\n```\n\n!!! note\n\n    If you are using this HTML for a custom signature:\n\n    - Replace the placeholder image `src` URL, name, title, and phone number. The phone number line is optional.\n    - The legal disclaimer `div` is also optional and can be removed if not required for your position.\n    - This HTML has been formatted with `npx prettier --write --print-width 120 *.html`.\n\n## 2. Automation 🤖\n\nThe signature automation performs the following actions:\n\n- Pulls the title, phone number, and profile picture from Google Workspace.\n- Creates customized signatures for each person.\n- Adds legal disclaimers for applicable positions.\n- Updates all signatures across the domain.\n\n## 3. Setup Instructions ⚙️\n\n**ACTION REQUIRED:** Please check your Gmail Settings > General > Signature to ensure \"My signature\" is selected for both:\n\n- FOR NEW EMAILS USE\n- ON REPLY/FORWARD USE\n\n<img width=\"1920\" alt=\"Ultralytics Gmail Settings\" src=\"https://github.com/user-attachments/assets/a4bee95f-793c-4cde-ae7b-526e7ebe0577\" />\n\n!!! tip\n\n    If you do not see your signature, please reload the Gmail tab in your browser.\n\n## 4. Profile Photo Visibility 🔒\n\nYour signature photo must be public or Gmail will show the blue placeholder. Fix it in Google account settings:\n\n1. Visit [myaccount.google.com](https://myaccount.google.com) (Personal info tab).\n2. Click your profile photo > `Profile picture visibility` > select **Anyone**.\n3. Wait a few minutes, then reload Gmail to confirm.\n\nIf your photo appears like this placeholder, the visibility is still restricted:\n\n<img width=\"120\" alt=\"Google placeholder profile image\" src=\"https://lh3.googleusercontent.com/a/default-user=s96-c\" />\n\n## 5. Legal Disclaimers ⚖️\n\nThe legal disclaimer `div` shown in the HTML example is automatically appended to signatures for employees in sensitive roles (e.g., leadership, legal, sales) to ensure confidentiality and compliance. For all other positions, this disclaimer is optional.\n\n!!! quote \"Disclaimer text\"\n\n    This email and any attachments are confidential and intended solely for the addressee. Copying, forwarding, or distributing is strictly prohibited. If received in error, please delete immediately and notify the sender.\"\n\n## 6. Technical Implementation 🔧\n\nThe automation is implemented in Python and utilizes the following:\n\n- Google Admin SDK for user management.\n- Gmail API for signature updates.\n- Google Workspace service account for authentication.\n- Automatic profile picture optimization with rounded corners.\n\n## 7. Support and Maintenance 🛠️\n\nThe email signature automation is maintained by Glenn Jocher. If you have any questions or encounter any issues with your email signature, please contact him for assistance.\n"}, {"type": "file", "name": "hardware.md", "path": "tools/hardware.md", "content": "---\ndescription: Ultralytics Hardware Policy covering MacBook configurations, Apple Studio Display, mobile devices, MDM security, refresh cycles, and approval processes.\nkeywords: Ultralytics hardware policy, MacBook Air, MacBook Pro, hardware refresh, mobile devices, BYOD, Rippling MDM, employee equipment\n---\n\n# Hardware Policy 💻\n\n![Ultralytics Hardware Policy](https://github.com/user-attachments/assets/6a1566ab-7984-46a0-96b2-0f9dc944bfde)\n\n## Purpose and Scope\n\nThis policy outlines the provisioning, management, and security of all hardware used by Ultralytics employees. Its purpose is to ensure everyone has the necessary tools to perform their roles effectively while protecting the company's assets and data. This policy applies to all full-time, part-time, and contract employees.\n\n## Hardware Refresh Cycle 🔄\n\n!!! success \"2-Year Refresh Cycle\"\n\n    **All employees are eligible for a hardware refresh every two years.**\n\n    This ensures our team is equipped with modern and efficient tools.\n\n```mermaid\ntimeline\n    title Hardware Lifecycle\n    section Year 1\n        New Device : Issued to employee\n        Peak Performance : Optimal productivity\n    section Year 2\n        Continued Use : Maintained performance\n        Refresh Eligible : Can request replacement\n    section Refresh\n        Manager Approval : Automatic within cycle\n        Order New : Trade in old device\n        Receive New : Continue productivity\n```\n\n!!! warning \"Outside Standard Cycle\"\n\n    Replacement requests outside the 2-year cycle require **direct manager approval** based on performance needs or hardware failure.\n\n## Standard Computer Equipment 🖥️\n\n<div class=\"grid cards\" markdown>\n\n- :material-laptop: **MacBook Air**\n\n    ***\n\n    [13\", M5, 16GB RAM, 512GB Storage](https://www.apple.com/macbook-air/)\n\n    **Default for all employees**\n\n    Balances performance and portability\n\n- :material-laptop: **MacBook Pro**\n\n    ***\n\n    [14\", M5, 16GB RAM, 512GB Storage](https://www.apple.com/macbook-pro/)\n\n    **For technical/developer roles**\n\n    Additional processing power\n\n</div>\n\n**Note:** The MacBook Pro is heavier than the MacBook Air and may be less suitable for employees who travel frequently.\n\n!!! warning \"Keyboard Language\"\n\n    **Ensure you order the correct keyboard layout** for your language when requesting equipment.\n\n### Custom Configurations\n\n!!! danger \"Requires Manager Approval\"\n\n    Any hardware configuration other than the two standards listed above is considered an **exception** and requires:\n\n    - Direct manager approval\n    - Clear business justification\n    - Written approval before ordering\n\n## New Hire Equipment Process 📦\n\n!!! info \"Standard Process - High-Resolution Hybrid\"\n\n    Ultralytics runs on **Anchor Days (Tue/Wed/Thu)** for anyone within commutable distance of our London, Madrid, or Shenzhen offices. Plan to badge in and collaborate in person on those days; Mondays/Fridays flex around focused execution.\n\n**Your manager will coordinate with IT to have equipment ready at your office on your first day.** Equipment includes your computer, all accessories, and a fully set up workspace ready when you arrive - just plug in and start working!\n\n??? note \"Exception: Remote Employees\"\n\n    For the rare approved-remote positions (outside commutable distance):\n\n    1. Order your approved equipment configuration independently\n    2. Submit receipts to Finance for reimbursement\n    3. Follow standard [reimbursement procedures](../finance/index.md#reimbursements)\n    4. Confirm purchase details with manager **before ordering**\n    5. Expect to travel for critical in-person sprints as needed\n\n### Standard Accessories\n\n<div class=\"grid cards\" markdown>\n\n- :material-headphones: **AirPods Pro**\n\n    ***\n\n    [Apple AirPods Pro](https://www.apple.com/airpods-pro/)\n\n    For all employees\n\n- :material-monitor: **Studio Display**\n\n    ***\n\n    [Apple Studio Display](https://www.apple.com/studio-display/)\n\n    **Onsite employees only** at office desk\n\n</div>\n\n## Hardware Replacements & Upgrades 🔧\n\nThis process applies when replacing an existing device with a new one (not for new hires).\n\n```mermaid\nflowchart TD\n    A[Need Replacement?]:::start --> B{Within 2-Year Cycle?}:::decide\n    B -->|Yes| C[Automatic Approval]:::proc\n    B -->|No| D[Request Manager Approval]:::proc\n    D --> E{Approved?}:::decide\n    E -->|No| F[Continue with Current Device]:::out\n    E -->|Yes| C\n    C --> G[Select Eligible Device]:::proc\n    G --> H[Order from Apple]:::proc\n    H --> I[Select Trade-In Option]:::proc\n    I --> J[Provide Old Device Serial #]:::proc\n    J --> K[Receive New Device]:::proc\n    K --> L[Migrate Data]:::proc\n    L --> M[Ship Old Device to Apple]:::proc\n    M --> N[Submit for Reimbursement]:::proc\n    N --> O[Receive Net Cost Payment]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n### Replacement Process\n\nBegin by requesting replacement approval from your manager, which is automatically granted if you're within the 2-year refresh cycle but requires business justification if outside the standard timeline. Once approved, select your eligible device (MacBook Air or MacBook Pro) based on your role requirements and portability needs. Order the new device directly from Apple, ensuring you select the trade-in option during checkout and provide the serial number of your existing device.\n\nUpon receiving your new device, migrate all data from your old device and test functionality thoroughly before returning the old one. Ship your old device back to Apple using the provided trade-in kit and follow the [Apple Trade In](https://www.apple.com/shop/trade-in) instructions. Finally, submit your purchase for reimbursement through Finance procedures. The reimbursed amount will be the net cost (new device price minus trade-in credit), not the full price of the new device.\n\n!!! warning \"Approval and Reimbursement Requirements\"\n\n    Your manager and Finance team must see the **full order details** including:\n\n    - New device price\n    - Estimated trade-in credit for old device\n    - Net cost to be reimbursed\n\n## Mobile Device Policy 📱\n\n!!! info \"Not Standard Issue\"\n\n    Company-provided mobile devices require **manager approval** and clear business justification.\n\n### Eligibility and Justification\n\n<div class=\"grid cards\" markdown>\n\n- :material-airplane-takeoff: **Frequent Travel**\n\n    ***\n\n    Constant access to work apps and email required\n\n- :material-phone-alert: **On-Call Duties**\n\n    ***\n\n    Immediate response capabilities necessary\n\n- :material-cellphone-check: **Platform Testing**\n\n    ***\n\n    Need to test on specific mobile platforms\n\n</div>\n\n### Approval Process\n\n```mermaid\ngraph LR\n    A[Need Mobile Device?]:::start --> B[Write Business Justification]:::proc\n    B --> C[Submit to Manager]:::proc\n    C --> D{Approved?}:::decide\n    D -->|No| E[Use Personal Device]:::out\n    D -->|Yes| F[Purchase Device]:::proc\n    F --> G[Submit Receipt to Finance]:::proc\n    G --> H[Receive Reimbursement]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n## Device Management & Security 🔒\n\n### Rippling MDM: Mandatory Requirement\n\n!!! danger \"Critical Security Requirement\"\n\n    **All devices used for work MUST have Rippling MDM installed**\n\n    This applies to:\n\n    - MacBook Air/Pro\n    - Windows 11 devices (Windows 11 Pro required)\n    - iPads\n    - iPhones\n    - Android devices\n    - Personal devices (BYOD)\n\n**Installation Required:**\n\n- Install from the device enrollment page in your Rippling account\n- Must be installed **before** accessing any company data\n- Failure to install blocks access to company resources\n\n### Security & Compliance Policies\n\nAll devices must adhere to these security requirements enforced via Rippling MDM:\n\n<div class=\"grid cards\" markdown>\n\n- :material-lock: **Encryption**\n\n    ***\n\n    Full disk encryption (FileVault) enabled\n\n- :material-key: **Strong Passwords**\n\n    ***\n\n    Device protected with complex password\n\n- :material-update: **Auto Updates**\n\n    ***\n\n    Security updates enabled automatically\n\n- :material-shield-check: **Compliance**\n\n    ***\n\n    Regular compliance checks performed\n\n- :material-remote: **Remote Management**\n\n    ***\n\n    IT can remotely lock or wipe if needed\n\n</div>\n\n!!! warning \"Strict Compliance Enforcement\"\n\n    Devices without properly configured Rippling MDM:\n\n    - ❌ Not permitted for work use\n    - ❌ Blocked from accessing company resources\n    - ❌ Cannot access email, Slack, or internal tools\n\n## Bring Your Own Device (BYOD) Policy 🤝\n\n!!! info \"Limited Approval\"\n\n    While company-provided hardware is the standard, personal devices may be used in **limited, pre-approved circumstances**.\n\n### Requirements for BYOD\n\n| Requirement                 | Details                                          |\n| --------------------------- | ------------------------------------------------ |\n| **Approval**                | Explicit approval from manager AND IT department |\n| **MDM Installation**        | **Mandatory** Rippling MDM enrollment            |\n| **Security Compliance**     | Must meet all security policies                  |\n| **Employee Responsibility** | You maintain and care for your device            |\n\n!!! tip \"Recommendation\"\n\n    **Company-provided hardware is strongly recommended** over BYOD for:\n\n    - Better security and compliance\n    - Standardized support experience\n    - No personal device risk\n    - Clear separation of work/personal\n\n## Care, Maintenance, and Support 🛠️\n\n### Employee Responsibility\n\n<div class=\"grid cards\" markdown>\n\n- :material-hand-heart: **Professional Use**\n\n    ***\n\n    Use equipment professionally and responsibly\n\n- :material-shield-star: **Physical Protection**\n\n    ***\n\n    Keep devices physically protected and clean\n\n- :material-close-circle: **No DIY Repairs**\n\n    ***\n\n    Don't attempt unauthorized repairs\n\n- :material-update: **Install Updates**\n\n    ***\n\n    Install security updates promptly\n\n</div>\n\n### Reporting Damage or Loss\n\n!!! danger \"Report Immediately to IT Support\"\n\n    **Slack:** `#it-support` channel\n\n    Report any of the following immediately:\n\n    - [ ] Physical damage to equipment\n    - [ ] Lost or stolen device\n    - [ ] Hardware malfunction\n    - [ ] Suspected security incidents or viruses\n\n## Hardware Ownership and Return 📋\n\n### Ownership\n\n!!! info \"Company Property\"\n\n    All hardware purchased or reimbursed by Ultralytics is **company property**.\n\n### Return Process Upon Departure\n\n**Coordinate with your manager and IT department to return all equipment on your last day:**\n\n- In-person handoff at office (standard)\n- IT provides pre-paid shipping labels if needed\n- All equipment must be returned within 3 business days\n\n!!! warning \"Equipment Return Checklist\"\n\n    Before returning equipment:\n\n    - [ ] Back up personal files (nothing personal should be stored)\n    - [ ] Sign out of all accounts\n    - [ ] Remove personal data\n    - [ ] Factory reset not required (IT will handle)\n    - [ ] Include all accessories (chargers, cables, etc.)\n\n## Reimbursement Process 💰\n\nAll hardware purchases must follow standard company reimbursement procedures:\n\n```mermaid\ngraph TD\n    A[Purchase Approved Hardware]:::start --> B[Keep All Receipts]:::proc\n    B --> C[Submit to Finance Team]:::proc\n    C --> D[Include Business Justification]:::proc\n    D --> E[Finance Reviews]:::proc\n    E --> F{Approved?}:::decide\n    F -->|Yes| G[Reimbursement Processed]:::proc\n    F -->|No| H[Request More Info]:::proc\n    H --> C\n    G --> I[Month-End Payment]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n!!! tip \"Reimbursement Tips\"\n\n    - Submit all receipts to Finance team\n    - Include clear description of business purpose\n    - For detailed procedures, see [Finance Handbook](../finance/index.md)\n    - Approved expenses submitted by the monthly cutoff are paid together in the next reimbursement batch\n"}, {"type": "file", "name": "index.md", "path": "tools/index.md", "content": "---\ndescription: Ultralytics Tools Overview covering hardware, software, and key procedures for all employees.\nkeywords: Ultralytics tools, hardware policy, software policy, IT support, employee equipment\n---\n\n# Tools Overview 🛠️\n\nWelcome to the Ultralytics Tools section. This hub is your guide to the hardware, software, and digital services we use to build the future of AI. Our goal is to provide you with the best resources while maintaining a secure and efficient work environment.\n\nBelow you'll find links to our core policies and a quick reference guide for common tasks.\n\n---\n\n## Core Policies\n\n### [Hardware Policy](./hardware.md) 🖥️\n\nThis policy covers the complete lifecycle of your physical devices, from acquisition to replacement. It ensures that equipment is provisioned fairly and managed securely.\n\n- **Standard Equipment:** Details on MacBook Air and MacBook Pro configurations.\n- **Refresh Cycle:** Guidelines on the 2-year refresh and upgrade process.\n- **Replacements:** The required **Apple Trade-In** process for all upgrades.\n- **Device Security:** Mandatory **Rippling MDM** installation for all devices.\n\n### [Software Policy](./software.md) 💾\n\nThis policy governs the use of all applications and digital tools. It is designed to maximize productivity and collaboration while protecting the company from security and legal risks.\n\n- **Standard Suite:** Information on pre-installed applications and licensing.\n- **Requesting Software:** The approval process for acquiring new applications.\n- **Acceptable Use:** Clear guidelines on business vs. personal use of software.\n- **Security:** Requirements for passwords, data handling, and system updates.\n\n### [Email Signatures](./email-signatures.md) 📧\n\nThis guide explains how company email signatures are standardized and automated. It ensures all communications maintain a consistent, professional appearance.\n\n- **Automation:** Signatures are updated automatically via Google Workspace.\n- **Template:** The standard format for all employee signatures.\n- **Legal Disclaimers:** Information on auto-appended confidentiality notices.\n- **Setup:** Instructions to ensure your signature is enabled correctly in Gmail.\n\n---\n\n## Quick Reference Guide ⚡\n\nThis is a summary of the most common procedures. For full details, please refer to the specific policy pages.\n\n!!! tip \"New to Ultralytics?\"\n\n    Check out the [Onboarding Guide](../people/onboarding.md) for a complete first 90 days roadmap, including detailed equipment setup instructions.\n\n- **New Equipment:** Standard issue for new hires is a **MacBook Air** and **AirPods Pro**.\n- **Replacements & Upgrades:** You are eligible for a hardware refresh every **2 years**. The **Apple Trade-In** process is required for all replacements.\n- **Reimbursement:** For replacements, the reimbursed amount is the **net cost** (new device price minus the Apple trade-in credit).\n- **Mandatory Security:** All devices used for work (computers and mobile) **MUST** have **Rippling MDM** installed before use.\n\n---\n\n## Who to Contact 🤝\n\n!!! question \"Need Help?\"\n\n    | Question Type | Contact |\n    | ------------- | ------- |\n    | **Technical issues, device setup, or security** | `#it-support` on Slack |\n    | **Purchases, reimbursements, or budgets** | Finance Team in `#finance` |\n    | **Policy exceptions or hardware approvals** | Your direct manager |\n    | **People-related approvals** | `#hr` on Slack |\n\nThis framework ensures our technology resources are managed consistently, securely, and effectively across our global organization. 🚀\n"}, {"type": "file", "name": "software.md", "path": "tools/software.md", "content": "---\ndescription: Ultralytics Software Policy covering approved applications, licensing, security requirements, acceptable use, and support procedures for all employees.\nkeywords: Ultralytics software policy, software licensing, approved applications, security software, Rippling, employee software, acceptable use\n---\n\n# Software Policy 💾\n\n## 1. Purpose and Guiding Principles\n\nThis policy governs the acquisition, installation, and use of all software on company-owned and managed devices. Our goal is to provide employees with the best tools to foster innovation and productivity while maintaining a secure and stable technology environment.\n\n- **Security First:** The integrity of our data and systems is paramount.\n- **Legal Compliance:** We use only properly licensed and approved software.\n- **Productivity & Collaboration:** We standardize tools to ensure seamless collaboration across our global team.\n\n## 2. Standard Software Suite 💻\n\nAll company-provided computers come with a standard suite of pre-installed and approved software to cover core business functions and include the latest security updates.\n\n### Core Application Categories\n\nWhile the specific application list is maintained by the Security team, the standard suite includes:\n\n- **Operating System:** The latest version of macOS.\n- **Productivity Suite:** Core applications for documents, spreadsheets, and presentations (e.g., Google Workspace, Microsoft Office).\n- **Communication:** Company-approved tools for email, chat, and video conferencing (e.g., Slack, Google Meet).\n- **Security:** Mandatory antivirus, firewall, and device management software (**Rippling**).\n- **Web Browsers:** Approved browsers like Google Chrome with required security extensions.\n- **Technical Tools:** For developer and technical roles, this includes approved IDEs, code editors, and other development utilities.\n\n## 3. Software Approval & Vendor Lifecycle 📥\n\nTo maintain security and compatibility, all software not included in the standard suite must be approved before installation.\n\n!!! note \"Team Member Access\"\n\n    Some of the links in this section can only be accessed by Ultralytics team members.\n\n### Approval & Installation Process\n\n1. **Manager Approval:** Before you start, check if the vendor already exists in our [Approved Vendor Database](https://www.notion.so/218fe6fef1c3804d9479f0d3dd78ca62?v=218fe6fef1c3819b804e000c8232e2c2&source=copy_link). Once you've confirmed this, send a software request to your direct manager, including a clear business justification and the cost, if any.\n2. **Submit Vendor Onboarding Request:** Your manager or any team member on the manager's behalf must submit the request via the [Vendor Onboarding Form](https://www.notion.so/218fe6fef1c38093a6cef5c63000dfaf?pvs=106). This is a mandatory step to understand potential risks from the tools we use.\n3. **Multi-Team Review:** The request will be reviewed by Legal and Security teams to ensure comprehensive evaluation before approval.\n4. **Final Approval:** Once the Legal and Security teams give their approval, your manager will provide the final sign-off. You can track progress and final sign-off status via this [Tracking Overview](https://www.notion.so/218fe6fef1c3804d9479f0d3dd78ca62?v=218fe6fef1c38004b5d9000c06a69134&source=copy_link).\n5. **Purchase & Installation:** For paid software, follow the standard [reimbursement procedures](../finance/index.md#reimbursements).\n\n!!! warning \"Prohibition of Unauthorized Software\"\n\n    The installation of any software that has not been approved through this process is strictly prohibited. This includes personal software on company devices, unlicensed or \"cracked\" applications, and any tool that could compromise system security.\n\n### Ongoing Vendor Management\n\n1. **Track Vendor Changes:** Monitor your approved vendors for any significant modifications that could impact security, finance, or compliance requirements.\n2. **Submit Change Request:** When updates occur, submit details via the [Vendor Change Form](https://www.notion.so/23ffe6fef1c380ee8e7ad4d73551e188?pvs=106). This ensures our Legal and Security team can assess any new risks. Key changes to report include security incidents, changes in data categories, vendor offboarding, changes in tool ownership, or price changes over $500/year.\n3. **Review Process:** The Security, Legal, and Finance teams will evaluate the changes to determine if additional approvals or actions are needed.\n\n## 4. Tool Access Request Process 🛠️\n\n### Requesting Access\n\nTeam members can request access to tools through Vanta, either via Slack or the Vanta platform.\n\n### How to Submit a Request\n\n**Via Slack**\n\n- Open Vanta app, navigate to Home tab and select `Submit access request`\n- See the [Vanta Help Article](https://help.vanta.com/en/articles/11345423-managing-access-requests-in-vanta) for details\n\n**Via Vanta**\n\n- Log into the [Ultralytics Vanta portal](https://app.vanta.com/c/ultralytics/access/systems/request)\n- Navigate to `My access requests` from the left-hand menu\n- See the [Vanta Help Article](https://help.vanta.com/en/articles/11345423-managing-access-requests-in-vanta) for details\n\n### What to Include in Your Request\n\nWhen submitting an access request:\n\n1. Select the tool you need\n2. Choose the appropriate user role (if applicable)\n3. Provide a clear business justification\n4. If elevated permissions (e.g. admin, owner) are required, specify this and explain the need\n5. Submit the request for approval\n\nOnce the **System Approver** approves your request, the **System Admin** will provision access as soon as possible. After provisioning is complete, you will receive a notification from the Vanta app in Slack as well as a confirmation email.\n\n### Access Request Workflow\n\n```mermaid\nflowchart TD\nA@{ label: \"Log into Vanta and navigate to <a href='https://app.vanta.com/c/ultralytics/access/systems/request'>My access requests</a> dashboard, or look up Vanta app in Slack, and Submit access request\" } --> B{\"Did you find the tool you need?\"}:::decide\n    B -- Yes --> C[\"Select the tool you need and request access\"]:::proc\n    B -- No --> D[\"Follow <a href='https://handbook.ultralytics.com/tools/software/#3-software-approval-vendor-lifecycle'>New Software Approval Process</a>\"]:::proc\n    n3[\"Need access to a tool?\"]:::start --> A\n    C --> n4[\"Did the Approver approve your request?\"]:::decide\n    n4 -- Yes --> n1[\"Admin will provision you access or inform you how to gain access if the tool relies on shared credentials.\"]:::out\n    n4 -- No --> n5[\"The Approver will provide you with the rejection reason.\"]:::error\n\n    A@{ shape: rect}\n    n3@{ shape: rect}\n    n4@{ shape: diam}\n    n5@{ shape: rect}\n\n    A:::proc\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n    classDef error fill:#F44336,color:#fff\n```\n\n### Best Practice for System Approvers\n\nSystem Approvers may review access requests via **email, Slack, or directly within Vanta**. Refer to [Vanta guidance for additional information.](https://help.vanta.com/en/articles/11345423-managing-access-requests-in-vanta)\n\n**Approval Guidelines**\n\n- **Respond promptly:** Review requests within one business day\n- **Verify necessity:** Ensure the requested access aligns with the team member’s responsibilities\n- **Apply least privilege:** Approve only the minimum access level required\n- **Confirm justification**: Elevated roles should be approved only with clear, documented business need\n\n### Best Practice for System Admins\n\nSystem Admins are responsible for provisioning tool access once approved. Provisioning is **not automated** and must be completed manually within each tool.\n\n**Approval Guidelines**\n\n- **Respond promptly:** Provision access within one business day of approval\n- **Verify approval:** Confirm approval details before granting access\n- **Grant lowest privilege:** Assign the minimum necessary access unless a higher level is explicitly approved\n- **Document in Vanta:** Mark the request as ‘Provisioned’ once access is granted\n  For assistance, contact the Security & Compliance team in the **#it-support** or **#compliance** Slack channels.\n\n## 5. Acceptable Use Policy 🛡️\n\n### Business vs. Personal Use\n\nCompany-provided software and devices are intended primarily for business purposes. However, we permit limited and reasonable personal use provided it:\n\n- Does **not** interfere with your work performance or responsibilities.\n- Does **not** compromise the security or integrity of company systems.\n- Does **not** violate any other company policies.\n- Does **not** incur any additional cost for the company.\n\n### Prohibited Activities\n\nThe following activities are strictly forbidden on company devices:\n\n- Using software for any illegal purpose, including copyright infringement.\n- Installing or distributing unlicensed, pirated, or unauthorized software.\n- Accessing, downloading, or distributing offensive, discriminatory, or pornographic material.\n- Circumventing or disabling security measures, including antivirus and MDM software.\n- Sharing confidential company information or data through unauthorized platforms.\n- Engaging in any activity that could harm the company's reputation or systems.\n\n## 6. Security and Compliance 🔒\n\nEvery employee shares the responsibility for protecting our digital assets.\n\n### System & Security Software\n\n- **Antivirus & Malware Protection:** All devices must have company-approved security software installed and running at all times. Tampering with this software is a policy violation.\n- **System Updates:** Keep your operating system and all applications updated. Enable automatic updates whenever possible to patch vulnerabilities promptly.\n- **Firewall:** The built-in OS firewall must be enabled on all computers.\n\n### Data Security\n\n- **Handling Sensitive Data:** Use only company-approved applications and secure, encrypted channels for storing or transmitting confidential or sensitive information.\n- **Backups:** You are responsible for ensuring your critical work files are saved to approved cloud storage solutions (e.g., Google Drive) and not just locally on your device.\n\n### Password Management\n\n- **Password Manager:** Using a company-approved password manager is required. This helps create and store strong, unique passwords for every service.\n- **Multi-Factor Authentication (MFA):** MFA must be enabled on all accounts that support it, especially for critical systems like Google Workspace, Slack, and Rippling.\n\n## 7. IT Support 🤝\n\n### How to Get Help\n\nIf you have any software-related issues, please reach out in the #it-support Slack channel.\n\n### Service Level Agreements (SLAs)\n\nOur team prioritizes requests to ensure critical issues are handled swiftly.\n\n- **Critical (System-wide outage, security breach):** 1-hour response\n- **High (Individual unable to work):** 4-hour response\n- **Normal (Minor issue, software request):** 24-hour response\n"}]}, {"type": "dir", "name": "workflows", "path": "workflows", "children": [{"type": "file", "name": "ci-testing.md", "path": "workflows/ci-testing.md", "content": "---\ndescription: Ultralytics CI/CD workflow covering GitHub Actions, automated tests, code coverage with Codecov, and quality checks for YOLO development.\nkeywords: Ultralytics, CI/CD, continuous integration, testing, GitHub Actions, pytest, Codecov, code quality, YOLO, Docker\n---\n\n# CI/Testing Workflow 🧪\n\nContinuous Integration (CI) is essential for maintaining high-quality code by catching issues early. This guide covers CI testing and quality checks for [Ultralytics](https://www.ultralytics.com/) projects.\n\n## CI Actions 🔄\n\nAll PRs must pass automated CI checks before merging. Our CI pipeline includes:\n\n### [CI Tests](https://github.com/ultralytics/ultralytics/actions/workflows/ci.yml)\n\nPrimary CI test running unit tests, linting checks, and comprehensive tests.\n\n### [Docker Deployment](https://github.com/ultralytics/ultralytics/actions/workflows/docker.yml)\n\nValidates deployment using Docker, ensuring Dockerfile and related scripts work correctly.\n\n### [Broken Links](https://github.com/ultralytics/ultralytics/actions/workflows/links.yml)\n\nScans codebase for broken or dead links in markdown and HTML files.\n\n### [CodeQL Analysis](https://github.com/ultralytics/ultralytics/actions/workflows/codeql.yaml)\n\nGitHub's semantic analysis tool for finding potential security vulnerabilities and maintaining code quality.\n\n### [PyPI Publishing](https://github.com/ultralytics/ultralytics/actions/workflows/publish.yml)\n\nValidates project can be packaged and published to PyPI without errors.\n\n## Platform Testing 🖥️\n\nTests run on multiple environments:\n\n- **OS**: Ubuntu, Windows, macOS\n- **Python**: 3.8, 3.9, 3.10, 3.11, 3.12\n\n## Code Coverage 📊\n\nWe use [Codecov](https://about.codecov.io/) to measure and visualize code coverage, providing insights into how well tests exercise the codebase.\n\n### Coverage Integration\n\nCodecov integration provides:\n\n- Detailed coverage insights\n- Coverage comparisons between commits\n- Visual overlays on code showing covered lines\n- Coverage percentage for the `ultralytics` package\n\nView full coverage details at [codecov.io/github/ultralytics/ultralytics](https://app.codecov.io/github/ultralytics/ultralytics).\n\n### Understanding Coverage\n\nCode coverage shows what percentage of code is executed during tests. High coverage indicates well-tested code but doesn't guarantee absence of bugs. Coverage helps identify untested areas that might be prone to errors.\n\n## Running Tests Locally 🖥️\n\n### Install Development Dependencies\n\n```bash\npip install -e \".[dev]\"\n```\n\n### Run All Tests\n\n```bash\npytest tests/\n```\n\n### Run Specific Tests\n\n```bash\n# Single file\npytest tests/test_engine.py\n\n# Single test function\npytest tests/test_engine.py::test_train\n\n# Tests matching pattern\npytest -k \"export\"\n\n# Slow tests only\npytest -m slow\n```\n\n### Run with Coverage\n\n```bash\npytest --cov=ultralytics tests/\n```\n\n### Parallel Testing\n\n```bash\n# Install pytest-xdist\npip install pytest-xdist\n\n# Run tests in parallel\npytest -n auto\n```\n\n## Writing Tests ✍️\n\n### Test Structure\n\n```python\nfrom pathlib import Path\n\nfrom ultralytics import YOLO\n\n\ndef test_model_export():\n    \"\"\"Test ONNX model export.\"\"\"\n    model = YOLO(\"yolo26n.pt\")\n    model.export(format=\"onnx\")\n    assert Path(\"yolo26n.onnx\").exists()\n```\n\n### Best Practices\n\n- **Descriptive names**: `test_export_onnx_format()` not `test_1()`\n- **Single assertion**: Test one thing per function\n- **Fast tests**: Use small models/datasets\n- **Fixtures**: Use pytest fixtures for setup/teardown\n- **Markers**: `@pytest.mark.slow` for long-running tests\n\n### Test Organization\n\n```\ntests/\n├── test_engine.py      # Training, validation, prediction\n├── test_nn.py          # Model architecture\n├── test_data.py        # Dataset handling\n├── test_utils.py       # Utility functions\n└── test_exports.py     # Export formats\n```\n\n### Test Markers\n\n```python\nimport pytest\n\n\n@pytest.mark.slow\ndef test_full_training():\n    \"\"\"Test full training run (slow).\"\"\"\n    model = YOLO(\"yolo26n.pt\")\n    model.train(data=\"coco128.yaml\", epochs=1)\n```\n\n## Code Quality Checks 🎯\n\n### Formatting with Ruff\n\n```bash\n# Check formatting\nruff check ultralytics/\n\n# Auto-fix issues\nruff check --fix ultralytics/\n\n# Format code\nruff format ultralytics/\n```\n\nLearn more about code standards in our [development workflow](development.md).\n\n### Type Checking\n\n```bash\n# Run mypy (where configured)\nmypy ultralytics/\n```\n\n### Docstring Formatting\n\n```bash\npip install ultralytics-actions\n```\n\n```bash\n# Auto-fix\nultralytics-actions-format-python-docstrings .\n```\n\n## CI Troubleshooting 🔧\n\n### Tests Pass Locally But Fail in CI\n\nCommon causes:\n\n- **Platform-specific issues**: Test on target OS\n- **Python version differences**: Check version compatibility\n- **Missing dependencies**: Verify CI config\n- **Timing/concurrency issues**: Add retries or increase timeouts\n\n### Slow CI Runs\n\nSolutions:\n\n- Use `@pytest.mark.slow` for expensive tests\n- Mock external dependencies\n- Reduce test dataset sizes\n- Parallelize with `pytest-xdist`\n\n### Flaky Tests\n\nFixes:\n\n- Add retries for network-dependent tests\n- Increase timeouts for slow operations\n- Fix race conditions in async code\n- Use deterministic random seeds\n\n## Performance Benchmarks 📈\n\nCI tracks key metrics:\n\n- Inference speed (FPS)\n- Memory usage\n- Model size\n- Export times\n\nSignificant regressions block merging. If metrics change:\n\n1. Verify change is expected\n2. Document reason in PR\n3. Get approval from maintainers\n\n## CI Status 📋\n\nCheck CI status for all Ultralytics repositories at [docs.ultralytics.com/help/CI](https://docs.ultralytics.com/help/CI).\n\n### Main Repository Badges\n\n![CI](https://github.com/ultralytics/ultralytics/actions/workflows/ci.yml/badge.svg)\n![Docker](https://github.com/ultralytics/ultralytics/actions/workflows/docker.yml/badge.svg)\n![Links](https://github.com/ultralytics/ultralytics/actions/workflows/links.yml/badge.svg)\n![PyPI](https://github.com/ultralytics/ultralytics/actions/workflows/publish.yml/badge.svg)\n![codecov](https://codecov.io/gh/ultralytics/ultralytics/branch/main/graph/badge.svg?token=HHW7IIVFVY)\n\n## Skipping CI Checks ⚠️\n\nAdd `[skip ci]` to commit message to skip CI (use sparingly):\n\n```bash\ngit commit -m \"Update README [skip ci]\"\n```\n\nOnly for:\n\n- Documentation-only changes\n- Non-code file updates\n- Emergency hotfixes (with approval)\n\n## Resources 📚\n\n- [Official CI Guide](https://docs.ultralytics.com/help/CI) - Complete CI documentation\n- [Development Workflow](development.md) - PR process and code standards\n- [GitHub Actions Docs](https://docs.github.com/en/actions) - CI configuration\n- [pytest Documentation](https://docs.pytest.org/en/stable/) - Testing framework\n- [Codecov](https://app.codecov.io/github/ultralytics/ultralytics) - Coverage reports\n"}, {"type": "file", "name": "development.md", "path": "workflows/development.md", "content": "---\ndescription: Ultralytics development workflow covering PR process, CLA signing, Google-style docstrings, code standards, and Git practices for YOLO contributions.\nkeywords: Ultralytics, development workflow, pull requests, code review, Git, GitHub, CLA, docstrings, YOLO, Python, contributing\n---\n\n# Development Workflow 💻\n\nThis guide covers how Ultralytics employees and contributors plan, implement, review, test, and merge changes across [Ultralytics](https://www.ultralytics.com/) projects, including YOLO and related repositories.\n\nThe workflow is intentionally lightweight: keep changes focused, make review easy, run the right checks, and leave enough context for teammates to understand the decision later.\n\n## Code of Conduct 🤝\n\nAll contributors must follow the [Code of Conduct](https://docs.ultralytics.com/help/code-of-conduct). Respect, clarity, and professionalism are expected in issues, PRs, reviews, internal discussions, and public community spaces. For public contribution requirements, see the [Official Contributing Guide](https://docs.ultralytics.com/help/contributing).\n\n## Collaboration Cadence 🛰️\n\n- **Anchor Days (Tue/Wed/Thu):** Use these days for code reviews, design discussions, debugging sessions, and decisions that benefit from synchronous collaboration.\n- **Mon/Fri:** Favor deep work, written updates, PR preparation, and async review. Move critical blockers to the next Anchor Day when synchronous alignment is needed.\n- **Standups & Reviews:** Timebox standups to 15 minutes. Schedule design and architecture reviews on Anchor Days when possible.\n- **Decision Records:** Capture important decisions in PR descriptions, issues, docs, or runbooks so context does not disappear in chat.\n\n## Scope and Ownership 🧭\n\nThis workflow applies to Ultralytics engineering work across product, [Ultralytics Platform](https://platform.ultralytics.com), YOLO, infrastructure, documentation, automation, and security-sensitive systems. Individual repositories may add stricter requirements, but they should not weaken the baseline expectations in this page.\n\nEvery work item should have a clear owner:\n\n- **Author:** Implements the change, keeps the PR current, and provides validation evidence.\n- **Reviewer:** Confirms correctness, maintainability, risk, and documentation impact.\n- **Domain owner:** Reviews changes affecting a specialized area such as model behavior, infrastructure, security, privacy, licensing, or customer-facing workflows.\n- **Triage owner:** Assigns incoming issues, incidents, vulnerability reports, and maintenance work to the right owner.\n\n!!! tip \"Triage expectations\"\n\n    New engineering work should be triaged for impact, priority, ownership, and risk. Security, production, customer-impacting, and compliance-related work should receive an explicit owner and follow-up path instead of staying as an unassigned issue or chat thread.\n\n## Pull Request Process 🔄\n\n```mermaid\nflowchart TD\n    A[Fork or Sync Repository]:::start --> B[Create Feature Branch]:::proc\n    B --> C[Make Changes]:::proc\n    C --> D[Run Tests Locally]:::proc\n    D --> E[Commit Changes]:::proc\n    E --> F[Create Pull Request]:::proc\n    F --> G[Sign CLA]:::proc\n    G --> H{Review}:::decide\n    H -->|Changes Requested| I[Address Feedback]:::proc\n    I --> H\n    H -->|Approved| J[Merge!]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n### 1. Fork or Sync the Repository\n\nExternal contributors should [fork](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/working-with-forks/fork-a-repo) the relevant Ultralytics repository, such as [ultralytics/ultralytics](https://github.com/ultralytics/ultralytics), to their GitHub account.\n\nEmployees with write access should sync `main` before branching:\n\n```bash\n# External contributors\ngit clone https://github.com/YOUR_USERNAME/ultralytics.git\ncd ultralytics\n\n# Employees with write access\ngit checkout main\ngit pull origin main\n```\n\n### 2. Create a Feature Branch\n\n[Create a branch](https://docs.github.com/en/desktop/making-changes-in-a-branch/managing-branches-in-github-desktop) with a clear, descriptive name that reflects the work:\n\n```bash\ngit checkout -b fix-issue-123\n```\n\n!!! tip \"Branch Naming Conventions\"\n\n    - `fix-export-timeout` for bug fixes\n    - `add-training-metrics` for features\n    - `update-docs-training` for documentation\n    - `ci-link-check` for automation or infrastructure\n\n### 3. Make Your Changes\n\n<div class=\"grid cards\" markdown>\n\n- :material-check-circle: **Follow Guidelines**\n\n    ***\n\n    Follow the repository's existing patterns and style\n\n- :material-alert-circle: **Avoid Errors**\n\n    ***\n\n    Avoid new warnings, regressions, or unrelated churn\n\n- :material-target: **Stay Focused**\n\n    ***\n\n    Keep the PR scoped to one clear outcome\n\n</div>\n\n### 4. Test Your Changes\n\n!!! warning \"Testing Required\"\n\n    Run the checks that match the risk of your change before requesting review:\n\n    ```bash\n    pytest tests/\n    ```\n\n    Add tests for new functionality and regression tests for bug fixes. If a relevant check cannot be run locally, explain why in the PR and include manual validation notes.\n\nLearn more: [Testing Requirements](ci-testing.md), [Model Validation](https://docs.ultralytics.com/modes/val), [CI Workflows](https://docs.ultralytics.com/help/CI)\n\n### 5. Commit Your Changes\n\n[Commit](https://docs.github.com/en/desktop/making-changes-in-a-branch/committing-and-reviewing-changes-to-your-project-in-github-desktop) with concise, descriptive messages:\n\n```bash\ngit commit -m \"Fix #123: Corrected calculation error\"\n```\n\n!!! tip \"Commit Message Best Practices\"\n\n    - Use present tense (\"Add feature\" not \"Added feature\")\n    - Reference issue numbers when applicable\n    - Keep subject line under 72 characters\n\n### 6. Create Pull Request\n\n[Submit PR](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/creating-a-pull-request) from your branch to `main`:\n\n=== \"PR Checklist\"\n\n    - [ ] Clear title describing the change\n    - [ ] Description covering purpose, scope, and validation\n    - [ ] Link related issues\n    - [ ] Owner and required reviewers are clear\n    - [ ] Note risks, compatibility concerns, or rollout steps\n    - [ ] Include screenshots for UI changes\n    - [ ] Tests passing locally\n\n### 7. Sign the CLA\n\n!!! warning \"Required Before Merge\"\n\n    External contributors must sign the [Contributor License Agreement (CLA)](https://docs.ultralytics.com/help/CLA) so contributions are properly licensed under the [AGPL-3.0 license](https://www.ultralytics.com/legal/agpl-3-0-software-license).\n\nAfter submitting your PR, add this comment:\n\n```\nI have read the CLA Document and I sign the CLA\n```\n\nThe CLA bot will guide you through the process. For more details on licensing, see our [contributing guide](https://docs.ultralytics.com/help/contributing).\n\n### 8. Address Review Feedback\n\nRespond to reviewer comments, push updates, and keep the PR description current if the scope changes. Resolve all blocking feedback before requesting re-review.\n\n## Google-Style Docstrings 📝\n\nPublic functions and classes should use [Google-style docstrings](https://google.github.io/styleguide/pyguide.html) where the repository expects them. Keep docstrings accurate, concise, and useful for future maintainers.\n\n### Standard Function\n\n```python\ndef example_function(arg1, arg2=4):\n    \"\"\"Example function demonstrating Google-style docstrings.\n\n    Args:\n        arg1 (int): The first argument.\n        arg2 (int): The second argument.\n\n    Returns:\n        (bool): True if arguments are equal, False otherwise.\n\n    Examples:\n        >>> example_function(4, 4)  # True\n        >>> example_function(1, 2)  # False\n    \"\"\"\n    return arg1 == arg2\n```\n\n### Named Returns\n\n```python\ndef example_function(arg1, arg2=4):\n    \"\"\"Example function with named return.\n\n    Args:\n        arg1 (int): The first argument.\n        arg2 (int): The second argument.\n\n    Returns:\n        equals (bool): True if arguments are equal, False otherwise.\n\n    Examples:\n        >>> example_function(4, 4)  # True\n    \"\"\"\n    equals = arg1 == arg2\n    return equals\n```\n\n### Multiple Returns\n\n```python\ndef example_function(arg1, arg2=4):\n    \"\"\"Example function with multiple returns.\n\n    Args:\n        arg1 (int): The first argument.\n        arg2 (int): The second argument.\n\n    Returns:\n        equals (bool): True if arguments are equal, False otherwise.\n        added (int): Sum of both input arguments.\n\n    Examples:\n        >>> equals, added = example_function(2, 2)  # True, 4\n    \"\"\"\n    equals = arg1 == arg2\n    added = arg1 + arg2\n    return equals, added\n```\n\n**Important:** When a function returns multiple values, document each return value separately instead of hiding important details inside a generic tuple description.\n\n✅ **Good:**\n\n```\nReturns:\n    (np.ndarray): Predicted masks with shape HxWxN.\n    (list): Confidence scores for each instance.\n```\n\n❌ **Bad:**\n\n```\nReturns:\n    (tuple): Tuple containing:\n        - (np.ndarray): Predicted masks with shape HxWxN.\n        - (list): Confidence scores for each instance.\n```\n\n### With Type Hints\n\n```python\ndef example_function(arg1: int, arg2: int = 4) -> bool:\n    \"\"\"Example function with type hints.\n\n    Args:\n        arg1: The first argument.\n        arg2: The second argument.\n\n    Returns:\n        True if arguments are equal, False otherwise.\n\n    Examples:\n        >>> example_function(1, 1)  # True\n    \"\"\"\n    return arg1 == arg2\n```\n\n### Single-Line Docstrings\n\n```python\ndef example_small_function(arg1: int, arg2: int = 4) -> bool:\n    \"\"\"Example function with a single-line docstring.\"\"\"\n    return arg1 == arg2\n```\n\n## Code Standards 📐\n\n### Python Style\n\n| Standard       | Requirement                                                      | Example                                      |\n| -------------- | ---------------------------------------------------------------- | -------------------------------------------- |\n| **Line Width** | Follow the repository configuration, commonly 120 characters     | Keep lines readable and scannable            |\n| **Docstrings** | [Google-style](https://google.github.io/styleguide/pyguide.html) | Use types and examples where helpful         |\n| **Imports**    | Prefer `pathlib` over manual path string handling                | Modern, cross-platform paths                 |\n| **Type Hints** | Use when they improve clarity                                    | Public APIs, complex structures, return data |\n| **Functions**  | Keep focused and testable                                        | Split complex logic into named helpers       |\n\n### Code Quality\n\n!!! success \"Quality Checklist\"\n\n    === \"Clean Code\"\n\n        - [x] No unused imports or variables\n        - [x] Consistent naming (`lowercase_with_underscores`)\n        - [x] Clear variable names; avoid single letters except loop counters\n\n    === \"Formatting\"\n\n        - [x] Use f-strings for string formatting\n        - [x] Comments explain non-obvious decisions, not obvious syntax\n        - [x] Use [Ruff Formatter](https://github.com/astral-sh/ruff) where configured\n\n### Best Practices\n\n<div class=\"grid cards\" markdown>\n\n- :material-content-copy: **Avoid Duplication**\n\n    ***\n\n    Reuse existing helpers and patterns\n\n- :material-focus-field: **Smaller Changes**\n\n    ***\n\n    Prefer focused PRs over broad mixed changes\n\n- :material-lightbulb-on: **Simplify**\n\n    ***\n\n    Remove complexity when it improves clarity\n\n- :material-shield-check: **Compatibility**\n\n    ***\n\n    Preserve public APIs and user workflows\n\n- :material-test-tube: **Add Tests**\n\n    ***\n\n    Cover new behavior and regressions\n\n- :material-format-paint: **Consistent Format**\n\n    ***\n\n    Follow repository formatting tools\n\n</div>\n\n## Security Frameworks 🛡️\n\nUltralytics engineering practices should align with recognized secure development guidance, including [OWASP Secure Software Development Lifecycle](https://owasp.org/www-project-samm/), [OWASP Application Security Verification Standard](https://owasp.org/www-project-application-security-verification-standard/), and [OWASP Top 10](https://owasp.org/www-project-top-ten/). Teams should use these references when planning secure design, review, testing, and remediation work.\n\n## Asset Management 🗂️\n\nEngineering assets should have a clear owner and a reliable source of truth. This includes repositories, services, cloud resources, CI/CD runners, domains, datasets, model artifacts, API keys, secrets, deployment environments, and third-party integrations.\n\nWhen creating, changing, or retiring an asset:\n\n- Assign an owner and maintenance contact.\n- Record purpose, environment, access requirements, and lifecycle state.\n- Review access and least-privilege permissions.\n- Keep secrets and credentials out of code, logs, screenshots, and documentation.\n- Update runbooks, diagrams, inventories, or documentation when ownership or behavior changes.\n- Retire unused assets to reduce security, cost, and maintenance risk.\n\n## Documentation Review 📝\n\nDocumentation should stay aligned with current roles, ownership, workflows, and security expectations. When a process changes, update the relevant handbook page, public docs, runbook, or README in the same PR where practical.\n\nDocumentation reviewers should check:\n\n- Role names, ownership, and escalation paths are current.\n- Security, compliance, and licensing language matches current policy.\n- Links, diagrams, commands, and screenshots still reflect the product or workflow.\n- New or changed processes include a clear owner and review cadence.\n- Public documentation does not expose internal-only information, secrets, customer data, or sensitive operational details.\n\n## Testing Requirements ✅\n\nAll PRs should include validation that matches the risk of the change:\n\n```bash\npytest tests/\n\n# When coverage is relevant\npytest --cov=ultralytics tests/\n```\n\nFor model behavior changes, include the dataset, model, command, hardware, and before/after metrics where practical. For documentation changes, build the docs locally and include screenshots or preview links for layout changes. See [CI/Testing](ci-testing.md) for CI details.\n\n## Code Review Guidelines 👀\n\n### For Contributors\n\n- Keep PRs focused on one feature, fix, or documentation update.\n- Explain the problem, solution, validation, and risks.\n- Respond promptly to feedback.\n- Treat review as part of the work, not a personal judgment.\n- Update the PR description if scope changes.\n\n### For Reviewers\n\n- Review within one to two business days or redirect quickly.\n- Check tests and validation evidence for new behavior.\n- Review documentation updates for user-visible changes.\n- Evaluate performance, compatibility, security, privacy, and maintainability impact.\n- Verify relevant CI checks pass.\n- Provide constructive, specific feedback.\n- Distinguish blocking issues from suggestions.\n\n## Git Best Practices 🌳\n\n### Commits\n\n- Use present tense: \"Add feature\" not \"Added feature\".\n- Write clear, descriptive messages.\n- Keep commits focused and logical.\n- Avoid mixing formatting-only churn with behavior changes.\n\n### Branches\n\n- Pull latest `main` before creating branches.\n- Rebase or merge `main` before final submission when the branch has drifted.\n- Delete branches after merge.\n\n## Reporting Bugs 🐞\n\nReport bugs via [GitHub Issues](https://github.com/ultralytics/ultralytics/issues):\n\n1. **Check existing issues** first\n2. **Provide [Minimum Reproducible Example](https://docs.ultralytics.com/help/minimum-reproducible-example/)**\n3. **Describe environment**: OS, Python version, library versions, hardware (use `yolo checks` for diagnostics)\n4. **Explain expected vs actual behavior** with error messages\n\nFor common issues and solutions, see our [troubleshooting guide](https://docs.ultralytics.com/guides/yolo-common-issues).\n\n## License 📜\n\nMany Ultralytics repositories use the [AGPL-3.0 license](https://www.ultralytics.com/legal/agpl-3-0-software-license). If you use AGPL-licensed Ultralytics code in your project, your project may also need to be open-sourced under AGPL-3.0. If you need closed-source or commercial use, review the [Enterprise License](https://www.ultralytics.com/license).\n\n## Resources 📚\n\n- [Official Contributing Guide](https://docs.ultralytics.com/help/contributing) - Complete contribution guidelines\n- [CI/Testing](ci-testing.md) - Continuous integration details\n- [Documentation](documentation.md) - Writing and maintaining docs\n- [Code of Conduct](https://docs.ultralytics.com/help/code-of-conduct) - Community standards\n- [CLA Instructions](https://docs.ultralytics.com/help/CLA) - Contributor License Agreement guidance\n- [Minimum Reproducible Example](https://docs.ultralytics.com/help/minimum-reproducible-example/) - Bug report examples\n- [Ultralytics Blog](https://www.ultralytics.com/blog) - Latest updates and tutorials\n- [Community Events](https://www.ultralytics.com/events) - Webinars and conferences\n"}, {"type": "file", "name": "documentation.md", "path": "workflows/documentation.md", "content": "---\ndescription: Ultralytics documentation workflow covering writing, building, and maintaining docs for YOLO and Ultralytics projects.\nkeywords: Ultralytics, documentation, MkDocs, writing guides, YOLO docs, API documentation, tutorials\n---\n\n# Documentation Workflow 📚\n\nThis guide covers writing, building, and maintaining documentation for [Ultralytics](https://www.ultralytics.com/) projects.\n\n## Documentation Structure 🗂️\n\n### Main Documentation Sites\n\n- **[docs.ultralytics.com](https://docs.ultralytics.com)** - YOLO technical documentation\n- **[handbook.ultralytics.com](https://handbook.ultralytics.com)** - Company handbook (this site)\n\n### Repository Structure\n\n```\ndocs/\n├── en/              # English docs\n│   ├── index.md     # Homepage\n│   ├── guides/      # User guides\n│   ├── tasks/       # Task-specific docs\n│   ├── models/      # Model documentation\n│   └── reference/   # API reference\n├── zh/              # Chinese translations\n└── overrides/       # Theme customizations\n```\n\n## Writing Documentation ✍️\n\n### Style Guide\n\n- **Clear and concise**: Get to the point quickly\n- **Active voice**: \"Train the model\" not \"The model is trained\"\n- **Code examples**: Show working code for every concept\n- **Visual aids**: Use images/diagrams where helpful\n- **Consistent formatting**: Follow existing page structures\n\n### Markdown Format\n\n````markdown\n---\ndescription: Brief page description for SEO\nkeywords: relevant, keywords, for, search\n---\n\n# Page Title\n\nBrief introduction explaining what this page covers.\n\n## Section Heading\n\nContent with examples:\n\n```python\nfrom ultralytics import YOLO\n\n# Load pretrained model\nmodel = YOLO(\"yolo26n.pt\")\nresults = model(\"image.jpg\")\n```\n\n### Key points:\n\n- Use bullet points for lists\n- Keep paragraphs short\n- Include links to related pages\n\n### Code Examples\n\n- **Minimal**: Show only relevant code\n- **Runnable**: Examples should work copy-paste (test with actual [YOLO models](https://docs.ultralytics.com/models))\n- **Commented**: Explain non-obvious parts\n- **Tested**: Verify examples work with current version\n\n```python\nfrom ultralytics import YOLO\n\n# Load pretrained model\nmodel = YOLO(\"yolo26n.pt\")\n\n# Train on custom data\nresults = model.train(data=\"coco8.yaml\", epochs=3)\n```\n````\n\n### Images and Media\n\nStore in repository or use CDN:\n\n```markdown\n![Alt text](https://path/to/image.png)\n```\n\nKeep image sizes reasonable (<500KB when possible).\n\n## Building Documentation 🔨\n\n### Local Development\n\nInstall dependencies:\n\n```bash\npip install -e \".[docs]\"\n```\n\nBuild and serve locally:\n\n```bash\nmkdocs serve\n```\n\nVisit `http://127.0.0.1:8000` to preview.\n\n### MkDocs Configuration\n\nMain config in `mkdocs.yml`:\n\n```yaml\nsite_name: Ultralytics Docs\ntheme:\n    name: material\n    palette:\n        - scheme: slate\nplugins:\n    - search\n    - ultralytics\n```\n\n## API Documentation 📖\n\nAPI reference is auto-generated from docstrings. See the [complete API reference](https://docs.ultralytics.com/reference/__init__) for all modules:\n\n````python\ndef train(self, data, epochs=100, batch=16):\n    \"\"\"\n    Train the model on a dataset.\n\n    Args:\n        data (str): Path to data YAML file\n        epochs (int): Number of training epochs\n        batch (int): Batch size\n\n    Returns:\n        (Results): Training results\n\n    Examples:\n        ```python\n        model = YOLO(\"yolo26n.pt\")\n        results = model.train(data=\"coco8.yaml\", epochs=100)\n        ```\n    \"\"\"\n````\n\nKey elements:\n\n- **Brief description**: One-line summary\n- **Args**: Parameter descriptions with types\n- **Returns**: Return value description\n- **Examples**: Working code example\n\n## Adding New Pages 📄\n\n### 1. Create Markdown File\n\n```bash\n# Create new guide\ntouch docs/en/guides/new-guide.md\n```\n\n### 2. Update Navigation\n\nEdit `mkdocs.yml`:\n\n```yaml\nnav:\n    - Home: index.md\n    - Guides:\n          - New Guide: guides/new-guide.md\n```\n\n### 3. Write Content\n\nFollow style guide and include examples.\n\n### 4. Test Build\n\n```bash\nmkdocs serve\n```\n\n### 5. Submit PR\n\nFollow [development workflow](development.md) for PR process.\n\n## Translations 🌐\n\n### Adding Translations\n\n1. Copy English version to language directory:\n\n```bash\ncp docs/en/page.md docs/zh/page.md\n```\n\n2. Translate content, keep code examples in English\n\n3. Update `mkdocs.yml` alternate links\n\n### Translation Guidelines\n\n- Keep technical terms in English (YOLO, mAP, FPS)\n- Translate descriptions and explanations\n- Maintain same structure as English version\n- Update translations when English version changes\n\n## Documentation CI 🤖\n\nCI automatically:\n\n- Builds documentation on every PR\n- Checks for broken links\n- Validates markdown formatting\n- Deploys to production on merge to main\n\n### Fixing Build Errors\n\nCommon issues:\n\n- **Broken links**: Fix or remove invalid links\n- **Missing images**: Add images or update paths\n- **Invalid YAML**: Fix frontmatter syntax\n- **Plugin errors**: Check plugin configuration\n\n## Best Practices ✅\n\n### Content Organization\n\n- **Logical structure**: Group related content\n- **Progressive disclosure**: Simple → advanced\n- **Cross-linking**: Link to related pages\n- **Search optimization**: Use clear titles and descriptions\n\n### Maintenance\n\n- **Keep current**: Update for new features\n- **Remove outdated**: Delete deprecated content\n- **Check links**: Fix broken links regularly\n- **User feedback**: Address common questions\n\n### Accessibility\n\n- **Alt text**: Describe images for screen readers\n- **Clear headings**: Use proper heading hierarchy\n- **Plain language**: Avoid jargon when possible\n- **Code contrast**: Ensure code blocks are readable\n\n## Resources 📚\n\n- [MkDocs Documentation](https://www.mkdocs.org/) - Static site generator\n- [Material Theme](https://squidfunk.github.io/mkdocs-material/) - Theme documentation\n- [Markdown Guide](https://www.markdownguide.org/) - Markdown syntax reference\n- [Ultralytics Blog](https://www.ultralytics.com/blog) - Documentation examples and tutorials\n- [Ultralytics Glossary](https://www.ultralytics.com/glossary) - AI and computer vision terminology\n"}, {"type": "file", "name": "product-development.md", "path": "workflows/product-development.md", "content": "---\ndescription: Ultralytics product development workflow covering feature planning, development cycles, release process, and product management for YOLO.\nkeywords: Ultralytics, product development, feature planning, release process, YOLO, product management, roadmap\n---\n\n# Product Development Workflow 🚀\n\nThis guide covers product planning, development cycles, and release processes for [Ultralytics](https://www.ultralytics.com/) products.\n\n## Product Philosophy 🎯\n\n### Core Principles\n\n1. **Ship Fast, Learn Faster**: 2-week iteration cycles, MVP-first approach\n2. **User-Centric**: Build features users request most, validate with data\n3. **Open Source First**: Public development, community feedback drives roadmap\n4. **Performance is a Feature**: Sub-ms inference times, minimal memory footprint\n5. **API-First Design**: Simple, intuitive APIs that developers love\n\n### Development Values\n\n- **Bias to action**: Prototype in days, ship in weeks, not months\n- **Data-driven decisions**: GitHub stars, PyPI downloads, Discord polls guide priorities\n- **Minimum Viable Product**: Release 80% solution fast, iterate to 100%\n- **Continuous deployment**: Main branch is always production-ready\n- **Radical transparency**: Public roadmap, open metrics, community input\n\n## Feature Development Lifecycle 🔄\n\n### 1. Discovery & Planning (Week 1)\n\n**Identify needs** through:\n\n- **User feedback**: GitHub issues (votes), Discord polls, community surveys\n- **Usage analytics**: Feature adoption rates, API endpoint metrics, error logs\n- **Performance data**: Benchmark results, inference times, memory usage\n- **Competitive analysis**: Track competitor releases, market trends\n- **Internal dogfooding**: Use our own tools, identify pain points\n\n**Evaluate against**:\n\n- **User impact**: How many users affected? Pain level (1-10)? Revenue impact?\n- **Technical feasibility**: Engineering effort (S/M/L/XL)? Dependencies? Risks?\n- **Strategic alignment**: Advances YOLO leadership? Supports key verticals?\n- **Resource availability**: Team capacity? Competing priorities? Timeline?\n- **Competitive urgency**: Will competitors ship first? Lock-in risk?\n\n**Output**: Prioritized feature backlog with effort estimates and user impact scores\n\n### 2. Design & Specification (Days 1-3)\n\n**For major features** (>2 weeks engineering time):\n\n- **Design doc**: Problem statement, proposed solution, alternatives considered, success metrics\n- **Technical spec**: API design, architecture diagrams, data models, edge cases\n- **Success criteria**: Quantitative metrics (speed, accuracy, adoption) and user feedback targets\n- **Risk assessment**: Technical risks, dependencies, rollback plan\n- **Team review**: Feedback from engineering, product, and key stakeholders\n\n**For small features** (<1 week engineering time):\n\n- **GitHub issue**: Clear problem description, proposed approach, acceptance criteria\n- **Quick discussion**: 15-min sync with relevant engineers\n- **Go/No-go**: Manager approval to proceed\n\n**Output**: Approved spec with clear scope, success metrics, and timeline\n\n### 3. Implementation (Sprint Execution)\n\n**Sprint planning** (every 2 weeks):\n\n- **Sprint goal**: One clear objective per sprint\n- **Task breakdown**: Split features into <1 day tasks\n- **Capacity planning**: Account for meetings, PR reviews, support\n- **Dependencies**: Identify blockers, coordinate with other teams\n\n**Daily execution**:\n\n- **Morning standup** (15 min): Yesterday's progress, today's plan, blockers\n- **Focus time**: 4-6 hours deep work, minimize meetings\n- **PR reviews**: Review teammate PRs within 4 hours\n- **End-of-day updates**: Slack progress update, move tickets\n\n**Development best practices**:\n\n- **Feature flags**: Deploy dark, enable gradually\n- **Test coverage**: Write tests before shipping (>80% coverage target)\n- **Documentation**: Update docs in same PR as code\n- **Performance**: Benchmark before/after, no regressions\n- **Security**: Run security scans, fix critical issues immediately\n\nFollow detailed [development workflow](development.md) for PR process and code standards.\n\n### 4. Review & QA (Parallel with Implementation)\n\n**Code review** (required for all PRs):\n\n- **<24 hour response time**: Senior engineers prioritize reviews\n- **Quality checks**: Code correctness, test coverage, performance impact\n- **Security review**: Automated scans + manual review for sensitive code\n- **Documentation**: Verify docs updated, examples work\n- **Approval required**: 1+ senior engineer approval before merge\n\n**QA process**:\n\n- **Automated testing**: Unit, integration, E2E tests run on every commit\n- **Manual testing**: QA engineer validates key user flows\n- **Performance testing**: Benchmark against baseline, flag regressions\n- **Cross-platform**: Test on CPU, GPU, edge devices\n- **User acceptance**: Beta test with select users for major features\n\n**Iteration cycle**:\n\n- Address feedback immediately, don't accumulate technical debt\n- Re-test after changes, verify fixes don't break other features\n- Update tickets with progress, keep stakeholders informed\n\n### 5. Release & Launch\n\n**Pre-release checklist**:\n\n- [ ] All tests passing (unit, integration, E2E)\n- [ ] Performance benchmarks meet targets\n- [ ] Documentation complete and accurate\n- [ ] Changelog updated with user-facing changes\n- [ ] Migration guide (if breaking changes)\n- [ ] Rollback plan documented\n- [ ] Monitoring and alerts configured\n\n**Release process**:\n\n1. **Merge to main**: Approved PRs merge automatically\n2. **Version bump**: Semantic versioning (major.minor.patch)\n3. **Tag release**: Create GitHub release with changelog\n4. **PyPI publish**: Automated deployment to Python Package Index\n5. **Docker update**: Build and push new container images\n6. **Docs deploy**: Documentation site updates automatically\n\n**Launch communication**:\n\n- **Blog post**: Technical deep-dive for major features\n- **Social media**: X, LinkedIn, Discord announcements\n- **Email newsletter**: Notify 50K+ subscribers\n- **Release video**: YouTube tutorial for complex features\n- **Community engagement**: Monitor Discord/GitHub, respond to feedback\n\n**Post-launch monitoring** (first 48 hours):\n\n- Watch error rates, latency, adoption metrics\n- Respond to critical bugs within 4 hours\n- Hotfix process for breaking issues (<24 hour turnaround)\n- Gather user feedback, prioritize quick wins\n\n**Success measurement** (first 2 weeks):\n\n- Adoption rate: % of users upgrading\n- Usage metrics: API calls, feature engagement\n- Performance: Inference speed, memory usage\n- User feedback: GitHub reactions, Discord polls\n- Bug reports: Critical vs. minor issues ratio\n\n## Release Process 📦\n\n### Versioning\n\nSemantic versioning: `MAJOR.MINOR.PATCH`\n\n- **MAJOR**: Breaking changes\n- **MINOR**: New features, backwards compatible\n- **PATCH**: Bug fixes\n\nExample: `11.0.0` → `11.1.0` (new feature) → `11.1.1` (bug fix)\n\n### Release Schedule\n\n- **Minor releases**: Every 2-4 weeks\n- **Patch releases**: As needed for critical fixes\n- **Major releases**: When introducing breaking changes\n\n### Release Checklist\n\n- [ ] All CI tests pass\n- [ ] Documentation updated\n- [ ] Changelog updated\n- [ ] Version numbers bumped\n- [ ] GitHub release created\n- [ ] PyPI package published\n- [ ] Announcement prepared\n\n### Hotfix Process\n\nFor critical bugs:\n\n1. Create `hotfix/` branch from latest release tag\n2. Fix issue, add test\n3. Fast-track review\n4. Release patch version immediately\n5. Backport to main if needed\n\n## Feature Prioritization 📊\n\n### High Priority\n\n- Critical bugs affecting users\n- Performance improvements\n- Security issues\n- Highly requested features (10+ community requests)\n\n### Medium Priority\n\n- Quality of life improvements\n- New export formats\n- Extended platform support\n- Documentation improvements\n\n### Low Priority\n\n- Nice-to-have features\n- Minor optimizations\n- Edge case handling\n\n### Deprioritized\n\n- Features for single user\n- Overly complex implementations\n- Maintenance-heavy additions\n- Out of scope for core mission\n\n## Metrics & Success 📈\n\n### Key Metrics\n\n- **GitHub Stars**: Community interest\n- **PyPI Downloads**: Adoption rate\n- **Issue Response Time**: Support quality\n- **PR Merge Time**: Development velocity\n- **[Performance Benchmarks](https://docs.ultralytics.com/modes/benchmark)**: Speed/accuracy improvements\n\n### Feature Success Criteria\n\nDefine before building:\n\n- Usage metrics (downloads, API calls)\n- Performance targets (speed, accuracy)\n- User feedback (GitHub reactions, comments)\n- Adoption rate (percentage using feature)\n\n## Communication 💬\n\n### Internal\n\n- **GitHub Issues**: Feature proposals and bugs\n- **Slack**: Quick discussions and updates\n- **Team Meetings**: Weekly syncs on priorities\n\n### External\n\n- **GitHub Discussions**: Community feedback\n- **Discord**: User support and engagement\n- **Blog Posts**: Major feature announcements\n- **Documentation**: Release notes and guides\n\n## Product Roadmap 🗺️\n\n### Current Focus\n\n- [YOLO26 model family](https://docs.ultralytics.com/models/yolo26)\n- [Export format support](https://docs.ultralytics.com/modes/export)\n- [Performance optimization](https://docs.ultralytics.com/guides/model-training-tips)\n- [Documentation quality](https://docs.ultralytics.com/)\n\n### Upcoming Areas\n\n- New [architecture variants](https://docs.ultralytics.com/models)\n- Enhanced [training features](https://docs.ultralytics.com/modes/train)\n- Improved [inference speed](https://docs.ultralytics.com/modes/predict)\n- Extended [platform support](https://docs.ultralytics.com/guides/model-deployment-options)\n\n### Long-term Vision\n\n- World's best open-source object detection\n- Seamless deployment across all platforms\n- Comprehensive computer vision toolkit\n- Community-driven innovation\n\n## Best Practices ✅\n\n### Feature Development\n\n- **Start small**: MVP first, expand later\n- **User testing**: Get feedback early\n- **Performance first**: Optimize from the start\n- **Document well**: Write docs while building\n\n### Release Management\n\n- **Test thoroughly**: CI + manual testing\n- **Clear changelog**: What changed, why it matters\n- **Smooth upgrades**: Backwards compatibility when possible\n- **Quick fixes**: Don't let bugs linger\n\n### Community Engagement\n\n- **Responsive**: Reply to issues within 24 hours\n- **Transparent**: Share roadmap and decisions\n- **Appreciative**: Thank contributors\n- **Inclusive**: Welcome all skill levels\n\n## Resources 📚\n\n- [Development Workflow](development.md) - PR process and standards\n- [CI/Testing](ci-testing.md) - Testing and quality checks\n- [Documentation](documentation.md) - Writing and maintaining docs\n- [GitHub Issues](https://github.com/ultralytics/ultralytics/issues) - Feature requests and bugs\n"}]}];

const fileMap = {};
(function buildMap(nodes, map) {
  for (const n of nodes) {
    if (n.type === 'file') map[n.path] = n;
    if (n.children) buildMap(n.children, map);
  }
})(DATA, fileMap);

let currentPath = '';

function renderTree(nodes, parent, depth) {
  for (const node of nodes) {
    if (node.type === 'dir') {
      const div = document.createElement('div');
      div.className = 'tree-node';
      const label = document.createElement('div');
      label.className = 'tree-dir-label';
      label.innerHTML = `<span class="arrow">&#9654;</span><span class="icon">&#128193;</span> ${escapeHtml(node.name)}`;
      const children = document.createElement('div');
      children.className = 'tree-children';
      label.onclick = (e) => {
        e.stopPropagation();
        children.classList.toggle('open');
        label.querySelector('.arrow').classList.toggle('open');
      };
      div.appendChild(label);
      div.appendChild(children);
      renderTree(node.children, children, depth + 1);
      parent.appendChild(div);
    } else {
      const el = document.createElement('div');
      el.className = 'tree-file';
      el.textContent = node.name.replace(/\.md$/, '');
      el.dataset.path = node.path;
      el.onclick = () => showDoc(node.path, node.content);
      parent.appendChild(el);
    }
  }
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function resolvePath(href, current) {
  if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('#')) return null;
  if (!href.endsWith('.md') && !href.includes('#')) {
    const parts = href.split('/');
    const last = parts[parts.length - 1];
    if (!last.includes('.')) return null;
  }
  const anchor = href.includes('#') ? '#' + href.split('#')[1] : '';
  const cleanHref = href.split('#')[0];
  if (!cleanHref) return null;
  const dir = current.includes('/') ? current.substring(0, current.lastIndexOf('/') + 1) : '';
  const combined = dir + cleanHref;
  const parts = combined.replace(/\\/g, '/').split('/');
  const resolved = [];
  for (const p of parts) {
    if (p === '.' || p === '') continue;
    if (p === '..') { if (resolved.length) resolved.pop(); }
    else resolved.push(p);
  }
  return resolved.join('/') + anchor;
}

function showDoc(path, content) {
  currentPath = path;
  document.querySelectorAll('.tree-file').forEach(el => el.classList.remove('active'));
  const active = document.querySelector(`.tree-file[data-path="${path}"]`);
  if (active) active.classList.add('active');
  document.getElementById('markdown-body').innerHTML = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(marked.parse(content)) : marked.parse(content);
  document.getElementById('placeholder').classList.add('hidden');
  document.getElementById('content-inner').classList.remove('hidden');
  document.getElementById('content').scrollTop = 0;
}

document.getElementById('markdown-body').addEventListener('click', (e) => {
  const link = e.target.closest('a');
  if (!link) return;
  const href = link.getAttribute('href');
  if (!href) return;
  const resolved = resolvePath(href, currentPath);
  if (!resolved) return;
  e.preventDefault();
  const targetPath = resolved.split('#')[0];
  const anchor = resolved.includes('#') ? resolved.split('#')[1] : null;
  const target = fileMap[targetPath];
  if (target) {
    showDoc(target.path, target.content);
    if (anchor) {
      setTimeout(() => {
        const el = document.getElementById(anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }, 100);
    }
  }
});

renderTree(DATA, document.getElementById('tree'), 0);
document.querySelectorAll('.tree-children').forEach(el => el.classList.add('open'));
document.querySelectorAll('.arrow').forEach(el => el.classList.add('open'));
const defaultDoc = findFile(DATA, 'introduction.md') || findFile(DATA, 'index.md') || findFirstFile(DATA);
if (defaultDoc) showDoc(defaultDoc.path, defaultDoc.content);

function findFile(nodes, name) {
  for (const node of nodes) {
    if (node.type === 'file' && node.name === name) return node;
    if (node.children) {
      const found = findFile(node.children, name);
      if (found) return found;
    }
  }
  return null;
}
function findFirstFile(nodes) {
  for (const node of nodes) {
    if (node.type === 'file') return node;
    if (node.children) {
      const found = findFirstFile(node.children);
      if (found) return found;
    }
  }
  return null;
}
</script>
