                                                                                                                                                                                                                    |\n| ------------------------------------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Expertise &<br>Domain Knowledge**  | • Applies basic principles and concepts in a specialized area<br>• Learns and applies primary techniques and tools relevant to the role<br>• Continuously expands skill sets, including company policies and industry knowledge<br>• Grows competency through structured tasks and mentorship                                                  |\n| **Scope &<br>Responsibility**        | • Works on routine and basic tasks with clearly defined parameters<br>• Responsible for one or more project components, following general directions<br>• Plans daily tasks with guidance from senior team members<br>• Contributions focus on repeatable, task-driven activities<br>• Impacts own work primarily, learning team collaboration |\n| **Decision Making &<br>Impact**      | • Makes decisions about own work guided by well-defined options<br>• Work is closely supervised with frequent check-ins and review<br>• Refers non-standard or complex matters to senior team members<br>• Seeks guidance when facing ambiguity or uncertainty<br>• Supports team decisions through research and inputs                        |\n| **Leadership &<br>Influence**        | • Works with well-defined stakeholders within the immediate team<br>• Learns principles of effective communication and collaboration<br>• Influences through research and providing inputs to discussions<br>• Responsible for individual assignments and deliverables<br>• Participates actively in team meetings and reviews                 |\n| **Complexity &<br>Problem Solving**  | • Solves defined problems using established methods and documentation<br>• Problems require analysis of identifiable factors with clear solutions<br>• Follows documented procedures and best practices<br>• Applies knowledge and basic techniques to resolve routine issues<br>• Conveys straightforward information to the team             |\n| **Collaboration &<br>Communication** | • Works closely with immediate team members daily<br>• Learns to communicate concepts clearly<br>• Participates in team meetings, project reviews, and design critiques<br>• Asks thoughtful questions and seeks clarification when needed<br>• Documents work following established templates and standards                                   |\n\n### Typical Background\n\n- **Bachelor's degree + 0-1 year experience** OR **Master's degree**\n- Foundational knowledge in a relevant field (i.e. CS, Design, Business, Marketing)\n- Demonstrated eagerness to learn and grow through internships or projects\n- Strong academic background or relevant internship/project experience\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Completes assigned tasks on time with quality that meets team standards\n    - ✅ Actively seeks feedback and applies it to improve work quality\n    - ✅ Demonstrates a steady learning curve and skill development\n    - ✅ Collaborates effectively with immediate team members\n    - ✅ Asks thoughtful questions and escalates issues appropriately\n\n### Common Development Areas\n\n- Deepen fundamentals in core domain tools and practices\n- Grow confidence operating with lighter guidance and checkpoints\n- Connect individual tasks to team goals and user outcomes\n- Build repeatable problem-solving habits for routine issues\n- Improve basic scoping and estimation for small tasks\n\n---\n\n## IC2: Mid 1 (Developing)\n\n- **Career Stage**: Developing\n- **Typical Roles**: Engineer I, Product Manager I, Designer I, Marketing Specialist, Business Development Rep\n- **Focus**: 100% Operational - Developing autonomy with general supervision\n\n### Core Expectations\n\n| Dimension                            | IC2 Requirements                                                                                                                                                                                                                                                                                                                           |\n| ------------------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| **Expertise &<br>Domain Knowledge**  | • Develops and applies growing advanced techniques and principles<br>• Standard application of principles, theories, and concepts<br>• Expanding knowledge across related specialty areas<br>• Demonstrates increasing competency and autonomy in work<br>• Good grasp of relevant tools and methodologies                                 |\n| **Scope &<br>Responsibility**        | • Handles moderate complexity work with opportunity for review<br>• Responsible for project aspects, determining methods to achieve results<br>• Plans and schedules own work across multiple days<br>• Contributes to fulfillment of significant project portions<br>• Work impacts own deliverables and begins affecting team outcomes   |\n| **Decision Making &<br>Impact**      | • Makes decisions about own work and occasionally others' within documented parameters<br>• Independently resolves routine issues<br>• Works under general supervision with independent judgment<br>• Seeks guidance on complex or ambiguous situations<br>• Begins recommending approaches to solve problems                              |\n| **Leadership &<br>Influence**        | • Begins working with more varied and changing stakeholders<br>• Gains cooperation from others, exchanges information effectively<br>• Influences through recommending approaches and solutions<br>• Responsible for individual project aspects and their coordination<br>• Participates actively in team planning and design discussions  |\n| **Complexity &<br>Problem Solving**  | • Problems require analysis of identifiable factors and tradeoffs<br>• Determines course of action based on guidelines, modifies based on experience<br>• Handles basic escalations from entry-level team members<br>• Applies growing problem-solving sophistication and techniques<br>• Conveys information clearly to diverse audiences |\n| **Collaboration &<br>Communication** | • Works effectively with team members across different functions<br>• Communicates progress, challenges, and decisions proactively<br>• Contributes meaningfully to discussions and planning<br>• Helps onboard IC1 team members<br>• Documents work clearly for broader team consumption                                                  |\n\n### Typical Background\n\n- **Bachelor's degree + 1-3 years experience** OR **Master's degree + 1 year**\n- Demonstrated growth in functional skills and independent contributions\n- Track record of delivering tasks or projects with guidance\n- Comfortable working with moderate complexity\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Delivers work with minimal guidance\n    - ✅ Proactively identifies and resolves routine issues\n    - ✅ Makes sound decisions on own tasks\n    - ✅ Effectively communicates with immediate stakeholders\n    - ✅ Demonstrates growing ownership of work quality\n\n### Common Development Areas\n\n- Expand depth in the primary domain and adjacent tools\n- Increase comfort working through ambiguity with partial requirements\n- Strengthen understanding of team's role and dependencies\n- Improve estimation accuracy and proactive risk surfacing\n- Build early mentorship habits with IC1 teammates\n\n---\n\n## IC3: Mid 2 (Proficient)\n\n- **Career Stage**: Proficient\n- **Typical Roles**: Engineer II, Product Manager II, Designer II, Senior Marketing Specialist, Account Executive\n- **Focus**: 100% Operational - Fully autonomous execution on complex tasks\n\n### Core Expectations\n\n| Dimension                            | IC3 Requirements                                                                                                                                                                                                                                                                                                                                      |\n| ------------------------------------ | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Expertise &<br>Domain Knowledge**  | • Applies complete and practical knowledge of their domain<br>• Near-complete use of standard principles, theories, and concepts<br>• Capable of troubleshooting complex issues within own domain<br>• High competency and autonomy; rarely needs assistance on standard tasks<br>• Full application of relevant tools, acts as a resource for others |\n| **Scope &<br>Responsibility**        | • Handles moderate to high complexity work with minimal review<br>• Responsible for multiple project aspects or small initiatives end-to-end<br>• Plans and schedules own work across weeks<br>• Contributes to fulfillment of major project portions<br>• Work directly impacts team outcomes and timeline reliability                               |\n| **Decision Making &<br>Impact**      | • Independently resolves non-routine issues<br>• Determines methods and procedures on new assignments<br>• Decisions have a lasting impact on the maintainability of the team's work<br>• Identifies risks in own work and proposes mitigation strategies<br>• Recommends improvements to team processes                                              |\n| **Leadership &<br>Influence**        | • Collaborates with stakeholders outside immediate team occasionally<br>• Mentors IC1 and IC2 peers on best practices<br>• Influences discussions by leveraging past experience<br>• Responsible for multiple project aspects and their coordination<br>• Leads small sub-projects or feature implementations                                         |\n| **Complexity &<br>Problem Solving**  | • Solves difficult problems with ambiguous factors<br>• Analyzes tradeoffs between different implementations<br>• Handles escalated issues from junior team members regularly<br>• Optimizes existing solutions for performance or scalability<br>• Translates business requirements into functional specifications                                   |\n| **Collaboration &<br>Communication** | • Proactively communicates blocking issues and proposes solutions<br>• Participates in hiring and interviewing (shadowing)<br>• Conducts thorough reviews for peers<br>• Documents complex workflows and system behaviors<br>• Bridges gaps between business requirements and implementation                                                          |\n\n### Typical Background\n\n- **Bachelor's degree + 3-5 years experience** OR **Master's degree + 2 years** OR **PhD + 1 year**\n- Track record of delivering work end-to-end independently\n- Strong knowledge of best practices in their field\n- Ability to mentor junior team members on specific tasks\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Consistently delivers complex work with high quality and autonomy\n    - ✅ Recognized as a reliable owner of specific domains or components\n    - ✅ Mentors junior team members effectively on tasks\n    - ✅ Proactively improves quality and documentation\n    - ✅ Estimates work accurately and manages own timeline effectively\n\n### Common Development Areas\n\n- Grow influence beyond immediate tasks to adjacent components\n- Elevate strategic thinking and long-term maintainability\n- Strengthen ambiguity handling and tradeoff communication\n- Develop more deliberate mentoring and review practices\n- Improve stakeholder updates that translate choices to impact\n\n---\n\n## IC4: Senior 1 (Skilled)\n\n- **Career Stage**: Career / Fully Functioning\n- **Typical Roles**: Senior Engineer, Senior Product Manager, Senior Designer, Senior Analyst, Senior Marketing Manager\n- **Focus**: 100% Operational - Independent expert with cross-team influence\n\n### Core Expectations\n\n| Dimension                            | IC4 Requirements                                                                                                                                                                                                                                                                                                                                                                   |\n| ------------------------------------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Expertise &<br>Domain Knowledge**  | • Applies complete and practical knowledge across multiple specializations<br>• Demonstrates full competence and gains exposure to more complex work<br>• Understands interrelationships between different disciplines<br>• Deep application of principles, theories, and concepts in domain<br>• May be gaining exposure to adjacent functional areas                             |\n| **Scope &<br>Responsibility**        | • Handles moderate complexity with diverse issues requiring minimal review<br>• Contributes to significant project components, impacting own and others' work<br>• Plans own work within scheduled guidelines across multiple projects<br>• Often recommends integration approaches across team projects<br>• Work affects team outcomes and cross-team deliverables significantly |\n| **Decision Making &<br>Impact**      | • Makes independent decisions guided by experience and learned knowledge<br>• Makes decisions on own work methods, occasionally in ambiguous situations<br>• Regularly resolves routine and non-routine issues independently<br>• Works under broad guidelines with regular independent judgment application<br>• Influences work team products, processes, and results            |\n| **Leadership &<br>Influence**        | • Identifies and actively manages diverse stakeholders across teams<br>• Presents results and recommendations across discipline effectively<br>• Begins influencing team products, features, processes, and results<br>• Serves as Recommender and occasional Activator on team decisions<br>• May lead small projects or significant initiative components                        |\n| **Complexity &<br>Problem Solving**  | • Problems are somewhat varied, require analysis of multiple factors and data conflicts<br>• Assesses unusual circumstances using sophisticated problem-solving techniques<br>• Identifies root causes and builds solutions independently<br>• Provides creative and effective solutions to complex issues<br>• Breaks down complex problems into manageable components            |\n| **Collaboration &<br>Communication** | • Works effectively across multiple teams and functional areas<br>• Communicates complex concepts to non-technical audiences<br>• Mentors IC2 and IC3 team members regularly on functional topics<br>• Participates in hiring and interviewing processes<br>• Represents team effectively in cross-functional forums                                                               |\n\n### Typical Background\n\n- **Bachelor's degree + 5-7 years experience** OR **Master's degree + 4 years** OR **PhD + 2 years**\n- Proven track record of independent complex project delivery\n- Strong expertise and domain knowledge\n- Demonstrated ability to influence team direction\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Owns and delivers complex projects independently with high quality\n    - ✅ Provides effective mentorship to junior/mid team members\n    - ✅ Makes consistently high-quality decisions\n    - ✅ Proactively identifies and addresses risks and debts\n    - ✅ Contributes to team direction and standards\n\n### Common Development Areas\n\n- Extend influence from team-level to multi-team integrations\n- Strengthen product and business context in decisions\n- Improve navigation of cross-team dependencies and conflict resolution\n- Balance delivery pace with sustainable solutions and debt payoff\n- Lead reviews that drive alignment and quality\n\n---\n\n## IC5: Senior 2 (Advanced)\n\n- **Career Stage**: Advanced Senior\n- **Typical Roles**: Senior Engineer II, Lead Product Manager, Lead Designer, Lead Marketing Manager, Principal Account Executive\n- **Focus**: 90% Operational / 10% Strategic - Functional Lead for the team\n\n### Core Expectations\n\n| Dimension                            | IC5 Requirements                                                                                                                                                                                                                                                                                                                                                 |\n| ------------------------------------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Expertise &<br>Domain Knowledge**  | • Recognized as the \"go-to\" expert for the team's core domain<br>• Broad knowledge of the entire system and deep knowledge of specific areas<br>• Evaluates and introduces new tools or technologies to the team<br>• Capable of solving the most difficult challenges within the team scope<br>• Sets the bar for quality and design patterns                   |\n| **Scope &<br>Responsibility**        | • Responsible for the success of major projects or entire features<br>• Identifies and mitigates risks across the project lifecycle<br>• Self-directed; identifies work that needs to be done for the team's success<br>• Coordinates dependencies with other teams<br>• Work creates leverage for the entire team (tooling, frameworks, core libraries)         |\n| **Decision Making &<br>Impact**      | • Trusted to make decisions that affect the entire team's velocity<br>• Balances ideal solutions with business speed effectively<br>• Resolves disputes within the team<br>• Defines the \"how\" for complex initiatives where the \"what\" is defined by Product<br>• Impact is visible in improved team metrics (performance, reliability, velocity)               |\n| **Leadership &<br>Influence**        | • Often acts as the functional lead for the team<br>• Influences the roadmap by identifying opportunities<br>• Drives consensus on design and architecture within the team<br>• Active participant in hiring; defines bar for Senior candidates<br>• Effectively manages up, keeping management informed of risks                                                |\n| **Complexity &<br>Problem Solving**  | • Solves systemic problems that affect multiple team members<br>• Refactors legacy systems to improve maintainability without stopping new work<br>• Anticipates scaling issues before they become incidents<br>• Troubleshoots complex interactions between services or components<br>• Creates frameworks or patterns that simplify problem-solving for others |\n| **Collaboration &<br>Communication** | • Bridges the gap between their function and product/design at a high level<br>• Mentors Senior 1 contributors towards Staff level thinking<br>• Runs post-mortems and drives action items to completion<br>• Articulates strategy to non-technical stakeholders<br>• Represents the team in architecture reviews with Staff-level contributors                  |\n\n### Typical Background\n\n- **Bachelor's degree + 7-9 years experience** OR **Master's degree + 6 years** OR **PhD + 4 years**\n- Consistent history of delivering high-impact projects\n- Experience leading design for a team\n- Strong reputation for excellence and reliability\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Acts as the anchor for the team\n    - ✅ Successfully delegates work while maintaining quality\n    - ✅ Improves team velocity through tooling or process improvements\n    - ✅ Mentors other Seniors to help them grow\n    - ✅ Prevents major incidents through foresight and robust design\n\n### Common Development Areas\n\n- Practice structured delegation while preserving quality bar\n- Strengthen cross-team alignment with product, design, and other partners\n- Balance speed vs. quality and make tradeoffs explicit to stakeholders\n- Reduce bus factor through documentation, reviews, and knowledge sharing\n- Build toward Staff influence by shaping team-level strategy\n\n---\n\n## IC6: Staff (Expert)\n\n- **Career Stage**: Senior/Seasoned\n- **Typical Roles**: Staff Engineer, Staff Product Manager, Staff Designer, Staff Analyst, Staff Marketing Manager\n- **Focus**: 80% Operational / 20% Strategic - Cross-team leadership\n\n### Core Expectations\n\n| Dimension                            | IC6 Requirements                                                                                                                                                                                                                                                                                                                                                                                       |\n| ------------------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| **Expertise &<br>Domain Knowledge**  | • Applies advanced and wide-ranging knowledge across entire domain<br>• Combines emerging business acumen with deep functional expertise<br>• Understands interrelationships between disciplines, serves as a functional advisor<br>• Deep application of principles across most areas of specialization<br>• Beginning to build reputation as an organizational expert                                |\n| **Scope &<br>Responsibility**        | • Handles complex work and issues with significant interdependencies<br>• Contributes to and often drives achievement of critical functional goals<br>• Plans, schedules, and integrates tasks with limited direction across projects<br>• Work impacts department outcomes and cross-functional initiatives<br>• Influences quarterly and semi-annual strategic planning                              |\n| **Decision Making &<br>Impact**      | • Makes decisions on functional approaches, processes, occasionally ambiguous situations<br>• Independently resolves most complex issues, teams to solve ambiguous challenges<br>• Collaborates as Recommender for systemic issues, occasionally Activator<br>• Works from broad goals, determines and develops approach to solutions<br>• Provides direction affecting multiple teams and initiatives |\n| **Leadership &<br>Influence**        | • Plans, schedules, and integrates own work with others across teams<br>• Begins directing application of existing principles to new contexts<br>• Contributes to stakeholder management plans, develops relationships across organization<br>• Influences work team and multiple teams, serves as Recommender and Activator<br>• Often regarded as in-house expert on specific areas or domains       |\n| **Complexity &<br>Problem Solving**  | • Problems are varied, diverse, often \"hidden\" or systemic in nature<br>• Provides solutions to complex issues with sophisticated creative insights<br>• Works on high-impact projects and challenging problems<br>• Regularly guides others in solving highly complex issues<br>• Significant contributor and recommender for far-reaching challenges                                                 |\n| **Collaboration &<br>Communication** | • Influences stakeholders across multiple teams and functional areas<br>• Communicates effectively with senior leadership on functional matters<br>• Mentors IC4 and IC5 contributors on growth and career development<br>• Leads design reviews and architecture discussions<br>• May represent company at external forums and conferences                                                            |\n\n### Typical Background\n\n- **Bachelor's degree + 9-11 years experience** OR **Master's degree + 7 years** OR **PhD + 5 years**\n- Recognized expert in specific domain or technology area\n- Track record of leading complex projects affecting multiple teams\n- Demonstrated ability to influence direction beyond own team\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Drives initiatives affecting multiple teams successfully\n    - ✅ Recognized as a functional authority within organization\n    - ✅ Makes strategic decisions with lasting impact\n    - ✅ Mentors and develops senior contributors effectively\n    - ✅ Identifies and addresses systemic challenges proactively\n\n### Common Development Areas\n\n- Expand influence from department-level to organization-wide outcomes\n- Develop executive-ready communication on risk and strategy\n- Build broader cross-functional networks that unlock delivery velocity\n- Strengthen ability to drive consensus on complex architectural decisions\n- Grow voice in product strategy and prioritization\n\n!!! warning \"Critical Transition Point\"\n\n    IC6 marks the shift from senior expert to organizational leader. Success means balancing hands-on delivery (80%) with higher-leverage strategic influence (20%) and learning to scale impact through others.\n\n---\n\n## IC7: Senior Staff (Advisor)\n\n- **Career Stage**: Expert Advisor\n- **Typical Roles**: Senior Staff Engineer, Senior Staff Product Manager, Senior Staff Designer, Senior Staff Analyst\n- **Focus**: 70% Operational / 30% Strategic - Cross-team leadership with broadening scope\n\n### Core Expectations\n\n| Dimension                            | IC7 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                             |\n| ------------------------------------ | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Expertise &<br>Domain Knowledge**  | • Applies advanced business acumen directly to domain expertise<br>• Combines highly specialized field knowledge with broad expertise in related areas<br>• Deep expertise across multiple specializations and interdependent areas<br>• Builds reputation as in-house expert across entire organization<br>• Often consulted on most critical and strategic decisions                                                                       |\n| **Scope &<br>Responsibility**        | • Handles highly complex work with significant interdependencies across organization<br>• Directs work contributing to achievement of critical functional and organizational goals<br>• Influences planning of others, regularly plans and coordinates work of team members<br>• Work impacts organizational strategy and influences multi-quarter planning cycles<br>• Drives initiatives affecting company-wide direction and architecture |\n| **Decision Making &<br>Impact**      | • Makes decisions regarding approaches that influence entire organization<br>• Advises multiple functional areas on decision making in highly ambiguous situations<br>• Often serves as Recommender, occasionally Activator for systemic organizational issues<br>• Works under consultative direction towards mid-term strategic goals (6+ months)<br>• Decisions set precedents and standards affecting multiple teams                     |\n| **Leadership &<br>Influence**        | • Regularly plans and influences work of others across multiple teams<br>• Directs application of existing principles, actively participates in developing new practices<br>• Owns portions of stakeholder management plans across entire organization<br>• Influences department offerings and creates function-level impact<br>• Applies flexible leadership styles to influence results across organization                               |\n| **Complexity &<br>Problem Solving**  | • Problems are novel with limited precedent, require significant ingenuity and creativity<br>• Provides, guides, and uses innovative methods to solve unusual and complex problems<br>• Leads teams in solving complex, cross-discipline issues critical to company success<br>• Provides deep insight and leadership promoting innovative new ideas<br>• Leads and guides implementation strategies for complex solutions                   |\n| **Collaboration &<br>Communication** | • Influences senior leadership and executives regularly on strategy<br>• Communicates vision effectively to diverse audiences across organization<br>• Builds and leverages strong cross-functional networks for collaboration<br>• Represents company at major industry conferences as a functional authority<br>• Mentors staff-level contributors and emerging leaders effectively                                                        |\n\n### Typical Background\n\n- **Bachelor's degree + 11-13 years experience** OR **Master's degree + 9 years** OR **PhD + 7 years**\n- Recognized authority internally as domain expert across organization\n- Proven impact across multiple teams, functions, and strategic initiatives\n- Strong executive communication and influence skills\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Drives strategy with measurable company-wide impact\n    - ✅ Influences product and business strategy through functional insights\n    - ✅ Recognized as authority within industry, not just within company\n    - ✅ Successfully leads most complex and ambiguous initiatives\n    - ✅ Makes bets that significantly impact company success\n\n### Common Development Areas\n\n- Extend influence from organization to industry conversations and standards\n- Publish, speak, or share thought leadership externally with credibility\n- Strengthen ability to influence executive-level strategic decisions\n- Build industry-wide networks and partnerships that expand leverage\n- Grow impact on long-term vision and multi-quarter bets\n\n!!! note \"Strategic Balance\"\n\n    IC7 requires balancing deep execution (70%) with strategic influence (30%). Success means driving both immediate outcomes and the emerging strategy across teams.\n\n---\n\n## IC8: Principal (Strategist)\n\n- **Career Stage**: Lead / Strategist\n- **Typical Roles**: Principal Engineer, Principal Product Manager, Principal Designer, Principal Analyst\n- **Focus**: 60% Operational / 40% Strategic - Strategic leadership across the organization\n\n### Core Expectations\n\n| Dimension                            | IC8 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                                                   |\n| ------------------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| **Expertise &<br>Domain Knowledge**  | • Applies extensive depth of knowledge across theories, practices, and design principles<br>• Serves as specialized expert in field and primary advisor across entire organization<br>• Maintains highest external affiliations, often pioneer in technology or domain area<br>• Recognized authority internally and externally in profession and industry<br>• Actively shapes direction at both company and industry level                                       |\n| **Scope &<br>Responsibility**        | • Handles most complex work with minimum precedent or established patterns<br>• Directs work contributing directly to organizational success and industry reputation<br>• Contributes actively to strategic planning, influences annual plans for entire function<br>• Work impacts company strategy, competitive positioning, and multi-year planning<br>• Drives initiatives with potential to transform company or entire industry                              |\n| **Decision Making &<br>Impact**      | • Advises on most novel, strategic business and functional issues company-wide<br>• Often serves as Activator and major contributor to most far-reaching decisions<br>• Influences company-wide strategy and long-term multi-year planning cycles<br>• Determines and pursues courses of action to meet long-term strategic goals (3+ years)<br>• Decisions directly affect company's competitive positioning in market                                            |\n| **Leadership &<br>Influence**        | • Contributes to strategic planning at highest levels, influences multi-year planning<br>• Leads application of existing principles and active development of new innovative ideas<br>• Owns stakeholder management plans, develops relationships across entire organization<br>• Recognized as highly influential leader partnering directly with executive team<br>• Often serves as the Decider for most complex and strategic issues                           |\n| **Complexity &<br>Problem Solving**  | • Challenges are novel with multiple stakeholders, highly ambiguous, require significant ingenuity<br>• Applies deep expertise and emerging technologies to drive breakthrough innovation<br>• Leads teams in solving most highly complex challenges with limited or no precedent<br>• Pioneers development and personally sponsors implementation of strategic solutions<br>• Solutions require exceptional strategic judgment with limited information available |\n| **Collaboration &<br>Communication** | • Partners directly with executive team on company strategy and vision<br>• Influences industry through publications, keynotes, and standards work<br>• Builds and maintains significant external professional networks and partnerships<br>• Mentors principal-level contributors and senior leaders across organization<br>• Represents company as primary authority to customers, partners, analysts                                                            |\n\n### Typical Background\n\n- **Bachelor's degree + 13-15 years experience** OR **Master's degree + 11 years** OR **PhD + 9 years**\n- Recognized authority externally in field with industry-wide reputation\n- Proven track record of company-wide and industry-level impact\n- Extensive network of industry relationships and influence\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Directly shapes company strategy and long-term vision\n    - ✅ Recognized as thought leader and authority in industry\n    - ✅ Influences decisions at executive and board level\n    - ✅ Develops other principal-level leaders successfully\n    - ✅ Makes strategic bets that define company's future\n\n### Common Development Areas\n\n- Expand influence on company business strategy beyond functional scope\n- Build deeper executive and board relationships to advocate for direction\n- Develop the next generation of Staff and Principal contributors\n- Increase industry leadership through standards work and public platforms\n- Grow impact on long-term company positioning and multi-year vision\n\n!!! note \"Strategic Leadership\"\n\n    IC8 represents specialized leadership with broad impact. Success requires balancing deep execution (60%) with strategic influence (40%) while steering company-level direction.\n\n---\n\n## IC9: Distinguished (Thought Leader)\n\n- **Career Stage**: Industry Leader\n- **Typical Roles**: Distinguished Engineer, Fellow, Research Scientist\n- **Focus**: 50% Operational / 50% Strategic - Industry-defining leadership\n\n### Core Expectations\n\n| Dimension                            | IC9 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                         |\n| ------------------------------------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Expertise &<br>Domain Knowledge**  | • Defines the state of the art for the industry; inventions may be patented or become industry standards<br>• Visionary understanding of trends 5-10 years out<br>• Depth is unmatched; capable of rebuilding core business technologies from first principles<br>• Mastery of the intersection between technology, business model, and market forces<br>• Serves as the ultimate arbiter for the company                                |\n| **Scope &<br>Responsibility**        | • Operates with complete autonomy; defines their own scope based on company survival and growth<br>• Accountable for risks that could pose existential threats to the company<br>• Drives transformations that open entirely new lines of business<br>• Work influences the entire industry ecosystem, not just the company<br>• Responsible for the long-term soul and culture of the organization                                      |\n| **Decision Making &<br>Impact**      | • Decisions fundamentally alter the trajectory of the company<br>• Selects the technologies and architectures that will define the company for the next decade<br>• Acts as a trusted advisor to the CEO and Board of Directors<br>• Validates or invalidates potential M&A targets based on diligence<br>• Impact is measured in years or decades, often shifting the market landscape                                                  |\n| **Leadership &<br>Influence**        | • A magnet for talent; top-tier contributors join the company specifically to work with this person<br>• Represents the company in global standards bodies, consortiums, and government panels<br>• Influences the roadmap of external partners and vendors<br>• Sets the ethical and cultural standards for their function across the organization<br>• Operates without organizational boundaries; influence permeates all departments |\n| **Complexity &<br>Problem Solving**  | • Solves \"unsolvable\" problems where no prior solution exists in the world<br>• Synthesizes vast amounts of disparate information to find simple solutions to complex reality<br>• Identifies non-obvious opportunities that others miss entirely<br>• Navigates extreme ambiguity where business goals and possibility are both undefined<br>• Creates new algorithms, methodologies, or paradigms that advance the field               |\n| **Collaboration &<br>Communication** | • Communicates vision to the entire company, inspiring confidence in the future<br>• Publishes seminal papers, books, or open-source projects that define the field<br>• Mentors the company's Principal and Senior Staff contributors<br>• Negotiates high-stakes partnerships with other industry giants<br>• Translates the most complex realities into clear business strategy for investors and board members                       |\n\n### Typical Background\n\n- **15+ years of experience** with a history of industry-shifting impact\n- Significant external recognition (patents, books, keynotes, open source leadership)\n- Track record of creating successful technologies or platforms from scratch\n- Experience guiding companies through major pivots\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Creates technology that becomes a competitive moat for the company\n    - ✅ Attracts world-class talent to the organization\n    - ✅ Prevents existential failures through foresight\n    - ✅ Defines the industry standard for the company's domain\n    - ✅ Pivots the company's strategy to capture new markets\n    - ✅ Respected globally as a pioneer in the field\n\n---\n\n## Level Comparison Matrix\n\n| Dimension       | IC1-IC3      | IC4-IC5      | IC6-IC7    | IC8-IC9      |\n| --------------- | ------------ | ------------ | ---------- | ------------ |\n| **Focus**       | 100% Ops     | 90-100% Ops  | 70-80% Ops | 50-60% Ops   |\n| **Supervision** | Close/Gen    | Minimal      | Limited    | Consultative |\n| **Scope**       | Task/Project | Project/Team | Cross-Team | Org/Industry |\n| **Planning**    | Days/Weeks   | Months       | Quarters   | Years        |\n| **Decisions**   | Defined      | Independent  | Strategic  | Existential  |\n| **Influence**   | Team         | Cross-Team   | Department | Industry     |\n\n## Using This Guide\n\n### For Individual Contributors\n\n!!! tip \"Self-Assessment Process\"\n\n    1. **Read your current level thoroughly** - Understand all dimensions of expectations\n    2. **Evaluate honestly** against each dimension - Identify consistent strengths\n    3. **Identify development areas** - Find 1-2 gaps to address this quarter\n    4. **Review next level** - Understand the path forward clearly\n    5. **Discuss with manager** - Align on assessment and create development plan\n\n### For Development Planning\n\nCreate targeted growth plans:\n\n1. **Compare current vs. next level** across all dimensions systematically\n2. **Identify specific gaps** in expertise, scope, or organizational impact\n3. **Find opportunities** to demonstrate next-level work with manager support\n4. **Set quarterly goals** targeting specific next-level criteria explicitly\n5. **Document examples** of next-level performance for promotion discussions\n\n### For Managers\n\n!!! info \"Manager Responsibilities\"\n\n    - **Performance Reviews**: Use these criteria to calibrate expectations consistently\n    - **Specific Feedback**: Provide concrete examples mapped to level dimensions\n    - **Opportunity Creation**: Help team members find next-level work opportunities\n    - **Consistent Evaluation**: Ensure fairness across all team members\n    - **Promotion Preparation**: Build evidence-based cases using these criteria\n\n## Promotion Readiness\n\n### Typical Timeline\n\n- **IC1 → IC2**: 12-18 months\n- **IC2 → IC3**: 18-24 months\n- **IC3 → IC4**: 24-30 months\n- **IC4 → IC5**: 24-36 months\n- **IC5 → IC6**: 36+ months\n- **IC6 → IC7**: 36+ months\n- **IC7 → IC8**: 48+ months\n- **IC8 → IC9**: Special appointment based on business need and industry impact\n\n!!! warning \"Promotion Requirements\"\n\n    Promotions require **sustained demonstration** of next-level performance across **all dimensions**, not just functional expertise. Discuss readiness quarterly with your manager and document specific examples.\n\n## Related Resources\n\n- **[Management Levels](levels-management.md)** - Detailed leadership track expectations\n- **[Career Progression](../index.md)** - Complete framework, promotion process, track switching\n- **[People & Benefits](../../index.md)** - Comprehensive people policies and resources\n- **[Onboarding](../onboarding.md)** - Level expectations for new team members\n"}, {"type": "file", "name": "levels-management.md", "path": "people/careers/levels-management.md", "content": "---\ndescription: Management career levels M4-M10 at Ultralytics with detailed expectations, internal banding, people leadership scope, and strategic impact.\nkeywords: management levels, leadership ladder, people management, manager career, director, VP, Ultralytics careers\n---\n\n# Management Levels (M4-M10)\n\nComprehensive career framework for Management roles at Ultralytics, defining expectations from first-line management through executive leadership. Use these descriptions for leadership development, hiring decisions, and promotion planning.\n\n!!! info \"Management Track Overview\"\n\n    Management roles achieve results through building and leading teams. All management positions include direct reports and HR responsibilities. Both [IC](levels-ic.md) and Management tracks offer equal advancement potential and compensation at equivalent scope levels. See [Career Progression](index.md) for complete framework.\n\n## Career Progression\n\n```mermaid\nflowchart LR\n    M4[\"M4<br/>Lead Manager<br/>80% Ops\"]:::decide --> M5[\"M5<br/>Manager<br/>70% Ops\"]:::decide\n    M5 --> M6[\"M6<br/>Senior Manager<br/>60% Ops\"]:::decide\n    M6 --> M7[\"M7<br/>Head of<br/>50% Ops\"]:::decide\n    M7 --> M8[\"M8<br/>Director<br/>40% Ops\"]:::decide\n    M8 --> M9[\"M9<br/>VP<br/>30% Ops\"]:::decide\n    M9 --> M10[\"M10<br/>Senior VP<br/>20% Ops\"]:::decide\n\n    classDef decide fill:#FF9800,color:#fff\n```\n\n## Level Overview\n\n| Level                             | Title          | Career Stage                           | Ops/Strategic Focus     |\n| --------------------------------- | -------------- | -------------------------------------- | ----------------------- |\n| [M4](#m4-lead-manager)            | Lead Manager   | Lead Supervisory / Manager Supervisory | 80% Ops / 20% Strategic |\n| [M5](#m5-manager)                 | Manager        | Management                             | 70% Ops / 30% Strategic |\n| [M6](#m6-senior-manager)          | Senior Manager | Senior Manager                         | 60% Ops / 40% Strategic |\n| [M7](#m7-head-of)                 | Head of        | Head of / Middle Management            | 50% Ops / 50% Strategic |\n| [M8](#m8-director)                | Director       | Director Management                    | 40% Ops / 60% Strategic |\n| [M9](#m9-vp)                      | VP             | Senior Executive Management            | 30% Ops / 70% Strategic |\n| [M10](#m10-senior-vice-president) | Senior VP      | Enterprise Executive Leadership        | 20% Ops / 80% Strategic |\n\n---\n\n!!! tip \"Presence & Modeling\"\n\n    Leaders set the cadence for High-Resolution Hybrid. If you're within commutable distance, **Anchor Days (Tue/Wed/Thu) onsite with consistent badge use** are mandatory. Managers are accountable for modeling in-office collaboration, coaching attendance, and ensuring teams align to Anchor Day performance expectations.\n\n## M4: Lead Manager\n\n- **Career Stage**: Lead Supervisory / Manager Supervisory\n- **Typical Roles**: Engineering Manager, Product Manager (with reports), Design Manager, Marketing Manager, Sales Manager\n- **Focus**: 80% Operational / 20% Strategic - Day-to-day team management with hands-on involvement\n\n### Core Expectations\n\n| Dimension                            | M4 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                             |\n| ------------------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Leadership &<br>Scope**            | • Supervises team/group performing singular or closely related tasks<br>• Provides HR management responsibilities (hire, promote, assess, performance manage)<br>• Directs day-to-day operations with a weekly planning horizon<br>• Often collaborates with other functional areas, management, and outside vendors<br>• Assigns tasks, monitors work, exercises discretion in planning team workload and schedules                        |\n| **People<br>Management**             | • Documents results and metrics, provides ongoing coaching and feedback<br>• Provides input to HR actions (hiring decisions, job changes, promotions) for area<br>• Acts as guide, oversees established/standardized operations and activities<br>• May manage mix of entry-level and junior individual contributors (IC1-IC3)<br>• Routinely exercises discretion and independent judgment in workload management                          |\n| **Expertise &<br>Functional Skills** | • Demonstrates mastery of work supervised and broad knowledge of related areas<br>• May become actively involved to meet schedules and resolve critical problems<br>• Applies advanced principles and strategies to multiple specialty areas<br>• Often serves as a functional and process coach to build team bench strength<br>• Advises team effectively on moderately complex matters                                                   |\n| **Decision Making &<br>Impact**      | • Makes independent decisions on matters of diverse scope affecting team delivery<br>• Decisions guided by established policies, procedures, and business plans<br>• Regularly interprets policies and makes daily decisions within defined guidelines<br>• Implements plans to manage financials, business planning, and resource management<br>• Regularly makes significant decisions directly impacting success of one or more projects |\n| **Stakeholder<br>Management**        | • Leads teams to engage and monitor needs of well-defined stakeholders<br>• Sets priorities for team including occasionally non-routine situations<br>• Monitors needs of well-defined stakeholders, may set priorities for non-routine cases<br>• Influences through coaching and motivating team to action and results within department<br>• Sets goals and reviews with focus on monthly priorities and tactical execution              |\n| **Complexity &<br>Problem Solving**  | • Leads teams to find solutions following established methodologies<br>• Interprets and resolves moderately complex issues requiring data analysis<br>• Follows established practices and procedures with basic analytical approaches<br>• Begins providing fresh and practical solutions to persistent operational challenges<br>• Regularly faces unusual situations requiring policy interpretation and judgment                         |\n| **Collaboration &<br>Communication** | • Gains cooperation from others, frequently exchanges information<br>• Conveys straightforward information to team and stakeholders clearly<br>• Provides ongoing performance feedback and work guidance to direct reports<br>• Communicates team progress, blockers, and needs to management effectively<br>• Represents team in departmental meetings and cross-functional discussions                                                    |\n\n### Span & Team Structure\n\n- **Typical Direct Reports**: 2-4 individual contributors (primarily IC1-IC3)\n- **Organizational Depth**: Single layer - manages ICs directly\n- **Team Scope**: Single discipline or closely related tasks within one function\n- **Budget Responsibility**: Typically $100K-$250K annually, primarily team operational costs\n- **Time Horizon**: Day-to-day and weekly planning, monthly goal setting\n\n### Typical Background\n\n- **Bachelor's degree + 4 years experience** OR **Master's degree + 3 years** OR **PhD + 2 years**\n- Proven track record of excellence as individual contributor (typically IC4+)\n- Demonstrated ability to lead, mentor, and develop people effectively\n- Strong communication skills and emotional intelligence\n- Experience with project coordination and cross-functional collaboration\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Team consistently meets delivery commitments and quality standards\n    - ✅ Direct reports demonstrate measurable growth and skill development over time\n    - ✅ Proactively identifies and resolves team blockers and dependencies\n    - ✅ Maintains high team morale, engagement, and low attrition rates\n    - ✅ Makes sound hiring decisions that strengthen team capability\n    - ✅ Effectively balances hands-on work with people management\n    - ✅ Communicates team progress and needs clearly to leadership\n\n### Common Development Areas\n\n- Transitioning from individual contributor mindset to management thinking\n- Learning to achieve results through others rather than doing work directly\n- Developing coaching and feedback skills for different personality types\n- Building confidence in making difficult people decisions and conversations\n- Improving time management across competing and technical priorities\n- Growing comfort with ambiguity and incomplete information in decisions\n\n!!! warning \"Common First-Time Manager Challenges\"\n\n    - **Over-indexing on hands-on work**: Difficulty delegating and trusting team with decisions\n    - **Avoiding difficult conversations**: Hesitating to address performance issues directly\n    - **Micromanagement**: Struggling to let go of detailed control over work execution\n    - **Insufficient 1:1 time**: Underinvesting in people development and relationship building\n    - **Poor upward communication**: Failing to keep leadership informed of team challenges\n\n---\n\n## M5: Manager\n\n- **Career Stage**: Management\n- **Typical Roles**: Senior Engineering Manager, Senior Product Manager (large team), Head of Design, Senior Marketing Manager, Senior Sales Manager\n- **Focus**: 70% Operational / 30% Strategic - Multi-team coordination with strategic planning\n\n### Core Expectations\n\n| Dimension                            | M5 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                                                            |\n| ------------------------------------ | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Leadership &<br>Scope**            | • Manages activities of multiple sections, complex work area, or sub-department<br>• Work managed is varied and may cross disciplines or include non-related work groups<br>• Provides input to HR actions and department structure changes<br>• Guides staff by established function/department practices and well-defined procedures<br>• Monitors 6-12 month projects and programs, contributes to longer-term planning                                                 |\n| **People<br>Management**             | • Accountable for HR actions (hiring, promotions, comp changes) for area of responsibility<br>• Provides ongoing performance feedback and substantive work guidance to managers/leads<br>• Routinely exercises independent judgment managing budgets, timelines, workload, performance<br>• May manage other managers, senior ICs, or mix of leads and individual contributors<br>• Develops management capability in team leads or first-level managers reporting to them |\n| **Expertise &<br>Functional Skills** | • Demonstrates expertise in work managed with considerable business acumen<br>• Maintains broad knowledge of related areas and cross-functional understanding<br>• Widely applies advanced principles, strategies, theories, and concepts across areas<br>• May perform escalated and more complex duties directly when critical<br>• Leads teams to develop new methods, products, processes, and solutions                                                               |\n| **Decision Making &<br>Impact**      | • Leads teams in exploring options and making recommendations on large projects/programs<br>• Makes independent decisions around diverse scope impacting delivery, services, resourcing<br>• Influences decisions in related areas and across department/function boundaries<br>• Implements plans on complex matters for financials, business planning, resource management<br>• Accountable for financials, schedules, resource usage with broad organizational impact   |\n| **Stakeholder<br>Management**        | • Manages teams to assess stakeholder needs and contributes to management tactics<br>• Monitors and assesses results, resetting stakeholder approaches as needed<br>• Influences through motivating within and across organization to drive action and results<br>• Provides input to building highly adaptable teams that influence outcomes<br>• Relates effectively to variety of stakeholders, begins influencing top management                                       |\n| **Complexity &<br>Problem Solving**  | • Begins managing teams solving problems with limited precedent in the organization<br>• Exposes and resolves moderately to complex issues that often cross disciplines<br>• Presents results and recommendations across discipline and to senior leadership<br>• Develops persuasive and easy-to-understand cases to educate and persuade stakeholders<br>• Works on issues requiring conceptual thinking balanced with practical solutions                               |\n| **Collaboration &<br>Communication** | • Gains cooperation and support from others through influence and persuasion<br>• Develops persuasive cases and recommendations for senior leadership<br>• Effectively represents function in cross-organizational forums and meetings<br>• Builds collaborative relationships across multiple departments and functions<br>• Communicates complex information clearly to diverse and non-technical audiences                                                              |\n\n### Span & Team Structure\n\n- **Typical Direct Reports**: 4-8 people (mix of ICs, leads, or 2-3 first-level managers)\n- **Organizational Depth**: May have 2 layers if managing other managers\n- **Team Scope**: Multiple teams or disciplines, possibly cross-functional\n- **Budget Responsibility**: Typically $250K-$750K annually including salaries and operational costs\n- **Time Horizon**: Weekly and monthly operations, quarterly planning and goal setting\n\n### Typical Background\n\n- **Bachelor's degree + 6 years experience** OR **Master's degree + 4 years** OR **PhD + 4 years**\n- Proven success as first-level manager or managing large individual contributor teams\n- Track record of cross-functional leadership and stakeholder management\n- Demonstrated ability to develop other managers or senior leaders\n- Strong strategic thinking and business acumen beyond immediate function\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Department/function consistently achieves quarterly and annual objectives\n    - ✅ Multiple teams under leadership coordinate effectively with minimal friction\n    - ✅ Develops high-performing managers, leads, or senior ICs who get promoted\n    - ✅ Successfully navigates complex cross-functional dependencies and conflicts\n    - ✅ Makes strategic resource allocation decisions balancing priorities effectively\n    - ✅ Proactively identifies and addresses organizational challenges before escalation\n    - ✅ Represents function effectively in leadership forums and strategic discussions\n\n### Common Development Areas\n\n- Transitioning from managing ICs to managing through other managers\n- Developing strategic thinking and longer-term planning capabilities (6-12 months)\n- Building influence without direct authority across organizational boundaries\n- Learning to delegate operational decisions while maintaining oversight\n- Improving ability to develop and coach other managers effectively\n- Growing comfort with organizational politics and senior stakeholder management\n\n!!! note \"Management Through Others\"\n\n    M5 represents critical shift from direct people management to achieving results through other managers or leads. Success requires developing others' management capabilities rather than managing all individuals directly.\n\n---\n\n## M6: Senior Manager\n\n- **Career Stage**: Senior Manager\n- **Typical Roles**: Director of Engineering, Director of Product, Head of Design, Director of Marketing, Director of Sales\n- **Focus**: 60% Operational / 40% Strategic - Functional leadership with strategic planning\n\n### Core Expectations\n\n| Dimension                            | M6 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    |\n| ------------------------------------ | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Leadership &<br>Scope**            | • Manages activities of two or more sections, disciplines, or major processes/programs<br>• Directs activities of sub-function or small functional area through lower-level management<br>• Often includes variety of work groups across disciplines/specializations with regional/global reach<br>• Provides input to department strategy and large visible projects (1-3 year planning horizon)<br>• Accountable for HR actions and substantive changes to department structure and organization |\n| **People<br>Management**             | • Accountable for HR actions and changes to department structure across function<br>• Manages through other managers, rarely has individual contributors as direct reports<br>• Provides input to department structure decisions and organizational design initiatives<br>• Develops management bench strength through coaching, mentoring, and succession planning<br>• Creates culture and sets performance standards for entire function under leadership                                       |\n| **Expertise &<br>Functional Skills** | • Demonstrates expertise in several specialized areas/disciplines within domain<br>• Recognized authority for executives, plays key role in improving organizational intellectual capital<br>• Performs portions of more complex, novel work directly with team assistance when critical<br>• Builds organizational knowledge through combination of strategic hires, skill building, and methodology<br>• Leads teams to develop new methods and solve company-wide matters and challenges        |\n| **Decision Making &<br>Impact**      | • Makes independent decisions around design/implementation of strategy for new/updated programs<br>• Works with senior management to establish strategic plans and objectives for function<br>• Makes final decisions on approach to achievement and implementation within function<br>• Accountable for financials, schedules, resource usage with far-reaching business segment impact<br>• Establishes plans for major projects and programs, fully accountable for budget execution            |\n| **Stakeholder<br>Management**        | • Manages teams to anticipate advanced/systemically challenging stakeholder needs proactively<br>• Contributes to development and regular updating of strategy and associated stakeholder plans<br>• Expands, strengthens, develops stakeholder relationships coaching team to grow networks<br>• Influences actions and results through collaboration down management chain effectively<br>• Often advocates, educates, gains support for major projects and ideas with top management            |\n| **Complexity &<br>Problem Solving**  | • Leads teams in solving complex, cross-discipline issues critical to company success<br>• Translates business and technical strategy into actionable functional plans and execution<br>• Guides teams in execution to solve persistent, systemic organizational challenges<br>• Works on issues where analysis requires conceptual thinking balanced with practical solutions<br>• Develops highly persuasive and easy-to-understand cases for executive decision making                          |\n| **Collaboration &<br>Communication** | • Presents results and recommendations effectively to executive leadership and stakeholders<br>• Develops persuasive business cases for executive decision making on strategic matters<br>• Influences senior management through advocacy, education, and building support for initiatives<br>• Represents function as key voice in company-wide strategic discussions and planning<br>• Builds strong cross-functional executive relationships to drive organizational outcomes                   |\n\n### Span & Team Structure\n\n- **Typical Direct Reports**: 7-13 people through 2-3 managers\n- **Organizational Depth**: May have 2-3 layers of management reporting through hierarchy\n- **Team Scope**: Multiple related functions, large single function, or cross-functional organization\n- **Budget Responsibility**: Typically $750K-$2M annually including full department P&L\n- **Time Horizon**: Monthly operations, quarterly execution, annual strategic planning\n\n### Typical Background\n\n- **Bachelor's degree + 9 years experience** OR **Master's degree + 6 years** OR **PhD + 6 years**\n- Proven track record leading multiple teams and delivering significant business outcomes\n- Strong business acumen and strategic thinking capabilities\n- Demonstrated executive presence and ability to influence senior leadership\n- Experience managing through multiple layers of organizational hierarchy\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Function consistently achieves annual objectives and strategic milestones\n    - ✅ Successfully executes multi-quarter strategic initiatives with measurable business impact\n    - ✅ Develops multiple high-performing management teams and future leaders\n    - ✅ Influences company strategy and successfully advocates for cross-functional priorities\n    - ✅ Makes high-stakes decisions on resource allocation and strategic direction effectively\n    - ✅ Builds significant organizational capability, talent pipeline, and bench strength\n    - ✅ Recognized as functional leader by executive team and peer directors\n\n### Common Development Areas\n\n- Transitioning from operational execution to strategic leadership and vision setting\n- Developing executive presence and communication style for board and C-suite\n- Building deeper business acumen connecting functional work to business outcomes\n- Learning to influence company strategy beyond immediate functional responsibility\n- Growing comfort operating through multiple layers of organizational hierarchy\n- Strengthening ability to make strategic decisions with incomplete information\n\n!!! warning \"Strategic Balance Challenge\"\n\n    M6 requires equal focus on operational excellence (60%) and strategic leadership (40%). Many senior managers struggle balancing immediate execution pressures with long-term strategic thinking and organizational capability building.\n\n---\n\n## M7: Head of\n\n- **Career Stage**: Head of / Middle Management\n- **Typical Roles**: Head of Engineering, Head of Product, Head of Design, Head of Marketing, Head of Sales\n- **Focus**: 50% Operational / 50% Strategic - Executive partnership on company strategy\n\n### Core Expectations\n\n| Dimension                            | M7 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      |\n| ------------------------------------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Leadership &<br>Scope**            | • Leads activities of one or more sub-functions/divisions with regional and/or global reach<br>• Directs through subordinate directors and senior managers across entire organization<br>• Oversees multi-year strategies and plans in close partnership with executive leadership team<br>• Cascades company strategy to detailed functional plans and execution across organization<br>• Often has direct P&L responsibility or significant budget authority for major business segment            |\n| **People<br>Management**             | • Accountable for HR actions and major organizational structure changes company-wide<br>• Manages exclusively through senior managers and directors, no individual contributors<br>• Sets organizational culture, leadership standards, and talent strategy for entire function<br>• Drives succession planning and executive development at senior leadership levels<br>• Accountable for function-wide talent strategy, capability building, and organizational design                             |\n| **Expertise &<br>Functional Skills** | • Demonstrates expertise in several specialized areas/disciplines with broad business knowledge<br>• Recognized authority that plays critical key role in intellectual capital for organization<br>• Performs complex novel work when strategically critical, builds organizational knowledge<br>• Well-versed in internal and external methodologies, best practices, and emerging trends<br>• Oversees teams to develop innovative new methods and solve most critical company-wide matters        |\n| **Decision Making &<br>Impact**      | • Develops and provides strategy, vision, and direction to multiple functions organization-wide<br>• Implements company-wide policies and practices with broad organizational impact<br>• Leads teams to provide critical information and input to executive management and board<br>• Accountable for function financial results that directly impact overall company performance<br>• Outcomes and decisions have far-reaching impact to business segments, products, and strategic goals          |\n| **Stakeholder<br>Management**        | • Persuades others in bringing closure to sensitive, multi-faceted organizational challenges<br>• Manages relationships with complex, cross-domain/functional stakeholder groups company-wide<br>• Removes and remedies significant impediments to meeting business and technology strategic goals<br>• Influences through building strong cross-functional networks and organizational followership<br>• Serves as top influencer and advocate for new, transformative ideas and strategic projects |\n| **Complexity &<br>Problem Solving**  | • Builds and guides teams in solving company's most highly complex strategic challenges<br>• Builds and actively nurtures environment of innovation and creative problem solving<br>• Works with senior leadership to identify and assemble talent to solve critical problems<br>• Through assessment of intangible variables, identifies and addresses fundamental strategic issues<br>• Anticipates factors that could influence strategies and company's competitive position in market           |\n| **Collaboration &<br>Communication** | • Communicates vision and strategy effectively to board, executive team, and entire organization<br>• Represents company as executive voice to customers, partners, investors, and industry<br>• Influences company strategy through thought leadership and strategic recommendations<br>• Builds and maintains executive-level relationships across industry and ecosystem<br>• Partners directly with CEO and executive team on overall company strategy and direction                             |\n\n### Span & Team Structure\n\n- **Typical Direct Reports**: 10-20 people through 2-4 senior managers/directors\n- **Organizational Depth**: Has 3-4 levels of management reporting through organizational hierarchy\n- **Team Scope**: Multiple related functions, very large single function, or division-level responsibility\n- **Budget Responsibility**: Typically $2M-$4M annually with full P&L accountability for business segment\n- **Time Horizon**: Quarterly operations, annual execution, multi-year strategic vision and planning\n\n### Typical Background\n\n- **Bachelor's degree + 12 years experience** OR **Master's degree + 8 years** OR **PhD + 6 years**\n- Proven track record of organizational leadership at director level or equivalent\n- Strong strategic vision, business acumen, and executive presence\n- Demonstrated ability to influence at C-suite and board level\n- Experience building and leading large organizations through significant growth or transformation\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Function drives significant measurable company value and competitive market advantage\n    - ✅ Successfully executes multi-year strategic transformations with company-wide impact\n    - ✅ Develops organizational leaders and future executives through effective succession planning\n    - ✅ Influences company strategy and contributes meaningfully to board-level strategic decisions\n    - ✅ Represents company effectively and credibly to customers, partners, investors, and industry\n    - ✅ Builds world-class organizational capability that becomes competitive differentiator\n    - ✅ Makes strategic bets and decisions that significantly influence company trajectory\n\n### Common Development Areas\n\n- Developing deeper business acumen connecting functional excellence to shareholder value\n- Strengthening board-level communication and executive presence in high-stakes forums\n- Building stronger peer relationships with other executives and C-suite leaders\n- Growing influence on overall company strategy beyond immediate functional area\n- Developing next generation of executive leaders through deliberate succession planning\n- Strengthening ability to drive organizational change and transformation at scale\n\n!!! note \"Executive Partnership\"\n\n    M7 represents full executive partnership with CEO and board on company strategy. Success requires perfect balance between operational execution (50%) and strategic leadership (50%), operating as key member of executive leadership team.\n\n---\n\n## M8: Director\n\n- **Career Stage**: Director Management\n- **Typical Roles**: Director of Engineering, Director of Product, Director of Operations, Director of Marketing, Director of Sales\n- **Focus**: 40% Operational / 60% Strategic - Functional director with executive influence\n\n### Core Expectations\n\n| Dimension                            | M8 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                                              |\n| ------------------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| **Leadership &<br>Scope**            | • Leads large functional area or multiple sub-functions with company-wide impact<br>• Directs through senior managers and directors, builds strong management bench<br>• Drives multi-year strategic initiatives in partnership with executive team<br>• Influences company strategy through functional expertise and leadership<br>• P&L accountability for major functional area affecting company performance                                             |\n| **People<br>Management**             | • Accountable for fun
