ctional talent strategy and leadership development<br>• Manages through senior managers and directors with multiple organizational layers<br>• Sets functional culture and performance standards across organization<br>• Drives succession planning and leadership pipeline development<br>• Builds world-class functional capability and organizational bench strength                                                                |\n| **Expertise &<br>Functional Skills** | • Demonstrates deep expertise across functional domain with strong business acumen<br>• Recognized functional authority playing key role in organizational capability<br>• Drives innovation and best practices that improve organizational effectiveness<br>• Well-versed in industry methodologies and emerging functional trends<br>• Builds functional knowledge through strategic hiring, development, and process improvement                          |\n| **Decision Making &<br>Impact**      | • Makes strategic decisions on functional direction with company-wide implications<br>• Works with executive team to align functional strategy with company objectives<br>• Accountable for functional financial results directly impacting company performance<br>• Influences executive decisions through functional expertise and data-driven recommendations<br>• Outcomes significantly affect company capability, efficiency, and competitive position |\n| **Stakeholder<br>Management**        | • Manages complex stakeholder relationships across functional and executive levels<br>• Contributes to executive strategy development and company planning processes<br>• Builds strong relationships with peer directors and executive leadership<br>• Influences through data, functional expertise, and collaborative problem solving<br>• Represents function effectively in company-wide strategic discussions                                          |\n| **Complexity &<br>Problem Solving**  | • Solves highly complex functional challenges with company-wide implications<br>• Translates business strategy into functional plans and measurable outcomes<br>• Guides teams in solving systemic organizational challenges effectively<br>• Works on issues requiring sophisticated analysis and strategic thinking<br>• Develops innovative solutions to persistent functional and organizational challenges                                              |\n| **Collaboration &<br>Communication** | • Communicates functional strategy effectively to executive team and organization<br>• Represents function in executive forums and company-wide strategic planning<br>• Influences executive leadership through effective advocacy and data-driven insights<br>• Builds collaborative relationships with peer directors and cross-functional leaders<br>• Communicates complex functional matters clearly to diverse audiences                               |\n\n### Span & Team Structure\n\n- **Typical Direct Reports**: 15-25 people through 3-4 senior managers/directors\n- **Organizational Depth**: Has 3-4 levels of management reporting through hierarchy\n- **Team Scope**: Large functional area or multiple related sub-functions\n- **Budget Responsibility**: Typically $3M-$5M annually with full functional P&L\n- **Time Horizon**: Quarterly execution, annual strategic planning, multi-year vision\n\n### Typical Background\n\n- **Bachelor's degree + 12 years experience** OR **Master's degree + 9 years** OR **PhD + 7 years**\n- Proven track record of functional leadership at senior management level\n- Strong strategic thinking and executive presence\n- Demonstrated ability to influence at executive level\n- Experience building high-performing functional organizations\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Function consistently achieves strategic objectives with measurable impact\n    - ✅ Successfully drives multi-year functional transformations\n    - ✅ Develops strong management bench and future functional leaders\n    - ✅ Influences company strategy through functional expertise\n    - ✅ Makes high-impact decisions on functional direction and resource allocation\n    - ✅ Builds organizational capability recognized as competitive advantage\n    - ✅ Recognized as functional authority by executive team\n\n### Common Development Areas\n\n- Expanding influence from functional to company-wide strategic impact\n- Developing executive communication and board-level presence\n- Building stronger peer relationships across executive leadership\n- Growing influence on overall company strategy and direction\n- Strengthening ability to drive cross-functional transformation\n- Developing next generation of functional executives\n\n!!! note \"Director Leadership\"\n\n    M8 represents senior functional leadership with significant company influence. Success requires balancing functional execution (40%) with strategic leadership (60%) while developing strong organizational capability.\n\n---\n\n## M9: VP\n\n- **Career Stage**: Senior Executive Management\n- **Typical Roles**: VP of Engineering, VP of Product, VP of Marketing, VP of Sales, VP/GM for major business unit\n- **Focus**: 30% Operational / 70% Strategic - Senior executive leadership with board-level partnership and division/accountable P&L\n\n### Core Expectations\n\n| Dimension                            | M9 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                                                         |\n| ------------------------------------ | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Leadership &<br>Scope**            | • Leads multiple functions/divisions with global reach and major business segment accountability<br>• Directs through multiple directors and senior managers with extensive organizational hierarchy<br>• Translates enterprise vision into segment strategy and multi-year transformation<br>• Partners with executive team on competitive positioning and growth bets<br>• Full P&L accountability for major business segments or global functions                    |\n| **People<br>Management**             | • Accountable for talent strategy and executive leader development within segment<br>• Manages through directors and senior managers across multiple organizational layers<br>• Sets culture standards and operating mechanisms for divisions under scope<br>• Leads succession planning for vice presidents and critical leadership roles<br>• Builds leadership bench to support expansion, acquisitions, and scaling                                                 |\n| **Expertise &<br>Functional Skills** | • Deep expertise across domains with strong commercial and strategic acumen<br>• Shapes organizational intellectual capital and competitive advantage for segment<br>• Drives innovation and strategic initiatives that strengthen market position<br>• Maintains industry networks and best practices to inform strategy<br>• Builds capability via strategic partnerships, hiring, and development                                                                    |\n| **Decision Making &<br>Impact**      | • Shapes strategy and long-term vision for business segments with executive team<br>• Makes strategic decisions that materially impact revenue, margin, and market position<br>• Accountable for segment performance directly affecting shareholder value<br>• Influences board-level decisions through data-driven recommendations<br>• Leads cross-segment prioritization and resource allocation                                                                     |\n| **Stakeholder<br>Management**        | • Manages critical external relationships with strategic customers, partners, and investor counterparts<br>• Represents segment in board updates and market conversations with CEO/CFO partnership<br>• Builds executive networks across industry and global business community<br>• Aligns organization on most critical strategic initiatives<br>• Serves as primary executive voice for segment strategy externally                                                  |\n| **Complexity &<br>Problem Solving**  | • Solves highly complex strategic challenges within scope requiring transformative thinking<br>• Navigates significant uncertainty in markets and competitive dynamics<br>• Builds capacity to address emerging opportunities and risks<br>• Makes strategic bets on technology, markets, and organizational direction<br>• Anticipates industry trends and positions segment for long-term advantage                                                                   |\n| **Collaboration &<br>Communication** | • Partners with CEO and executive team on vision, strategy, and transformation initiatives<br>• Represents company as senior executive voice to customers, partners, and analysts<br>• Influences industry direction through thought leadership and strategic partnerships<br>• Builds and maintains significant executive relationships across global business community<br>• Communicates segment vision and strategy with exceptional clarity and executive presence |\n\n### Span & Team Structure\n\n- **Typical Direct Reports**: 20+ leaders through multiple directors and senior managers\n- **Organizational Depth**: Has 4+ levels of management reporting through organizational hierarchy\n- **Team Scope**: Multiple major functions or a global business unit with board-visible outcomes\n- **Budget Responsibility**: Typically $5M+ annually with full P&L accountability for major segments\n- **Time Horizon**: Annual execution, multi-year growth strategy, and portfolio scaling\n\n### Typical Background\n\n- **Bachelor's degree + 15+ years experience** OR **Master's degree + 12+ years** OR **PhD + 10+ years**\n- Proven track record of executive leadership with measurable business impact at director level\n- Recognized industry authority with extensive executive networks and influence\n- Demonstrated ability to drive organizational transformation and growth at scale\n- Strong board-level presence and strategic partnership capabilities\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Business segment exceeds revenue, margin, and growth targets with clear attribution\n    - ✅ Executes transformations that improve efficiency, quality, or market share at scale\n    - ✅ Builds a strong VP/director bench with visible promotions and successors\n    - ✅ Earns board and executive confidence in segment strategy and forecasts\n    - ✅ Strategic customers and partners deepen commitments under leadership\n    - ✅ Capital and resource allocation decisions produce high ROI across initiatives\n    - ✅ Represents company with credibility to investors, partners, and industry forums\n\n### Common Development Areas\n\n- Expanding influence on global trends and industry-wide innovation\n- Building deeper relationships with board members and major investors\n- Developing C-suite successors and future executive leadership\n- Strengthening ability to drive company-wide transformation at scale\n- Growing influence on long-term market positioning and competitive strategy\n- Building industry partnerships that create strategic advantage\n\n!!! note \"Senior Executive Leadership\"\n\n    M9 represents senior executive leadership for major business segments with board engagement. Success requires prioritizing strategic leadership (70%) over operational execution (30%) while maintaining organizational excellence and preparing for enterprise-level scope.\n\n---\n\n## M10: Senior Vice President\n\n- **Career Stage**: Enterprise Executive Leadership\n- **Typical Roles**: Senior/Executive Vice President, President of major business unit, Chief Officers (CTO, CPO, CMO, CRO)\n- **Focus**: 20% Operational / 80% Strategic - Enterprise stewardship with board/investor partnership and market shaping\n\n### Core Expectations\n\n| Dimension                            | M10 Requirements                                                                                                                                                                                                                                                                                                                                                                                                                                            |\n| ------------------------------------ | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Leadership &<br>Scope**            | • Leads enterprise portfolio of global functions or multiple business units with company-wide accountability<br>• Sets enterprise strategy with CEO and board, directing through VPs and EVPs<br>• Guides multi-year transformations, M&A integration, and major capital investments<br>• Owns cross-portfolio results, risk posture, and long-term value creation<br>• Establishes governance mechanisms and executive operating rhythm across the company |\n| **People<br>Management**             | • Accountable for executive team performance, culture, and succession across the company<br>• Manages through vice presidents and executive staff across deep organizational layers<br>• Sets cultural guardrails and leadership standards for the enterprise<br>• Ensures CEO and board succession pipeline; mentors C-suite successors<br>• Builds executive cohesion and resolves conflict across top leadership                                         |\n| **Expertise &<br>Functional Skills** | • Recognized industry thought leader with multi-domain expertise and macro-level business insight<br>• Sets enterprise bets on technology, product, market, and operating model evolution<br>• Evaluates build/buy/partner/M&A approaches to accelerate strategy and capabilities<br>• Anticipates disruptive trends and positions company to capitalize on them<br>• Shapes intellectual capital and brand to reinforce market leadership                  |\n| **Decision Making &<br>Impact**      | • Defines enterprise priorities, capital allocation, and portfolio strategy with board oversight<br>• Makes decisions with company- and market-level impact on valuation and positioning<br>• Leads risk management, governance, and crisis response for the enterprise<br>• Balances growth, profitability, and resilience across business units<br>• Drives investments that expand TAM, enter new markets, or reshape the business model                 |\n| **Stakeholder<br>Management**        | • Primary executive interface to board, investors, regulators, and most strategic customers<br>• Crafts and tells the enterprise story to markets, media, and industry forums<br>• Builds enduring relationships with global partners, alliances, and policy groups<br>• Oversees investor relations narratives with CFO/CEO; manages activist and regulatory risk<br>• Leads complex negotiations and strategic partnerships at enterprise scale           |\n| **Complexity &<br>Problem Solving**  | • Resolves ambiguous, systemic issues spanning markets, geographies, and regulatory environments<br>• Uses scenario planning and portfolio management to navigate uncertainty<br>• Designs organizational structures enabling rapid adaptation and resilience<br>• Guides company through crises, market shifts, and disruptive competition<br>• Balances near-term execution with long-term strategic optionality                                          |\n| **Collaboration &<br>Communication** | • Aligns executive team and board around vision, priorities, and strategic trade-offs<br>• Communicates strategy with clarity to global organization and external stakeholders<br>• Advocates for company position shaping industry standards and policy<br>• Models transparent, decisive communication during high-stakes moments<br>• Builds trust across diverse cultures, regions, and investor bases                                                  |\n\n### Span & Team Structure\n\n- **Typical Direct Reports**: 25+ leaders through VPs/EVPs and executive staff\n- **Organizational Depth**: Has 5+ layers of leadership across global organization\n- **Team Scope**: Multiple global business units or full enterprise portfolio\n- **Budget Responsibility**: Typically $10M+ multi-P&L with capital allocation authority\n- **Time Horizon**: Multi-year strategic cycles, market positioning, succession planning\n\n### Typical Background\n\n- **Bachelor's degree + 18+ years experience** OR **Master's degree + 15+ years** OR **PhD + 12+ years**\n- Proven track record leading enterprise-scale organizations with sustained business impact\n- Recognized industry executive with deep board and investor exposure\n- Demonstrated success driving large-scale transformations and portfolio shifts\n- Extensive experience building cohesive executive teams and successors\n\n### Success Indicators\n\n!!! success \"Key Performance Signals\"\n\n    - ✅ Drives enterprise-level strategic initiatives with measurable impact on valuation and market position\n    - ✅ Earns sustained confidence of board, investors, and regulators\n    - ✅ Establishes resilient executive team with clear succession plans for critical roles\n    - ✅ Expands markets, TAM, or business model in ways that meaningfully grow the company\n    - ✅ Navigates crises effectively while preserving culture and performance\n    - ✅ Shapes industry direction and policy in ways that benefit the company\n    - ✅ Builds enduring strategic partnerships that unlock step-function growth\n\n### Common Development Areas\n\n- Balancing multi-horizon investments across portfolio while maintaining focus\n- Deepening global regulatory, policy, and geopolitical awareness\n- Strengthening board/investor relationship management in volatile markets\n- Building diverse, globally capable executive benches and successors\n- Anticipating disruptive trends and pivoting enterprise strategy decisively\n- Sustaining culture and cohesion through rapid scale and transformation\n\n!!! note \"Enterprise Stewardship\"\n\n    M10 represents enterprise executive leadership with primary board and market stewardship. Success requires prioritizing strategic leadership (80%) while ensuring disciplined operations and resilience across the global portfolio.\n\n---\n\n## Level Comparison Matrix\n\n| Dimension        | M4          | M5        | M6         | M7         | M8         | M9        | M10               |\n| ---------------- | ----------- | --------- | ---------- | ---------- | ---------- | --------- | ----------------- |\n| **Focus**        | 80/20       | 70/30     | 60/40      | 50/50      | 40/60      | 30/70     | 20/80             |\n| **Span**         | 2-4 ICs     | 4-8       | 7-13       | 10-20      | 15-25      | 20+       | 25+ execs         |\n| **Layers**       | 1 layer     | 1-2       | 2-3        | 3-4        | 3-4        | 4+        | 5+                |\n| **Scope**        | Team        | Multi-tm  | Function   | Multi-func | Division   | Company   | Enterprise        |\n| **Planning**     | Monthly     | Quarterly | Annual     | Multi-year | Multi-year | Long-term | Market-cycle      |\n| **Budget**       | $100K-$250K | $250-750K | $750K-$2M  | $2M-$4M    | $3M-$5M    | $5M+      | $10M+ / multi-P&L |\n| **Stakeholders** | Defined     | Varied    | Cross-org  | Exec/Board | Exec/Board | Board/Inv | Board/Markets     |\n| **Problems**     | Moderate    | Complex   | Cross-disc | Strategic  | Strategic  | Transform | Systemic/Market   |\n\n## Core Management Competencies\n\n!!! note \"Universal Management Skills\"\n\n    Regardless of level, all Ultralytics managers demonstrate excellence in:\n\n    - **Hiring**: Build strong teams through effective recruiting, interviewing, and selection\n    - **Performance Management**: Set clear expectations, provide regular feedback, manage performance\n    - **Development**: Coach and mentor direct reports for continuous growth and advancement\n    - **Communication**: Clearly communicate vision, priorities, decisions, and rationale\n    - **Accountability**: Take ownership of team results and individual management actions\n    - **Inclusion**: Build diverse teams and create genuinely inclusive work environment\n    - **Strategic Thinking**: Connect team/function work to company goals and business strategy\n\n## Using This Guide\n\n### For Managers\n\n**Self-Assessment Process**:\n\n1. **Review current level expectations** thoroughly across all dimensions\n2. **Evaluate performance honestly** against each criterion and dimension\n3. **Identify development areas** - 2-3 specific areas for improvement\n4. **Compare to next level** - Understand clearly the path forward\n5. **Discuss with manager/skip-level** - Align on assessment and create growth plan\n\n**Development Planning**:\n\n- Identify specific gaps in leadership capability relative to next level expectations\n- Find opportunities to practice next-level work with support from leadership\n- Set quarterly development goals targeting specific next-level management criteria\n- Document concrete examples of next-level performance for promotion discussions\n- Seek regular feedback from manager, peers, and direct reports on progress\n\n### For Hiring Managers\n\n**Interviewing & Leveling**:\n\n- Use these criteria during job leveling and compensation offer determination\n- Share relevant level expectations with candidates to set clear role expectations\n- Reference during onboarding to align on goals, priorities, and success metrics\n- Use in performance reviews for consistent, fair evaluation across organization\n- Guide promotion discussions with concrete, evidence-based criteria\n\n## Promotion Readiness\n\n### Typical Timeline\n\n- **M4 → M5**: 18-24 months demonstrating multi-team coordination and management excellence\n- **M5 → M6**: 24-36 months demonstrating functional leadership and strategic impact\n- **M6 → M7**: 36+ months demonstrating executive-level influence and organizational transformation\n- **M7 → M8**: 36+ months demonstrating director-level functional leadership and execution\n- **M8 → M9**: 48+ months demonstrating senior executive leadership and board-level partnership\n- **M9 → M10**: 60+ months demonstrating enterprise leadership, investor stewardship, and market-shaping impact\n\n!!! warning \"Promotion Requirements\"\n\n    Management promotions require **sustained demonstration** of next-level performance across **all dimensions**, particularly people development, strategic thinking, and organizational impact. Discuss readiness quarterly with your manager and skip-level, and document specific examples of next-level leadership.\n\n### Building a Promotion Case\n\nStrong promotion cases include:\n\n- **Leadership Examples**: 3-5 specific examples demonstrating next-level management impact\n- **Team Development**: Evidence of developing high-performing teams and future leaders\n- **Strategic Impact**: Quantified business results from strategic initiatives and decisions\n- **Stakeholder Feedback**: Input from peers, skip-level, and cross-functional partners\n- **Growth Trajectory**: Clear pattern of increasing scope, impact, and responsibility over time\n\n## Related Resources\n\n- **[IC Levels](levels-ic.md)** - Detailed IC1-IC9 expectations for technical track\n- **[Career Progression](index.md)** - Complete framework, promotion process, track switching\n- **[People & Benefits](../index.md)** - Comprehensive people policies and resources\n- **[Onboarding](../onboarding.md)** - Management expectations for new managers\n"}]}, {"type": "file", "name": "index.md", "path": "people/index.md", "content": "---\ndescription: Ultralytics People & Benefits overview covering onboarding, time off, career development, and employee resources.\nkeywords: Ultralytics people, employee benefits, onboarding, PTO, career development, HR policies\n---\n\n# People & Benefits 👥\n\nWelcome to the People & Benefits section of the Ultralytics Handbook. This area covers everything related to your experience as a team member, from your first day through your ongoing career development.\n\n## Overview\n\nAt Ultralytics, we believe in supporting our team members through comprehensive policies, transparent practices, and a culture that values growth and well-being. This section provides guidance on:\n\n- **Onboarding**: Your roadmap for the first 90 days\n- **Time Off**: PTO policy, holidays, and sick leave\n- **Finance**: Travel, relocation, and referral bonuses\n- **Career Growth**: Development opportunities and progression\n\n## In-Office Experience 🏢\n\nOur High-Resolution Hybrid model makes the office a performance advantage: company-paid lunch every Wednesday for in-office employees, immediate access to higher-spec hardware and lab setups, purpose-built collaboration spaces for whiteboarding and debugging, and faster decision loops with your team. The office is the perk that keeps latency low and innovation high.\n\n## Quick Links 🔗\n\n### Getting Started\n\n- **[Onboarding Guide](onboarding.md)** - Complete roadmap for your first 90 days at Ultralytics\n- **[Hardware Policy](../tools/hardware.md)** - Equipment setup and refresh cycles\n- **[Software Policy](../tools/software.md)** - Approved tools and request procedures\n\n### Time Off & Benefits\n\n- **[PTO Policy](pto-policy.md)** - 25 days annual leave plus unlimited sick leave\n- **[Travel Policy](../finance/travel.md)** - Per diem rates and booking procedures\n- **[Relocation Policy](../finance/relocation.md)** - $10K for onsite collaboration moves\n\n### Career & Growth\n\n- **[Career Progression Framework](careers/index.md)** - Overview, promotion process, and track switching\n    - [IC Levels (IC1-IC9)](careers/levels-ic.md) - Individual Contributor expectations\n    - [Management Levels (M4-M10)](careers/levels-management.md) - Management expectations\n- **Performance Reviews** - Quarterly reviews in Rippling with growth planning; compensation is reviewed annually\n- **Learning Budget** - Annual budget for courses, books, and conferences (contact HR for current amounts)\n\n### Rewards & Recognition\n\n- **[Referral Bonus](../finance/referral-bonus.md)** - $5K for successful referrals\n\n## For All Team Members 🚀\n\n!!! success \"Getting Started\"\n\n    Begin here:\n\n    1. **Read the [Onboarding Guide](onboarding.md)** - Your complete first 90 days roadmap\n    2. **Review [Mission & Values](../mission-vision-values/index.md)** - Understand what drives us\n    3. **Check [Hardware Policy](../tools/hardware.md)** - Know what equipment to expect\n    4. **Explore Our [Workflows](../workflows/product-development.md)** - See how we build and innovate\n\n## Time Off & Leave 📅\n\n### Paid Time Off (PTO)\n\nAll team members receive:\n\n- **25 days annual PTO** (24 days + 1 birthday)\n- **Public holidays** in your country of residence\n- **Unlimited sick leave** as needed\n- **Tenure bonuses**: Additional PTO days every 2 years of service\n\nSee complete [PTO Policy](pto-policy.md) for details on requesting time off, rollover limits, and tenure bonuses.\n\n### Requesting Time Off\n\nFollow the mandatory notice requirements in the [PTO Policy](pto-policy.md), then:\n\n1. Submit request in [Rippling](https://www.rippling.com/)\n2. Wait for manager approval\n3. Update team calendar and Slack status\n\n## Career Development 📈\n\n### Career Progression Framework\n\nUltralytics provides clear career paths through two tracks, allowing you to advance based on your strengths and interests:\n\n**Individual Contributor (IC) Track** - IC1 through IC9\n\n- Deep expertise and individual impact\n- Influence through knowledge and functional leadership\n- See [complete IC level descriptions](careers/levels-ic.md)\n\n**Management Track** - M4 through M10\n\n- Organizational leadership and people development\n- Achieving results through building and leading teams\n- Strategic direction and resource management\n- See [complete Management level descriptions](careers/levels-management.md)\n\n**Key Resources:**\n\n- **[Career Progression Framework](careers/index.md)** - Promotion process, compensation philosophy, switching tracks\n    - [IC Levels Guide](careers/levels-ic.md) - Detailed expectations for IC1-IC9\n    - [Management Levels Guide](careers/levels-management.md) - Detailed expectations for M4-M10\n\nBoth tracks are valued equally and offer equivalent compensation and growth potential at similar scope levels.\n\n### Learning & Growth\n\n- **Annual Learning Budget**: Books, courses, certifications, and workshops\n- **Conference Attendance**: Relevant industry conferences with expenses covered\n- **Internal Training**: Regular workshops, and knowledge sharing\n- **Mentorship Program**: Pairing with senior team members\n- **Side Projects**: 10% time for exploring new ideas (with manager approval)\n\nContact HR for current learning budget amounts and policies.\n\n### Performance Reviews\n\n- **Quarterly reviews** via [Rippling](https://www.rippling.com/) every 3 months\n- **360° feedback** from manager, peers, and direct reports\n- **Growth planning** with clear development goals aligned to [career levels](careers/index.md)\n- **Career progression** with defined levels and promotion criteria\n- **Compensation reviews** conducted annually at year-end, applied in Q1 (January paycheck)\n- **Community Presence (Core Competency)**: Consistent participation in **Anchor Days (Tue/Wed/Thu)** keeps you on track for meeting expectations and promotions; protected leave and documented exceptions are exempt, and we review badge data to credit consistent attendance.\n\n### Internal Mobility\n\nWe encourage internal transfers and role changes:\n\n- Discuss with your manager first\n- Must be meeting expectations in current role\n- Typically requires 12+ months in position\n- Interviews may be required for significant changes\n\n## Compensation & Equity 💰\n\nUltralytics offers competitive Series A-level compensation including:\n\n- Market-rate salaries benchmarked against top tech companies\n- Meaningful equity grants with a 90-day post-termination exercise window\n- Performance bonuses for exceptional contributions\n- Comprehensive benefits package\n\n## Finance & Expenses 💳\n\n### Expense Reimbursement\n\n- **Under $3,000**: Pay personally, submit receipts by the monthly cutoff, and receive approved expenses together in the next monthly reimbursement batch\n- **$3,000+**: Get pre-approval, then submit receipts after purchase\n\nSee [Finance Handbook](../finance/index.md) for complete reimbursement procedures.\n\n### Travel\n\n- **Per Diem**: Covers all meals, ground transportation, and incidentals\n- **Airfare**: Economy class only, reimbursed separately\n- **Advance Notice**: 2 weeks minimum for travel booking\n\nSee [Travel Policy](../finance/travel.md) for per diem rates by city.\n\n### Relocation\n\nEligible employees relocating to hub cities (Madrid, London, Shenzhen):\n\n- **$10,000 flat one-time payment**\n- Pre-approval required; 30-minute commute to hub required\n- 24-month clawback schedule applies\n\nSee [Relocation Policy](../finance/relocation.md) for eligibility criteria.\n\n## Policies & Compliance ⚖️\n\n### AI-First Expectation\n\nAt Ultralytics, our AI-first principle is woven into every role. We aggressively leverage approved AI tools and automations to accelerate workflows, enhance quality, and drive innovation. This mandate comes with a critical responsibility: apply rigorous judgment to ensure data security and output accuracy.\n\n### Required Training\n\nAll employees complete annual mandatory training via [Vanta](https://app.vanta.com/c/ultralytics/employee/onboarding):\n\n- **CCPA** (California Consumer Privacy Act)\n- **GDPR** (General Data Protection Regulation)\n- **General Security Awareness**\n- **Secure Development Training** (for technical roles)\n\n### Code of Conduct\n\nReview our [Code of Business Conduct and Ethics](../legal/code-of-business-conduct-and-ethics.md) for:\n\n- Workplace behavior standards\n- Anti-discrimination and harassment policies\n- Conflicts of interest guidelines\n- Data protection responsibilities\n\nAlso review our [Social Media Policy](../contributions/social-media-policy.md) for professional conduct and brand representation guidelines.\n\n## Support & Resources 💬\n\n### Who to Contact\n\n- **HR Questions**: Contact your manager or the HR team in `#hr`\n- **IT/Technical**: Use the `#it-support` Slack channel\n- **Finance**: Ask in `#finance` for expenses, reimbursements, or benefits\n- **Legal**: [legal@ultralytics.com](mailto:legal@ultralytics.com) for contracts and compliance\n- **Security**: [security@ultralytics.com](mailto:security@ultralytics.com) for incidents\n\n### Key Resources\n\n- **Rippling**: HR portal for PTO requests, profile updates, and equipment\n- **[Vanta](https://app.vanta.com/)**: Compliance training and security policies\n- **[Ultralytics Portal](https://portal.ultralytics.com/signin)**: Your gateway to onboarding, real-time dashboards, powerful AI agent controls, and essential ops tools.\n- **[FAQ](../faq/index.md)**: Common questions and answers\n- **[Handbook GitHub](https://github.com/ultralytics/handbook)**: Submit improvements via PR\n\n## Questions? 💡\n\nCan't find what you're looking for?\n\n- **Search the handbook** using the search bar at the top\n- **Ask your manager** for policy clarifications or personal matters\n- **Contact HR** for benefits, leave, or employee relations\n- **Submit a PR** to improve this handbook for everyone\n"}, {"type": "file", "name": "onboarding.md", "path": "people/onboarding.md", "content": "---\ndescription: Ultralytics onboarding guide for new team members covering first week, first month, and first 90 days with clear milestones and resources.\nkeywords: Ultralytics onboarding, new employee guide, first 90 days, onboarding checklist, team onboarding\n---\n\n# New Team Member Onboarding 🚀\n\nWelcome to Ultralytics! This guide will help you navigate your first 90 days and set you up for success.\n\n## Before Your First Day 📋\n\n!!! info \"Pre-Start Timeline\"\n\n    Expect to receive your onboarding materials **5-7 business days** before your start date. Contact HR immediately if you haven't received everything by this time.\n\n!!! tip \"High-Resolution Hybrid Reminder\"\n\n    We work where the speed is. If you're within commutable distance of a hub, plan to be onsite every **Tuesday, Wednesday, and Thursday (Anchor Days)** starting Week 1; badge data is reviewed and presence is part of performance. Coordinate travel for Week 1 as needed.\n\n### Pre-Start Checklist\n\n<div class=\"grid cards\" markdown>\n\n- :material-file-document-outline: **Documents**\n\n    ***\n\n    Employment contract and required paperwork\n\n- :material-laptop: **Equipment**\n\n    ***\n\n    Hardware specs and delivery details\n\n- :material-account-key: **Access**\n\n    ***\n\n    Google Workspace, Slack, GitHub credentials\n\n- :material-book-open-page-variant: **Reading**\n\n    ***\n\n    [Introduction](../introduction.md) and [Mission & Values](../mission-vision-values/index.md)\n\n</div>\n\n### Access Setup Sequence\n\n- Expect to first receive an invite at your **personal email** to sign into [Rippling](https://www.rippling.com/) and complete all onboarding steps there (ID verification, profile, benefits, etc.).\n- After Rippling is ready, sign into Slack with your new Ultralytics email so teammates can find you.\n- Finally, sign up to the [Ultralytics Portal](https://portal.ultralytics.com/signin)—your essential gateway for internal orientation, critical onboarding tasks, and immediate access to core company resources.\n\n### What to Prepare\n\n| Item                     | Purpose                                        | When Needed |\n| ------------------------ | ---------------------------------------------- | ----------- |\n| **Government-issued ID** | Background check verification                  | Day 1       |\n| **Bank details**         | Payroll setup                                  | First week  |\n| **Emergency contact**    | Update in [Rippling](https://www.rippling.com) | Day 1       |\n| **Questions list**       | Reference during onboarding                    | Day 1       |\n\n## First Day 🎉\n\n### Morning Session (9:00 AM - 12:00 PM)\n\n=== \"Welcome Meeting (30 min)\"\n\n    **With your manager:**\n\n    - Office tour (onsite at our dog-friendly office 🐶) or virtual workspace overview\n    - Team introductions\n    - First week schedule review\n    - Anchor Day expectations (Tue/Wed/Thu onsite) and badge process\n\n=== \"IT Setup (60 min)\"\n\n    **Getting your workspace ready:**\n\n    - Unbox and configure hardware\n    - Install Rippling MDM on all devices\n    - Set up Google Workspace, Slack, GitHub\n    - Sign up to the [Ultralytics Portal](https://portal.ultralytics.com/signin) post-Slack setup. This is your central operational hub, featuring real-time dashboards, vital onboarding steps, and critical tools.\n    - Configure email signature (automated)\n\n    Need help? Post in the `#it-support` Slack channel for fastest response.\n\n=== \"HR Onboarding (45 min)\"\n\n    **Administrative setup:**\n\n    - Complete Rippling profile\n    - Review benefits and PTO policy\n    - Sign any remaining documents\n    - Set up direct deposit\n\n### Afternoon Session (1:00 PM - 5:00 PM)\n\n=== \"Team Lunch (60 min)\"\n\n    **Onsite:** Join team at local restaurant or office kitchen\n    **Remote:** Virtual coffee chat\n\n=== \"Security Training (60 min)\"\n\n    !!! warning \"Required Compliance\"\n\n        Must be completed on Day 1\n\n    - Complete GDPR, CCPA, and security awareness training via [Vanta](https://app.vanta.com/)\n    - Review [Security Requirements](../security/employee-security-compliance-requirements.md)\n    - Understand [Code of Conduct](../legal/code-of-business-conduct-and-ethics.md)\n    - Review [Social Media Policy](../contributions/social-media-policy.md)\n\n=== \"Dev Environment (90 min)\"\n\n    **For engineering roles:**\n\n    ```bash\n    # Clone repositories\n    git clone https://github.com/ultralytics/ultralytics.git\n    cd ultralytics\n\n    # Install dependencies\n    pip install -e .\n\n    # Verify installation\n    yolo checks\n    ```\n\n    - Set up IDE and tools per [Software Policy](../tools/software.md)\n\n=== \"First Assignment\"\n\n    **Quick win:**\n\n    - Small starter task or documentation review\n    - Submit your first PR (even a typo fix counts!)\n\n## First Week 📚\n\n### Key Objectives\n\n- **Understand the company**: Mission, values, products, and market position\n- **Meet the team**: Schedule 30-min coffee chats with key collaborators\n- **Learn the tech stack**: Read documentation, explore codebase\n- **Embrace AI-First**: Integrate approved AI assistants and automations into your daily toolkit—driving efficiency and accelerating impact\n- **Complete required training**: All compliance modules in Vanta\n- **Ship your first contribution**: Submit a small PR (documentation fix, test addition, or bug fix)\n\n### Daily Schedule\n\n**High-Resolution Hybrid cadence**:\n\n- **Tue/Wed/Thu (Anchor Days)**: Onsite, synchronous collaboration; attend standups, whiteboard sessions, and pair/debug in person. Default to in-office working hours aligned to your hub’s local time.\n- **Mon/Fri**: Flex for deep work and async coordination unless launch weeks require additional onsite collaboration.\n- **Daily rituals**: Morning standup (15 min) for progress/blockers; 4-6 hours of focus time; team lunch on Wednesdays (Ultralytics-paid for in-office employees); **1:1 with manager** (Friday, 30 min) to review the week and plan next steps.\n\n### Week 1 Checklist\n\n- [x] Complete all compliance training in Vanta\n- [x] Read handbook: Introduction, Mission & Values, Hardware/Software policies, Development workflow\n- [x] Set up development environment and run tests successfully\n- [x] Meet your immediate team (5-10 people)\n- [x] Join key Slack channels: #general, #it-support, #your-team\n- [x] Submit first PR (even if just fixing a typo in docs)\n- [x] Schedule coffee chats with 3-5 people from other teams\n- [x] Complete your Ultralytics Portal onboarding tasks (e.g., bio/social verification, AI agent enablement if applicable) and bookmark the dashboard\n\n## First Month 🎯\n\n### Key Objectives\n\n- **Contribute meaningfully**: Ship features or fixes that provide real value\n- **Build relationships**: Know most people on your direct team and key collaborators\n- **Understand workflows**: Git, CI/CD, PR reviews, deployment process\n- **Take ownership**: Own a small project or feature area\n- **Provide feedback**: Share onboarding improvement ideas\n\n### Month 1 Milestones\n\n**Week 2**:\n\n- Ship your first significant PR (feature, optimization, or meaningful fix)\n- Present in engineering standup or demo session\n- Attend company all-hands meeting\n- Complete coffee chats with 5+ team members across different functions\n\n**Week 3**:\n\n- Take on project ownership with defined scope and timeline\n- Participate in code reviews for teammates\n- Attend product planning or sprint planning session\n- Read [Product Development](../workflows/product-development.md) guide\n\n**Week 4**:\n\n- Ship project or major milestone\n- Present work in team demo or all-hands\n- Provide onboarding feedback to manager\n- Set 90-day goals with manager\n\n### Learning Resources\n\n**Technical**:\n\n- [YOLO Documentation](https://docs.ultralytics.com/) - Complete technical guide\n- [Development Workflow](../workflows/development.md) - PR process and standards\n- [CI/Testing](../workflows/ci-testing.md) - Quality and testing practices\n- Internal tech talks (recordings in shared drive)\n\n**Company & Culture**:\n\n- [Company Goals](../goals/company-goals.md) - Strategic priorities\n- [OKRs Guide](../goals/okrs.md) - Goal-setting framework\n- Previous all-hands presentations\n- [Blog](https://www.ultralytics.com/blog) - Company updates and tutorials\n\n## First 90 Days 🚀\n\n### Key Objectives\n\n<div class=\"grid cards\" markdown>\n\n- :material-account-star: **Own Your Domain**\n\n    ***\n\n    Be the go-to person for your area of expertise\n\n- :material-rocket-launch: **Drive Independently**\n\n    ***\n\n    Lead features from design to deployment\n\n- :material-school: **Mentor Others**\n\n    ***\n\n    Help onboard the next new team member\n\n- :material-lightbulb-on: **Shape Direction**\n\n    ***\n\n    Contribute ideas to roadmap and planning\n\n- :material-party-popper: **Celebrate Wins**\n\n    ***\n\n    Ship meaningful improvements users notice\n\n</div>\n\n### 90-Day Goals Framework\n\nWork with your manager to define specific, measurable goals:\n\n=== \"Technical Impact\"\n\n    - [x] Ship X features or Y bug fixes\n    - [x] Improve performance metric by Z%\n    - [x] Complete certification or learning objective\n    - [x] Contribute to open-source beyond assigned work\n\n=== \"Collaboration\"\n\n    - [x] Present at team meeting or external event\n    - [x] Mentor junior team member or new hire\n    - [x] Lead cross-functional project\n    - [x] Contribute to documentation or tooling improvements\n\n=== \"Personal Growth\"\n\n    - [x] Identify development areas and create learning plan\n    - [x] Seek feedback from peers and manager\n    - [x] Participate in hiring (interview candidates)\n    - [x] Propose process or workflow improvements\n\n### End of 90 Days\n\n- **Quarterly performance review** in [Rippling](https://www.rippling.com/) with manager (60 min)\n    - Review accomplishments against 90-day goals\n    - Discuss what's working well and areas for growth\n    - Set next quarter goals and development plan\n    - Review [career progression framework](careers/index.md) and level expectations\n    - Address any concerns or questions\n- **Celebrate**: You're now a full-fledged Ultralytics team member! 🎉\n\n## Role-Specific Onboarding\n\n### Engineering Roles\n\n- **Week 1-2**: Ship first PR, understand CI/CD pipeline, complete test suite\n- **Week 3-4**: Own small feature, participate in design reviews\n- **Month 2**: Lead feature development, mentor on code reviews\n- **Month 3**: Drive architecture decisions, contribute to technical roadmap\n\n### Product/Design Roles\n\n- **Week 1-2**: Shadow customer calls, review product analytics, understand user personas\n- **Week 3-4**: Contribute to roadmap planning, create first design/spec\n- **Month 2**: Own feature from concept to launch\n- **Month 3**: Lead product initiative, influence quarterly planning\n\n### Operations/Business Roles\n\n- **Week 1-2**: Shadow processes, understand workflows, meet key stakeholders\n- **Week 3-4**: Take ownership of specific processes or accounts\n- **Month 2**: Drive process improvements, automate workflows\n- **Month 3**: Lead cross-functional initiative, influence strategy\n\n## Onboarding Resources\n\n### Tools & Access\n\n- **Rippling**: HR, PTO, equipment, compliance training\n- **[Google Workspace](https://workspace.google.com/)**: Email, calendar, drive, docs\n- **[Slack](https://ultralytics-work.slack.com/)**: Team communication and collaboration\n- **[GitHub](https://github.com/ultralytics/)**: Code repositories and issues\n- **[Notion](https://www.notion.so)** or **Linear**: Project management and documentation\n- **[Vanta](https://app.vanta.com/)**: Security and compliance training\n\n### Key Slack Channels\n\n- **#general**: Company-wide announcements and updates\n- **#it-support**: Technical issues and hardware requests\n- **#compliance**: Security and legal questions\n- **#hr**: Benefits, payroll, and people questions\n- **#finance**: Expenses, reimbursements, and budgets\n- **#community** / **#yolo**: Product and community chatter\n- **#engineering** or **#your-team**: Your team's channel\n- **#random**: Casual conversation and team building\n\n### Who to Contact\n\n- **Manager**: Day-to-day questions, project guidance, career development\n- **HR Team**: Benefits, PTO, policies, personal matters (`#hr` on Slack)\n- **IT Support**: `#it-support` on Slack\n- **Legal**: [legal@ultralytics.com](mailto:legal@ultralytics.com) for contracts and compliance\n- **Security**: [security@ultralytics.com](mailto:security@ultralytics.com) for incidents\n\n## Tips for Success 💡\n\n!!! tip \"First 30 Days\"\n\n    === \"Ask Questions\"\n\n        No question is too small - everyone was new once. Use Slack, schedule 1:1s, and ask during meetings.\n\n    === \"Take Notes\"\n\n        Document processes, shortcuts, and learnings. Create a personal wiki or notebook.\n\n    === \"Be Proactive\"\n\n        Don't wait to be told what to do - suggest ideas and volunteer for tasks.\n\n    === \"Ship Early, Ship Often\"\n\n        Bias toward action and rapid iteration. Perfect is the enemy of done.\n\n    === \"Build Relationships\"\n\n        Coffee chats are high-value. Schedule 3-5 per week in your first month.\n\n    === \"Seek Feedback\"\n\n        Ask manager and peers how you're doing weekly. Make adjustments quickly.\n\n!!! success \"Long-Term Success\"\n\n    | Principle | Practice |\n    |-----------|----------|\n    | **Own Outcomes** | Focus on impact, not just activity |\n    | **Communicate Clearly** | Over-communicate early, especially async |\n    | **Embrace Feedback** | View critiques as growth opportunities |\n    | **Stay Curious** | Always be learning and experimenting |\n    | **Help Others** | Best way to learn is teaching |\n    | **Have Fun** | We're building the future of AI - enjoy the journey! |\n\n## Feedback & Questions\n\nHave onboarding feedback or questions?\n\n- **Slack DM your manager**: For immediate questions or concerns\n- **Submit PR to handbook**: Help us improve onboarding for future team members\n- **Email HR**: For sensitive or personal matters\n\nWe're constantly improving onboarding based on new team member feedback. Your input makes the next person's experience better!\n"}, {"type": "file", "name": "pto-policy.md", "path": "people/pto-policy.md", "content": "---\ndescription: Ultralytics Paid Time Off (PTO) Policy covering 25 days annual leave, sick leave, public holidays, and leave request procedures for all employees.\nkeywords: Ultralytics PTO, paid time off, 25 days vacation, vacation policy, sick leave, Rippling, time off requests\n---\n\n# Paid Time Off (PTO) Policy\n\n## Overview 📋\n\n!!! success \"PTO Benefits\"\n\n    **25 days PTO annually** (24 days + 1 birthday) + public holidays + unlimited sick leave\n\n    Full allocation available from **day one**; vacation usage begins after **30 days of employment**.\n\n**All time off requests are submitted and approved through [Rippling](https://www.rippling.com/).**\n\n**Policy Effective Dates:**\n\n- PTO Salaried policy: Active from 01/01/2024\n- Paid Sick Leave: Active from 07/01/2025\n\n## PTO Entitlement 📅\n\n### Annual Allocation\n\n<div class=\"grid cards\" markdown>\n\n- :material-calendar-blank: **24 Flexible Days**\n\n    ***\n\n    Use for vacation, personal time, or any reason\n\n- :material-cake-variant: **1 Birthday Day**\n\n    ***\n\n    Your birthday off as a paid day\n\n- :material-calendar-star: **Public Holidays**\n\n    ***\n\n    All official holidays in your country\n\n- :material-medical-bag: **Sick Leave**\n\n    ***\n\n    Unlimited sick days as needed\n\n</div>\n\n**Full allocation granted on day one**; vacation days can be taken after **30 days of employment**.\n\n### Balance Limits\n\n```mermaid\ngraph LR\n    A[25 Days Annual]:::start --> B{Year End}:::decide\n    B -->|Use It| C[Refresh to 25]:::out\n    B -->|Save It| D[Rollover Up to 10 Days]:::proc\n    D --> E[Max Balance: 35 Days]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n| Limit Type                  | Amount                                |\n| --------------------------- | ------------------------------------- |\n| **Maximum balance**         | 35 days total                         |\n| **Annual carryover**        | Up to 10 days                         |\n| **Rollover usage window**   | 12 months (no mid-year expiry)        |\n| **Longest single vacation** | 35 days (subject to balance/approval) |\n| **Negative balance**        | Up to 5 days (manager approval)       |\n| **Vacation waiting period** | 30 days after start date              |\n| **Excess days**             | Forfeited (use it or lose it)         |\n\n**Rollover usage:** Carried-over days can be used at any time during the following calendar year (12 months).\n\n### Tenure Milestones 🎉\n\nEmployees earn additional PTO days based on length of service:\n\n| Years of Service | Additional Days | Total Annual PTO |\n| ---------------- | --------------- | ---------------- |\n| 0-2 years        | +0              | 25 days          |\n| 2-4 years        | +1              | 26 days          |\n| 4-6 years        | +2              | 27 days          |\n| 6-8 years        | +3              | 28 days          |\n| 8-10 years       | +4              | 29 days          |\n| 10+ years        | +5              | 30 days          |\n\n!!! tip \"Automatic Increase\"\n\n    Additional days are automatically added to your annual allocation and accrue monthly along with your base PTO.\n\n### Prorated Allocations\n\n!!! info \"Mid-Year Hires\"\n\n    Mid-year hires receive prorated PTO for the 24 flexible days based on start date.\n\n    **Birthday day is always included** regardless of start date!\n\n## Types of Leave 🏖️\n\n=== \"Vacation Leave\"\n\n    **For planned time off**\n\n    - :material-calendar-clock: Submit requests **1 week in advance for shorter leave** (1-4 days), and **at least 1 month in advance for longer leave** (5+ days)\n    - :material-account-group: Coordinate with your team for coverage\n    - :material-calendar-check: Update calendar and Slack status\n    - :material-timer: Vacation available after **30 days of employment**\n    - :material-airplane: Maximum single vacation: **35 days**\n    - :material-handshake: Up to **5 days negative balance** allowed with manager approval\n\n=== \"Sick Leave\"\n\n    **When you're feeling unwell**\n\n    - :material-bell-alert: Notify your manager **ASAP**\n    - :material-clipboard-check: Update Rippling when able\n    - :material-file-document-remove: **No medical documentation** required for short absences\n\n    !!! success \"Unlimited Policy\"\n\n        Take the time you need to recover - no tracking or limits\n\n=== \"Public Holidays\"\n\n    **Official holidays in your country**\n\n    - :material-calendar-star: All official government holidays\n    - :material-calendar-today: Holiday calendar published annually\n    - :material-home: Automatically included in PTO system\n\n=== \"Birthday Leave\"\n\n    **Celebrate your special day!**\n\n    - :material-cake: Schedule on or near your birthday\n    - :material-check-circle: Manager approval required through Rippling\n    - :material-account-voice: Inform your team after approval\n\n### Official Holiday Calendars\n\n!!! info \"Country-Specific Holiday Calendars\"\n\n    === \"🇬🇧 United Kingdom\"\n\n        [GOV.UK Bank Holidays](https://www.gov.uk/bank-holidays) - Official government bank holidays\n\n    === \"🇪🇸 Spain\"\n\n        [BOE Calendar](https://www.boe.es/diario_boe/calendarios.php) - Official State Gazette (Boletín Official del Estado)\n\n        **Madrid:** [City Holidays](https://app.powerbi.com/view?r=eyJrIjoiMWE4ZGU0ZmMtNTI1NC00NWRjLTk3NWYtNTAyMzAwZTI3NDdmIiwidCI6ImI0NTMyYWE2LTE4OTUtNDk2NC1iOWMwLTIyYjE0NDQ0MjcxYiIsImMiOjl9) - Official Madrid city holidays\n\n    === \"🇨🇳 China\"\n\n        [State Council Public Holidays](https://english.www.gov.cn/policies/featured/202511/04/content_WS6909c915c6d00ca5f9a074f7.html) - Official government announcement\n\n    === \"🇺🇸 United States\"\n\n        [OPM Federal Holidays](https://www.opm.gov/policy-data-oversight/pay-leave/federal-holidays/) - Office of Personnel Management\n\n## Requesting Time Off 📝\n\n```mermaid\nflowchart TD\n    A[Submit in Rippling]:::start --> B[Manager Reviews]:::proc\n    B --> C{Approved?}:::decide\n    C -->|Yes| D[Notify Team]:::proc\n    D --> E[Update Calendar]:::proc\n    E --> F[Update Slack Status]:::proc\n    F --> G[Set Email Auto-Responder]:::out\n    C -->|No| H[Discuss with Manager]:::proc\n    H --> A\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n### Request Process\n\n1. **Submit in Rippling** - All requests go through [Rippling](https://www.rippling.com/)\n2. **Manager approval** - Your direct manager approves in Rippling\n3. **Update team** - Notify colleagues and update calendar/Slack\n\n### Minimum Notice Requirements\n\n| Leave Type                        | Notice Required  | Example                                             |\n| --------------------------------- | ---------------- | --------------------------------------------------- |\n| **1-4 planned flexible PTO days** | 1 week           | Submit by Monday for a request the following Monday |\n| **5+ planned flexible PTO days**  | At least 1 month | Submit by early July for an August 1-14 trip        |\n| **Sick leave**                    | ASAP             | Same-day notification                               |\n| **Birthday leave**                | 1 week           | Submit in Rippling 1 week before                    |\n\nCount the total workdays in the planned flexible PTO request. Birthday leave is evaluated separately.\n\n!!! warning \"Approval at manager's discretion\"\n\n    Requests must meet the minimum notice requirements. Managers review each request at their discretion, balancing employee needs with business continuity.\n\n!!! info \"Take planned leave only once approved\"\n\n    Employees request time off in our HRIS (Rippling). Managers will respond within 3-5 business days. If a response is time sensitive, follow up with your manager or the HR team in `#hr`. Planned flexible PTO and birthday leave can only be taken once approved in Rippling.\n\n## Coordination and Coverage 🤝\n\n**Before taking PTO:**\n\n<div class=\"grid cards\" markdown>\n\n- :material-account-group: **Notify Your Team**\n\n    ***\n\n    Give advance notice and discuss coverage\n\n- :material-file-document: **Document Work**\n\n    ***\n\n    Record ongoing tasks and handoffs\n\n- :material-calendar-sync: **Update Systems**\n\n    ***\n\n    Calendar, Slack status, email auto-responder\n\n- :material-account-switch: **Identify Backup**\n\n    ***\n\n    Designate backup contacts for urgent issues\n\n</div>\n\n!!! tip \"Pro Tips for Smooth PTO\"\n\n    - Set up email auto-responder with backup contact\n    - Document all in-progress work before leaving\n    - Have a handoff meeting with your backup\n    - Turn on Slack \"away\" status with return date\n    - Set calendar as \"Out of Office\"\n\n## Unused PTO 📊\n\n!!! warning \"Use It or Lose It (Partially)\"\n\n    === \"Rollover Policy\"\n\n        - **Up to 10 days** roll over to next calendar year\n        - Rollover days can be used **anytime during the following year** (no mid-year expiry)\n        - Days beyond 10 are **forfeited** (use it or lose it)\n        - Maximum balance cannot exceed **35 days**\n\n    === \"No Payout\"\n\n        - PTO does **not pay out** upon termination\n        - Unused PTO is **forfeited** at year-end beyond rollover limits\n        - Plan to use your time throughout the year!\n\n### Exceptions to Rollover Limits\n\nExceptions may be considered for:\n\n!!! info \"Special Circumstances\"\n\n    - Extended illness preventing PTO use\n    - Business-critical projects requiring deferral\n    - Other exceptional situations\n\n    **Manager pre-approval required** - discuss with your manager if you anticipate needing an exception.\n\n## International Considerations 🌍\n\n!!! info \"Local Labor Laws\"\n\n    Some countries require additional leave benefits beyond this policy.\n\n    **When local law provides greater benefits, those requirements apply.**\n\n    Contact HR if you have questions about your specific location.\n\n## PTO Examples 💡\n\n??? example \"Standard Vacation Request\"\n\n    **Scenario:** 2-week vacation in August\n\n    ```\n    1. June 15: Submit request in Rippling for Aug 1-14\n    2. June 16: Manager approves in Rippling\n    3. June 20: Notify team in standup\n    4. July 25: Document handoffs and set up coverage\n    5. July 31: Enable auto-responder, update Slack/calendar\n    6. Aug 1-14: Enjoy vacation! 🏖️\n    ```\n\n??? example \"Sick Day\"\n\n    **Scenario:** Wake up feeling ill\n\n    ```\n    1. 8:00 AM: Slack/email manager: \"Feeling unwell, taking sick day\"\n    2. When able: Submit sick day in Rippling\n    3. Next day: Return to work or extend sick leave\n    ```\n\n??? example \"Birthday Leave\"\n\n    **Scenario:** Birthday on Thursday, July 10\n\n    ```\n    1. July 3: Submit in Rippling for July 10\n    2. After approval: Notify the team\n    3. July 9: Set auto-responder, update status\n    4. July 10: Enjoy your day! 🎂\n    ```\n\n??? example \"Year-End Rollover\"\n\n    **Scenario:** 30 unused days at year-end\n\n    ```\n    Starting balance: 30 days\n    Rollover limit: 10 days\n    Forfeited: 20 days\n\n    Jan 1 balance: 10 (rollover) + 25 (new allocation) = 35 days\n    ```\n\n    !!! warning \"Use Your Time\"\n\n        This employee lost 20 days! Plan vacations throughout the year.\n\n## Questions?\n\n!!! question \"Need Help with PTO?\"\n\n    | Question Type | Contact |\n    |--------------|---------|\n    | **Policy questions** | Your manager or HR team (`#hr` on Slack) |\n    | **Rippling issues** | Post in `#it-support` on Slack |\n    | **Special requests** | Your direct manager |\n    | **Country-specific rules** | HR team in `#hr` |\n"}]}, {"type": "dir", "name": "security", "path": "security", "children": [{"type": "file", "name": "employee-security-compliance-requirements.md", "path": "security/employee-security-compliance-requirements.md", "content": "---\ntitle: Employee Security & Compliance\ndescription: Ultralytics employee security and compliance requirements covering background checks, mandatory training, performance reviews, and offboarding procedures.\nkeywords: Ultralytics security compliance, employee security requirements, mandatory training, GDPR, CCPA, security awareness, Vanta, offboarding\n---\n\n# What to Expect: Security & Compliance Requirements for Employees\n\nWelcome to Ultralytics! This guide explains what you can expect regarding security and compliance requirements during your journey with us.\n\n## Overview\n\n```mermaid\ntimeline\n    title Your Security & Compliance Journey\n    section Pre-Start\n        Background Checks : Security verification\n        Sign Agreements : NDA and employment contracts\n    section Day 1\n        Complete Training : CCPA, GDPR, Security Awareness\n        Policy Acknowledgment : Formal security responsibilities via Vanta\n    section Ongoing\n        Annual Training : Refresher courses\n        Performance Reviews : Policy adherence assessment\n    section Offboarding\n        Access Revoked : System access removed\n        Equipment Return : Company property returned\n        Termination Agreement : Ongoing obligations clarified\n```\n\n!!! tip \"Badge Discipline\"\n\n    Badges are both a security control and a way to credit your **Anchor Days (Tue/Wed/Thu)** attendance. If you're within commutable distance, badge in on each Anchor Day so we can keep spaces safe and recognize your presence.\n\n## Before You Start\n\n<div class=\"grid cards\" markdown>\n\n- :material-account-search: **Background Checks**\n\n    ***\n\n    Standard background verification for all new team members as required by local law. This protects everyone on our team.\n\n- :material-file-sign: **Security Agreements**\n\n    ***\n    - **NDA**: Protects confidential information\n    - **Employment Contract**: References Code of Business Conduct\n    - **Policy Acknowledgment**: Via Vanta compliance system\n\n</div>\n\n### Key Documents\n\n!!! info \"What You'll Sign\"\n\n    === \"Non-Disclosure Agreement (NDA)\"\n\n        Protects our confidential information, intellectual property, and sensitive business data.\n\n    === \"Employment/Contractor Agreement\"\n\n        References our [Code of Business Conduct](../legal/code-of-business-conduct-and-ethics.md), outlining values, compliance expectations, and security practices.\n\n    === \"Policy Acknowledgment\"\n\n        Formal acknowledgment of security responsibilities through [Vanta](https://app.vanta.com/), our compliance management system.\n\n## Required Training\n\n!!! warning \"Mandatory Training - Complete During Onboarding\"\n\n    All new team members complete these training modules to gain practical knowledge for their role:\n\n=== \"General (All Employees)\"\n\n    | Training Module | Duration | Platform |\n    |----------------|----------|----------|\n    | **CCPA Training** | 30 min | Vanta |\n    | **GDPR Training** | 30 min | Vanta |\n    | **General Security Awareness** | 45 min | Vanta |\n\n    *California privacy law basics and European data protection requirements*\n\n=== \"Engineering Teams\"\n\n    | Training Module | Duration | Platform |\n    |----------------|----------|----------|\n    | **Secure Code Training** | 60 min | Vanta |\n\n    *YOLO and Platform teams only: Identifying and preventing security vulnerabilities using OWASP standards*\n\n!!! tip \"Training Access\"\n\n    Login to [Vanta](https://app.vanta.com/c/ultralytics/employee/onboarding) with your Ultralytics email to access all training modules.\n\n## Ongoing Expectations\n\n### Annual Training\n\n<div class=\"grid cards\" markdown>\n\n- :material-calendar-refresh: **Annual Refreshers**\n\n    ***\n\n    Complete annual refresher training to stay current on security practices and regulatory requirements.\n\n- :material-bell-ring: **Reminders**\n\n    ***\n\n    Automatic reminders sent when training is due via email and Slack.\n\n- :material-chart-line: **Compliance Tracking**\n\n    ***\n\n    Security & Compliance Team monitors completion to ensure every team remains compliant.\n\n</div>\n\n### Performance Reviews\n\n!!! info \"What's Assessed\"\n\n    Your regular performance reviews include:\n\n    - [x] Job performance and role competence\n    - [x] Adherence to company policies and code of conduct\n    - [x] Achievement of specific role objectives\n    - [x] Security awareness and compliance\n\n### Staying Informed\n\n```mermaid\ngraph LR\n    A[Security Updates]:::start --> B[Email Notifications]:::out\n    A --> C[Slack Announcements]:::out\n    A --> D[Team Meetings]:::out\n    A --> E[Training Updates]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\nSecurity regulations and threats evolve constantly. We'll keep you updated through multiple channels so you're always aware of new requirements and emerging risks.\n\n!!! success \"Stay Alert\"\n\n    Follow our `#security` and `#compliance` Slack channels for real-time updates.\n\n## When Employment Ends\n\n### Offboarding Process\n\n!!! warning \"Timeline & Responsibilities\"\n\n    === \"Access Revocation\"\n\n        - All system access revoked on agreed termination date\n        - Immediate removal from all platforms and tools\n        - No exceptions for personal data access\n\n    === \"Equipment Return\"\n\n        - Return all company equipment promptly after last day\n        - Includes: laptops, monitors, phones, security keys\n        - Ultralytics coordinates pickup or shipping logistics\n        - Clean personal data before return\n\n    === \"Termination Agreement\"\n\n        - Sign agreement clarifying ongoing obligations\n        - Confidentiality requirements continue post-employment\n        - Non-compete and non-solicitation terms (if applicable)\n        - Clear understanding of expectations after departure\n\n### Offboarding Checklist\n\n| Task                       | When          | Owner |\n| -------------------------- | ------------- | ----- |\n| Sign termination agreement | Last day      | You   |\n| Return equipment           | Within 3 days | You   |\n| System access revoked      | Last day      | IT    |\n| Final expense submission   | Within 7 days | You   |\n| Exit interview             | Last week     | HR    |\n\n## Contact & Support\n\n!!! question \"Need Help?\"\n\n    <div class=\"grid cards\" markdown>\n\n    -   :material-security: **Security Issues**\n\n        ---\n\n        [security@ultralytics.com](mailto:security@ultralytics.com)\n\n    -   :material-lifebuoy: **IT Support**\n\n        ---\n\n        `#it-support` on Slack\n\n    -   :material-scale-balance: **Legal/Compliance**\n\n        ---\n\n        [legal@ultralytics.com](mailto:legal@ultralytics.com)\n        `#compliance` on Slack\n\n    -   :material-account-group: **HR Questions**\n\n        ---\n\n        Contact your manager or HR team in `#hr`\n\n    </div>\n\n## Related Resources\n\n- [Security & Compliance Team](team.md) - Overview of our security team\n- [Information Security Management System (ISMS)](isms.md) - Our security framework\n- [Code of Business Conduct and Ethics](../legal/code-of-business-conduct-and-ethics.md) - Company standards\n- [Social Media Policy](../contributions/social-media-policy.md) - Professional conduct guidelines\n"}, {"type": "file", "name": "isms.md", "path": "security/isms.md", "content": "---\ntitle: Information Security (ISMS)\ndescription: Ultralytics Information Security Management System (ISMS) covering ISO 27001 alignment, SOC 2 compliance, security controls, and governance structure.\nkeywords: Ultralytics ISMS, information security, ISO 27001, SOC 2, data protection, security controls, compliance, Vanta\n---\n\n# Information Security Management System (ISMS) 🔐\n\n## Building Trust Through Security Excellence\n\n!!! success \"Our Commitment\"\n\n    Ultralytics maintains a comprehensive ISMS to protect our customers, partners, and stakeholders. Our security program reflects our commitment to safeguarding data and upholding the highest standards of information security in AI and computer vision technology.\n\n## Our Security Standards\n\n<div class=\"grid cards\" markdown>\n\n- :material-certificate: **ISO/IEC 27001:2022**\n\n    ***\n\n    Our ISMS follows the internationally recognized ISO/IEC 27001:2022 framework, ensuring systematic and comprehensive security management across all business operations.\n\n- :material-shield-check: **SOC 2 Compliance**\n\n    ***\n\n    Working toward SOC 2 Type I (Q1 2026) and Type II (Q1 2027) compliance, providing independent verification of our security controls for service organizations.\n\n- :material-refresh: **Continuous Improvement**\n\n    ***\n\n    Our security program is based on the **Plan-Do-Check-Act (PDCA)** cycle, driving continuous adaptation to emerging threats and evolving business needs.\n\n</div>\n\n## Core Security Objectives\n\n| Objective                               | Description                                                                                                   |\n| --------------------------------------- | ------------------------------------------------------------------------------------------------------------- |\n| :material-eye-off: **Confidentiality**  | Prevent unauthorized access or disclosure through strict controls on customer and personal information        |\n| :material-check-decagram: **Integrity** | Ensure completeness, accuracy, and reliability of data and systems through robust validation and protection   |\n| :material-clock-check: **Availability** | Maintain system readiness and uptime backed by defined recovery objectives and business continuity procedures |\n\n## Security Program Coverage\n\n```mermaid\ngraph TD\n    ISMS[ISMS]:::start --> A[Platform SaaS Services]:::proc\n    ISMS --> B[YOLO AI Model Development]:::proc\n    ISMS --> C[Corporate Infrastructure]:::proc\n\n    A --> A1[Customer data protection]:::out\n    A --> A2[Service reliability]:::out\n    B --> B1[Secure development lifecycle]:::out\n    B --> B2[Model integrity controls]:::out\n    C --> C1[Systems & process safeguards]:::out\n    C --> C2[Employee data protection]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n## Governance Structure\n\n<div class=\"grid cards\" markdown>\n\n- :material-gavel: **ISMS Governance Council**\n\n    ***\n\n    Leaders from Legal, Security, and Engineering oversee ISMS performance and approve key security decisions.\n\n- :material-shield-account: **Security & Compliance Team**\n\n    ***\n\n    A dedicated team operationalizes the ISMS, manages controls, monitors threats, and coordinates audits.\n\n- :material-account-group: **Organization-Wide Responsibility**\n\n    ***\n\n    Every team member has defined security responsibilities, ensuring accountability across all business functions.\n\n</div>\n\n## Security Control Framework\n\n| Domain                       | Controls                                                          |\n| ---------------------------- | ----------------------------------------------------------------- |\n| **Access Management**        | Role-based access with least-privilege principles                 |\n| **Data Protection**          | Classification, handling, and protection of sensitive information |\n| **Asset Management**         | Lifecycle management of physical and virtual assets               |\n| **Third-Party Risk**         | Vendor security assessments and ongoing monitoring                |\n| **Incident Response**        | Rapid detection, containment, and resolution procedures           |\n| **Business Continuity**      | Disaster recovery and operational resilience planning             |\n| **Secure Development**       | Security integrated throughout the software development lifecycle |\n| **Vulnerability Management** | Continuous identification and remediation of security weaknesses  |\n\n## Compliance & Audit Program\n\n!!! info \"Audit Schedule\"\n\n    | Activity | Target |\n    | -------- | ------ |\n    | Regular risk assessments & internal reviews | Ongoing |\n    | SOC 2 Type I & ISO 27001 audit (independent) | Q1 2026 |\n    | SOC 2 Type II & ISO 27001 surveillance audit | Q1 2027 |\n\nOur GRC platform (**[Vanta](https://app.vanta.com/)**) provides real-time compliance monitoring and evidence collection across all security controls.\n\n## Transparency & Trust\n\n!!! success \"Public Commitment\"\n\n    - **[Trust Center](https://trust.ultralytics.com/)**: Key security policies and procedures publicly available\n    - **Compliance Attestations**: Certifications and audit reports published post-Q1 2026 audits\n    - **Customer Security Reviews**: Detailed security information provided for customer due diligence\n\n## Contact & Resources\n\n!!! question \"Security Inquiries\"\n\n    | Channel | Details |\n    | ------- | ------- |\n    | **Email** | [security@ultralytics.com](mailto:security@ultralytics.com) |\n    | **Trust Center** | [trust.ultralytics.com](https://trust.ultralytics.com/) |\n    | **Open-Source Security Policy** | [docs.ultralytics.com/help/security/](https://docs.ultralytics.com/help/security) |\n"}, {"type": "file", "name": "team.md", "path": "security/team.md", "content": "---\ndescription: Ultralytics Security & Compliance Team overview covering responsibilities, contact information, mandatory training, and annual compliance calendar.\nkeywords: Ultralytics security team, compliance, ISO 27001, SOC 2, GDPR, security training, Vanta, Rippling MDM, EU AI act, HIPAA\n---\n\n# Ultralytics Security & Compliance Team\n\n## Our Mission\n\n!!! success \"Mission\"\n\n    We are your partners in maintaining the highest standards of security and compliance. We protect Ultralytics' technology, data, and reputation by implementing robust security frameworks and ensuring adherence to ISO 27001, SOC 2, and other regulatory standards — enabling secure innovation while maintaining customer trust across all business operations.\n\n## Security & Compliance Responsibilities\n\n<div class=\"grid cards\" markdown>\n\n- :material-shield-lock: **Information Security Management**\n\n    ***\n    - ISMS implementation and maintenance (ISO 27001 aligned)\n    - Security risk assessments and management\n    - Incident response and breach management\n    - Security awareness training and education\n    - Vulnerability management and remediation\n\n- :material-clipboard-check: **Compliance & Audit Management**\n\n    ***\n    - SOC 2 Type I and Type II compliance\n    - Penetration testing\n    - Regulatory compliance assessments (GDPR, EU AI act, HIPAA)\n    - Third-party audit coordination\n    - Compliance monitoring and reporting\n    - Gap analysis and remediation planning\n\n- :material-architecture: **Security Architecture & Controls**\n\n    ***\n    - Security control design and implementation\n    - Access management and identity governance\n    - Endpoint protection and device management\n\n- :material-account-multiple-check: **Vendor & Third-Party Risk**\n\n    ***\n    - Security vendor assessments\n    - Due diligence and risk evaluations\n    - Contract security requirements\n    - Ongoing vendor monitoring\n\n- :material-restore: **Business Continuity & Recovery**\n\n    ***\n    - Business continuity planning\n    - Disaster recovery procedures\n    - Recovery testing and validation\n    - Backup and restoration strategies\n\n</div>\n\n## Contact Information\n\n!!! question \"Need Help?\"\n\n    | Contact Type | Details |\n    | ------------ | ------- |\n    | **Security Compliance Engineers** | Kristian Sommer, Zuzana Kontrikova |\n    | **Email** | [security@ultralytics.com](mailto:security@ultralytics.com) |\n    | **Slack** | `#compliance` (internal team members only) |\n\n### Slack Guidelines\n\nUse the `#compliance` channel for:\n\n- **Security incidents or emergencies:** Tag `@compliance-team` for urgent issues — response within 1 hour\n- **Compliance questions and policy clarifications:** Get guidance on compliance and security-related topics\n- **Customer security questionnaires and reviews:** Submit for team review and completion\n\n## External Security Documentation\n\n!!! info \"Trust Center\"\n\n    **[trust.ultralytics.com](https://trust.ultralytics.com/)** is our centralized repository for all security policies, compliance certifications, and audit documentation.\n\n### Core Security Policies\n\n- Information Security Policy\n- Information Security & Privacy Risk Assessment and Treatment Policy\n- Secure Development Policy\n- Third-Party Management Policy\n- Business Continuity and Disaster Recovery Policy\n\n### Compliance Attestations\n\n| Document                   | Status                    |\n| -------------------------- | ------------------------- |\n| SOC 2 Report               | Attested June 2026        |\n| ISO 27001 Certificate      | Certified June 2026       |\n| Statement of Applicability | Available in Trust Center |\n| Platform Penetration Test  | Completed April 2026      |\n\n## Employee Resources\n\n### Mandatory Annual Training Programs\n\n| Training Module                               | Audience                   | Platform |\n| --------------------------------------------- | -------------------------- | -------- |\n| **CCPA** (California Consumer Privacy Act)    | All employees              | Vanta    |\n| **GDPR** (General Data Protection Regulation) | All employees              | Vanta    |\n| **General Security Awareness Training**       | All employees              | Vanta    |\n| **Secure Code Training**                      | YOLO & Platform teams only | Vanta    |\n\n### Employee Policies & Guidelines\n\n- [Hardware Policy](https://handbook.ultralytics.com/tools/hardware)\n- [Software Policy](https://handbook.ultralytics.com/tools/software)\n- [Code of Business Conduct](https://handbook.ultralytics.com/legal/code-of-business-conduct-and-ethics)\n\n### Security & Training Tools\n\n- **[Vanta](https://app.vanta.com/c/ultralytics/employee/onboarding)**: Delivers mandatory training programs and employee-applicable policies\n- **Rippling MDM**: Manages and secures all company devices\n\n## Compliance Calendar & Audits\n\n| Activity                                         | Target    |\n| -----------------------------------------------
