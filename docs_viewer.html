y Reviews**    | Every 13 weeks | Assess progress, grade OKRs, adjust strategy                   |\n| **Annual Retrospective** | Yearly         | Evaluate the year, celebrate wins, plan next year              |\n\n## Measurement & Tracking\n\n!!! info \"Transparent Metrics Drive Accountability\"\n\n    | Mechanism | Audience | Cadence |\n    | --------- | -------- | ------- |\n    | **Real-Time Dashboards** | All teams | Live |\n    | **Weekly Metrics Reviews** | Team leads | Weekly |\n    | **Monthly Business Reviews** | Leadership | Monthly |\n    | **Quarterly Board Updates** | Investors & advisors | Quarterly |\n    | **Public Metrics** | Community | Ongoing |\n"}, {"type": "file", "name": "okrs.md", "path": "goals/okrs.md", "content": "---\ndescription: Ultralytics OKR framework for transparent goal-setting, performance tracking, and strategic alignment across the organization.\nkeywords: Ultralytics OKRs, objectives and key results, goal setting, performance metrics, strategic planning, team alignment\n---\n\n# Objectives and Key Results (OKRs) 🎯\n\n## What Are OKRs?\n\n!!! info \"Goal-Setting Framework\"\n\n    OKRs (Objectives and Key Results) are our framework for aligning teams and measuring progress. Used by Google, Intel, and leading startups, OKRs keep everyone focused on what matters most.\n\n    | Component | Description |\n    | --------- | ----------- |\n    | **Objectives** | Qualitative, ambitious goals describing *what* we want to achieve |\n    | **Key Results** | 3–5 quantitative, time-bound metrics measuring progress toward objectives |\n    | **Initiatives** | The specific projects and tasks executed to achieve key results |\n\n## OKR Structure\n\n<div class=\"grid cards\" markdown>\n\n- :material-office-building: **Company OKRs**\n\n    ***\n\n    Set by leadership, defining strategic priorities for the quarter or year. Company OKRs cascade down to teams and individuals.\n\n- :material-account-multiple: **Team OKRs**\n\n    ***\n\n    Each team develops OKRs aligned with company objectives, focusing on their domain's contribution to overall goals.\n\n- :material-account: **Individual OKRs**\n\n    ***\n\n    Team members set personal OKRs in collaboration with their managers, supporting both team and company objectives.\n\n</div>\n\n## OKR Cycle\n\n```mermaid\ngraph LR\n    A[\"Planning\\n(Week 1)\"]:::start --> B[\"Execution\\n(Weeks 2–12)\"]:::proc\n    B --> C[\"Review\\n(Week 13)\"]:::proc\n    C --> D[Retrospective]:::proc\n    D --> A\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n```\n\n| Phase             | Timing       | Actions                                   |\n| ----------------- | ------------ | ----------------------------------------- |\n| **Planning**      | Week 1       | Set OKRs for the upcoming quarter         |\n| **Execution**     | Weeks 2–12   | Track progress with weekly check-ins      |\n| **Review**        | Week 13      | Grade OKRs and analyze outcomes           |\n| **Retrospective** | After review | Learn, adjust, and carry insights forward |\n\n**Annual Strategy**: Company-level goals inform quarterly OKRs → Year-end review evaluates annual progress → Strategic planning for next year.\n\n## OKR Best Practices\n\n### Setting Effective OKRs\n\n!!! tip \"OKR Design Principles\"\n\n    | Principle | Guidance |\n    | --------- | -------- |\n    | **Ambitious but Achievable** | Target 70–80% achievement — hitting 100% means targets weren't bold enough |\n    | **Measurable** | Clear numeric targets (e.g., \"Increase PyPI downloads from 500K to 1M/month\") or binary outcomes |\n    | **Time-bound** | Specific deadlines within the quarter (typically 13 weeks) |\n    | **Aligned** | Cascade from company → team → individual goals |\n    | **Focused** | 3–5 objectives per level maximum, with 3–5 key results each |\n    | **Inspiring** | Everyone should understand *why* the OKR matters |\n    | **Transparent** | All OKRs visible company-wide for cross-functional alignment |\n\n### Grading Scale\n\n| Score       | Status                             | Interpretation                                 |\n| ----------- | ---------------------------------- | ---------------------------------------------- |\n| **0.0–0.3** | :octicons-x-circle-fill-16: Missed | Fell significantly short of target             |\n| **0.4–0.6** | :material-minus-circle: Progress   | Made meaningful progress but fell short        |\n| **0.7–0.9** | :material-check-circle: Success    | Achieved or nearly achieved — this is the goal |\n| **1.0**     | :material-star: Exceeded           | May need more ambitious targets next cycle     |\n\n!!! note \"Grading Philosophy\"\n\n    A score of 0.7 is a success, not a failure. If your team consistently scores 1.0, the OKRs were not ambitious enough.\n\n### Common Pitfalls to Avoid\n\n!!! warning \"OKR Anti-Patterns\"\n\n    | Pitfall | Why It Fails |\n    | ------- | ------------ |\n    | **Too Many OKRs** | More than 5 objectives dilutes focus — prioritize ruthlessly |\n    | **Sandbagging** | Setting easily achievable targets to guarantee success |\n    | **Task Lists** | Confusing OKRs with project plans (\"Launch feature X\" vs. \"Increase user engagement by 50%\") |\n    | **Infrequent Check-ins** | Waiting until quarter-end to review progress |\n    | **Lack of Ownership** | OKRs without clear owners and accountability |\n    | **No Mid-Quarter Adjustments** | Being too rigid when priorities shift |\n    | **OKRs as Performance Reviews** | OKRs measure team progress, not individual performance |\n\n## Transparency & Visibility\n\n!!! success \"OKRs Are Visible Company-Wide\"\n\n    | Level | Where | Cadence |\n    | ----- | ----- | ------- |\n    | **Company OKRs** | All-hands, Slack | Monthly review |\n    | **Team OKRs** | Notion/Linear workspace | Standups |\n    | **Individual OKRs** | 1:1s with manager | Weekly |\n    | **Real-Time Progress** | Live dashboards | Continuous |\n    | **Public Metrics** | GitHub stars, PyPI downloads | Ongoing |\n\n    Transparency drives accountability and enables cross-functional collaboration.\n\n## Tools & Resources\n\nOKRs are managed through:\n\n- Quarterly planning sessions\n- Weekly team standups\n- Progress tracking dashboards\n- Leadership review meetings\n"}]}, {"type": "file", "name": "index.md", "path": "index.md", "content": "---\ndescription: Welcome to the Ultralytics Handbook - your comprehensive guide to our mission, values, workflows, and operational practices.\nkeywords: Ultralytics handbook, employee handbook, company guide, AI handbook, YOLO documentation, team resources\n---\n\n# Welcome to the Ultralytics Handbook 🚀\n\n[![Ultralytics Team](https://cdn.ul.run/i/6021a1da5cf0971632f17e25379b8a9e.avif)](https://www.ultralytics.com/blog/ultralytics-morocco-offsite-team-highlights-2026)\n\nWelcome to the [Ultralytics](https://www.ultralytics.com/) Handbook - your comprehensive guide to our company's mission, vision, values, and operational practices. This handbook provides essential insights and resources for team members, collaborators, and our global community.\n\n!!! info \"Living Document\"\n\n    This handbook evolves with our company, serving as both a practical resource and a philosophical guide to our culture and operations.\n\n## New to Ultralytics? Start Here ✨\n\n=== \"Essential Reading\"\n\n    <div class=\"grid cards\" markdown>\n\n    -   :material-book-open-variant: **[Introduction](introduction.md)**\n\n        ---\n\n        Overview of this handbook and how to use it\n\n    -   :material-rocket-launch: **[Onboarding](people/onboarding.md)**\n\n        ---\n\n        Your first 90 days at Ultralytics\n\n    -   :material-target: **[Mission & Values](mission-vision-values/index.md)**\n\n        ---\n\n        What drives us forward\n\n    -   :material-laptop: **[Hardware Policy](tools/hardware.md)**\n\n        ---\n\n        Equipment setup and refresh cycles\n\n    -   :material-application: **[Software Policy](tools/software.md)**\n\n        ---\n\n        Approved tools and request process\n\n    </div>\n\n=== \"Getting Set Up\"\n\n    <div class=\"grid cards\" markdown>\n\n    -   :material-email: **[Email Signatures](tools/email-signatures.md)**\n\n        ---\n\n        Automated signature setup\n\n    -   :material-source-branch: **[Development Workflow](workflows/development.md)**\n\n        ---\n\n        PR process and code standards\n\n    -   :material-hand-wave: **[How to Contribute](contributions/how-to-contribute.md)**\n\n        ---\n\n        Getting started with the codebase\n\n    </div>\n\n## Quick Reference 🔗\n\n### People & Benefits 💰\n\n<div class=\"grid cards\" markdown>\n\n- :material-account-star: **[Onboarding Guide](people/onboarding.md)**\n\n    ***\n\n    First 90 days roadmap\n\n- :material-beach: **[PTO Policy](people/pto-policy.md)**\n\n    ***\n\n    25 days annual leave + unlimited sick\n\n- :material-cash-multiple: **[Finance Overview](finance/index.md)**\n\n    ***\n\n    Reimbursements and expenses\n\n- :material-airplane: **[Travel Policy](finance/travel.md)**\n\n    ***\n\n    Per diem rates and booking\n\n- :material-home-import-outline: **[Relocation Policy](finance/relocation.md)**\n\n    ***\n\n    $10K for onsite collaboration moves\n\n- :material-account-plus: **[Referral Bonus](finance/referral-bonus.md)**\n\n    ***\n\n    $5K for successful referrals\n\n</div>\n\n### Development & Workflows ⚙️\n\n<div class=\"grid cards\" markdown>\n\n- :material-code-braces: **[Development Guide](workflows/development.md)**\n\n    ***\n\n    PR process, CLA, coding standards\n\n- :material-test-tube: **[CI/Testing](workflows/ci-testing.md)**\n\n    ***\n\n    Running tests and quality checks\n\n- :material-file-document: **[Documentation](workflows/documentation.md)**\n\n    ***\n\n    Writing and maintaining docs\n\n- :material-package-variant: **[Product Development](workflows/product-development.md)**\n\n    ***\n\n    Feature planning and releases\n\n</div>\n\n### Community & Support 🌍\n\n<div class=\"grid cards\" markdown>\n\n- :material-account-group: **[Community Engagement](contributions/community-engagement.md)**\n\n    ***\n\n    Discord, GitHub, social media\n\n- :material-hand-heart: **[How to Contribute](contributions/how-to-contribute.md)**\n\n    ***\n\n    Complete contribution guide\n\n- :material-account-multiple: **[Development Team](contributions/how-to-contribute.md#our-development-team)**\n\n    ***\n\n    Contact directory\n\n- :material-help-circle: **[FAQ](faq/index.md)**\n\n    ***\n\n    Common questions answered\n\n</div>\n\n### Goals & Strategy 🎯\n\n<div class=\"grid cards\" markdown>\n\n- :material-target-account: **[Company Goals](goals/company-goals.md)**\n\n    ***\n\n    Strategic priorities and KPIs\n\n- :material-chart-timeline-variant: **[OKRs](goals/okrs.md)**\n\n    ***\n\n    Quarterly objectives framework\n\n- :material-map: **[Product Roadmap](https://docs.ultralytics.com/)**\n\n    ***\n\n    Public feature roadmap\n\n</div>\n\n### Legal & Compliance ⚖️\n\n<div class=\"grid cards\" markdown>\n\n- :material-scale-balance: **[Legal Team](legal/team.md)**\n\n    ***\n\n    Services and contact info\n\n- :material-gavel: **[Code of Conduct](legal/code-of-business-conduct-and-ethics.md)**\n\n    ***\n\n    Ethics and standards\n\n- :material-shield-check: **[Security Team](security/team.md)**\n\n    ***\n\n    Security and compliance\n\n- :material-lock: **[ISMS](security/isms.md)**\n\n    ***\n\n    Information security management\n\n- :material-account-lock: **[Security Requirements](security/employee-security-compliance-requirements.md)**\n\n    ***\n\n    Employee obligations\n\n</div>\n\n## Contact Information 📞\n\n!!! question \"Need Help?\"\n\n    === \"Technical Support\"\n\n        - **Slack:** `#it-support`\n\n    === \"Finance\"\n\n        - **Slack:** `#finance`\n        - **Questions:** Contact Finance team\n\n    === \"Legal\"\n\n        - **Email:** [legal@ultralytics.com](mailto:legal@ultralytics.com)\n        - **Slack:** `#compliance`\n\n    === \"Security\"\n\n        - **Email:** [security@ultralytics.com](mailto:security@ultralytics.com)\n        - **Slack:** `#security`\n\n    === \"HR\"\n\n        - **Contact:** Your manager or HR team\n        - **Slack:** `#hr`\n\n### Important Resources\n\n<div class=\"grid cards\" markdown>\n\n- :material-shield-star: **[Trust Center](https://trust.ultralytics.com/)**\n\n    ***\n\n    Security documentation and certifications\n\n- :material-web: **[Ultralytics Website](https://www.ultralytics.com/)**\n\n    ***\n\n    Company information\n\n- :material-book: **[YOLO Documentation](https://docs.ultralytics.com/)**\n\n    ***\n\n    Technical documentation\n\n- :material-github: **[GitHub Repository](https://github.com/ultralytics/handbook)**\n\n    ***\n\n    This handbook's source\n\n</div>\n\n## Contributing to This Handbook 📝\n\nThis handbook is maintained as an open resource. If you find errors, have suggestions, or want to improve content:\n\n```mermaid\ngraph LR\n    A[Find Issue/Improvement]:::start --> B[Visit GitHub Repository]:::proc\n    B --> C[Fork & Create Branch]:::proc\n    C --> D[Make Changes]:::proc\n    D --> E[Submit Pull Request]:::proc\n    E --> F[Follow Contribution Guidelines]:::proc\n    F --> G[Changes Reviewed]:::proc\n    G --> H[Merged & Deployed]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n1. Visit our [GitHub repository](https://github.com/ultralytics/handbook)\n2. Submit a pull request with your improvements\n3. Follow the contribution guidelines in the repository\n\n!!! tip \"Make an Impact\"\n\n    Your contributions help improve the experience for everyone at Ultralytics. Whether it's fixing a typo or adding a new section, every improvement counts!\n"}, {"type": "file", "name": "introduction.md", "path": "introduction.md", "content": "---\ntitle: Handbook Introduction\ndescription: Introduction to the Ultralytics Handbook covering company mission, values, workflows, and operational guidelines for team members and contributors.\nkeywords: Ultralytics handbook, company introduction, AI handbook, employee guide, contributor guide, open source handbook\n---\n\n# Introduction\n\nWelcome to the Ultralytics Employee Handbook! This handbook is your guide to working at Ultralytics. It contains information about our company culture, policies, and procedures.\n\nWe are an AI-first company, which means that we believe in the power of AI to change the world. We are committed to building the best AI products and services, and to creating a work environment that is both challenging and rewarding.\n\nWe believe in transparency and open communication, and we encourage all employees to be active participants in the life of the company.\n\n## Purpose and Scope 🎯\n\n<div class=\"grid cards\" markdown>\n\n- :material-target-account: **Align**\n\n    ***\n\n    Ensure everyone understands our mission, values, and strategic priorities\n\n- :material-compass: **Guide**\n\n    ***\n\n    Provide clear procedures for common tasks and processes\n\n- :material-lightning-bolt: **Empower**\n\n    ***\n\n    Give you the resources to work effectively and make informed decisions\n\n- :material-refresh: **Evolve**\n\n    ***\n\n    Serve as a living document that grows with our organization\n\n</div>\n\n## Who This Handbook Is For 👥\n\n### Ultralytics Team Members\n\nInternal employees and contractors will find comprehensive guidance on:\n\n- **[Your First 90 Days](people/onboarding.md)** - Complete onboarding roadmap for new team members\n- **[Ultralytics Portal](https://portal.ultralytics.com/signin)** - SSO-only internal hub for dashboards, onboarding checks, AI agent settings, and company tools\n- Company policies and procedures\n- Financial processes and reimbursements\n- Hardware and software provisioning\n- Security and compliance requirements\n\n### Open Source Contributors\n\nCommunity members contributing to our repositories should reference:\n\n- Development workflows and coding standards\n- Testing and CI requirements\n- Documentation guidelines\n- Contribution best practices\n\n### Partners and Collaborators\n\nExternal partners can learn about:\n\n- Our mission, vision, and values\n- How we work and communicate\n- Quality standards and expectations\n- Legal and compliance requirements\n\n## How to Use This Handbook 📚\n\n=== \"Navigation\"\n\n    Use the sidebar or top navigation to browse by topic:\n\n    - **Mission & Values**: Our foundational principles\n    - **Finance**: Travel, relocation, and reimbursement policies\n    - **Tools**: Hardware, software, and email setup\n    - **Workflows**: Development, CI/testing, and documentation\n    - **Community**: How to contribute and engage\n    - **Legal & Security**: Compliance, ethics, and information security\n\n=== \"Search\"\n\n    Use the search function (top of page) to quickly find specific topics, policies, or procedures.\n\n    !!! tip \"Pro Tip\"\n\n        Use keywords like \"PTO\", \"travel\", \"onboarding\" for quick results\n\n=== \"Stay Updated\"\n\n    This handbook is maintained in our [GitHub repository](https://github.com/ultralytics/handbook).\n\n    - :material-eye: Watch for updates\n    - :material-git: Submit pull requests to improve content\n    - :material-rss: Subscribe to release notifications\n\n## About Ultralytics 🚀\n\nUltralytics is a world leader in artificial intelligence, creating state-of-the-art computer vision tools that democratize advanced technology. Our flagship YOLO (You Only Look Once) models set the standard for real-time object detection, balancing speed and accuracy at every scale. Learn more on our [About page](https://www.ultralytics.com/about).\n\n### AI-First Mindset\n\nUltralytics is an AI-first company. We expect everyone to default to AI assistants and automation to move faster and raise quality—drafts, analyses, reviews, and routine ops should start with AI, while human judgment keeps us compliant, secure, and customer-obsessed.\n\n### What We Do\n\n<div class=\"grid cards\" markdown>\n\n- :material-open-source-initiative: **Open Source**\n\n    ***\n\n    Develop [YOLO](https://www.ultralytics.com/yolo) and [computer vision](https://docs.ultralytics.com/tasks) frameworks\n\n- :material-flask: **Research**\n\n    ***\n\n    Push boundaries of AI model performance and efficiency\n\n- :material-cloud-upload: **Platform**\n\n    ***\n\n    Build tools for [training](https://docs.ultralytics.com/modes/train), [deployment](https://docs.ultralytics.com/guides/model-deployment-options), and production AI\n\n- :material-account-group: **Community**\n\n    ***\n\n    Support 1M+ developers using our technology worldwide\n\n- :material-briefcase: **Solutions**\n\n    ***\n\n    Deliver [industry-specific AI applications](https://www.ultralytics.com/solutions)\n\n</div>\n\n### How We Work\n\n!!! info \"Our Work Culture\"\n\n    === \"High-Resolution Hybrid\"\n\n        We work where the speed is. Tuesdays, Wednesdays, and Thursdays are **Anchor Days**—all team members within commutable distance are expected to be onsite to reduce latency, whiteboard in real time, and debug together.\n\n        Badge data is reviewed to keep teams in sync and credit consistent attendance; Anchor Day presence is a core performance and promotion input for Ultralytics. Opting into **5 days onsite** unlocks richer in-office perks and faster feedback loops.\n\n        Mondays and Fridays are flex for deep work, but critical launches may call for full-week co-location. :material-dog: All our offices are dog-friendly!\n\n    === \"Ship Fast, Learn Faster\"\n\n        MVP-first development with 2-week iteration cycles.\n\n        Bias toward action and rapid feedback loops.\n\n    === \"Open by Default\"\n\n        - Transparent decision-making\n        - Public development\n        - Open-source first approach\n\n    === \"Data-Driven\"\n\n        - Metrics guide decisions\n        - User feedback drives roadmap\n        - Evidence-based improvements\n\n    === \"High Autonomy\"\n\n        Freedom to own your work with clear expectations and accountability.\n\n    === \"Community-Powered\"\n\n        1M+ developers and contributors actively shape our direction.\n\n!!! tip \"Why In-Person Wins\"\n\n    - **Lower latency decisions:** Whiteboard in real time and ship faster.\n    - **Richer mentorship:** Learn from peers and leaders live, not lagged.\n    - **Career velocity:** Presence boosts visibility, impact, and promotion pace.\n\n## Daily Operations ⚙️\n\n- **Anchor Days (Tue/Wed/Thu):** Mandatory in-office presence for anyone within commutable distance of our London, Madrid, or Shenzhen hubs. We expect synchronous, in-person collaboration during local business hours on these days.\n- **Commutable Distance:** If you can reliably travel to and from a hub on Anchor Days, you are considered commutable and must be onsite; managers escalate edge cases but default to in-office attendance.\n- **Working Rhythm:** Anchor Days prioritize high-bandwidth sessions—design reviews, pair debugging, roadmap alignment—while Mondays/Fridays optimize for heads-down execution and async coordination.\n- **Verification & Performance:** Badge swipes are monitored for consistency; sustained Anchor Day participation is a prerequisite for meeting expectations and promotion eligibility.\n\n## Our Commitment to You 🤝\n\n=== \"Meaningful Impact\"\n\n    You'll work on technology used by millions of developers worldwide:\n\n    - Fortune 500 companies\n    - Individual researchers\n    - Production systems in:\n        - Autonomous vehicles\n        - Medical devices\n        - Manufacturing robots\n        - Agricultural drones\n\n    **This is AI that matters.**\n\n=== \"Accelerated Growth\"\n\n    Grow faster at Ultralytics than anywhere else:\n\n    | Opportunity | Details |\n    |-------------|----------|\n    | **Direct Access** | Work with founders and technical leaders |\n    | **Ownership** | Significant projects with high visibility |\n    | **Learning Budget** | Courses, books, conference attendance |\n    | **Mentorship** | World-class AI researchers and engineers |\n    | **Career Path** | Clear paths to senior and leadership roles |\n\n=== \"Compensation\"\n\n    Competitive Series A-level compensation:\n\n    - :material-cash: Market-rate salaries benchmarked against top tech companies\n    - :material-chart-line: Meaningful equity grants with long exercise windows\n    - :material-star: Performance bonuses and recognition\n    - :material-shield-check: Comprehensive benefits package\n\n    !!! info \"Details\"\n\n        Discuss compensation with your manager or HR.\n\n=== \"Transparency\"\n\n    We operate with radical transparency:\n\n    - :material-chart-box: Open financial metrics and company performance\n    - :material-map: Public product roadmap and development process\n    - :material-file-document: Clear decision-making with documented reasoning\n    - :material-account-voice: Direct access to leadership and honest 1:1s\n\n=== \"World-Class Team\"\n\n    Collaborate with exceptional talent:\n\n    <div class=\"grid cards\" markdown>\n\n    -   :material-school: **Top Researchers**\n\n        ---\n\n        AI researchers from leading universities and companies\n\n    -   :material-code-braces: **Proven Engineers**\n\n        ---\n\n        Engineers who have shipped products to millions\n\n    -   :material-github: **OSS Leaders**\n\n        ---\n\n        Open-source contributors recognized globally\n\n    -   :material-earth: **Global Diversity**\n\n        ---\n\n        Diverse team across 10+ countries and time zones\n\n    </div>\n\n## Living Document Philosophy 📝\n\nThis handbook is never finished. As Ultralytics evolves, our processes and policies adapt. We encourage everyone to:\n\n- **Suggest improvements**: Submit PRs or contact your manager\n- **Ask questions**: If something's unclear, others probably wonder too\n- **Share feedback**: Help us make this handbook more useful\n\n## Getting Help 💬\n\nQuestions about handbook content?\n\n- **Policy questions**: Contact your manager\n- **Finance/reimbursements**: Reach out to the Finance team in `#finance`\n- **IT/security**: Use the `#it-support` or `#security` Slack channels\n- **Legal matters**: Email [legal@ultralytics.com](mailto:legal@ultralytics.com)\n- **HR questions**: Contact the HR team in `#hr`\n\n## Welcome! 🌟\n\nWhether you're a new employee, long-time contributor, or exploring Ultralytics for the first time, we're glad you're here. This handbook reflects our commitment to transparency, professionalism, and continuous improvement. Check out [our blog](https://www.ultralytics.com/blog) for the latest news and insights.\n\nLet's build the future of AI together! 🚀\n"}, {"type": "dir", "name": "legal", "path": "legal", "children": [{"type": "file", "name": "code-of-business-conduct-and-ethics.md", "path": "legal/code-of-business-conduct-and-ethics.md", "content": "---\ndescription: The Code of Business Conduct and Ethics outlines the principles and expectations that guide our work together, decision-making, and company representation.\nkeywords: Ultralytics code of conduct, business ethics, anti-corruption, data protection, workplace inclusion, conflict of interest, financial responsibility, whistleblower reporting\n---\n\n# Code of Business Conduct and Ethics (2025) 📖\n\n## About This Code 📌\n\nUltralytics operates globally with offices in London, Madrid, and Shenzhen. We run a **High-Resolution Hybrid** model: team members within commutable distance badge in on **Anchor Days (Tue/Wed/Thu)** to collaborate at full bandwidth, with badge data reviewed to keep workplaces safe, recognize consistent presence, and always handled per our Employee Privacy Policy and applicable labor laws. This Code of Business Conduct and Ethics ensures everyone understands their responsibilities and maintains our high standards, regardless of location.\n\n!!! info \"Related Policies\"\n\n    [Open-Source Code of Conduct](https://docs.ultralytics.com/help/code-of-conduct), [Privacy Policy](https://docs.ultralytics.com/help/privacy), [Environmental, Health and Safety Policy](https://docs.ultralytics.com/help/environmental-health-safety), [Social Media Policy](../contributions/social-media-policy.md).\n\nOur mission is to move the world forward by first moving ourselves, continuously pushing the boundaries of AI through relentless execution, creating the world's best open-source solutions that benefit everyone equally, and empowering individuals to improve their lives and the lives of those around them.\n\nWe believe the way we work matters just as much as what we build. At Ultralytics, five core values guide everything we do: Relentless Progress, Strive for Excellence, Actions Not Words, Act with Urgency, and Open Access to All. These values shape our culture, inform our decisions, and define how we collaborate and innovate.\n\nBy staying true to this [Mission and Values](https://handbook.ultralytics.com/mission-vision-values), we ensure that our pursuit of technological advancement is grounded in integrity, inclusivity, and purpose.\n\nThis Code establishes essential guidelines for ethical behavior and legal compliance. All team members, including employees (full-time or part-time), contractors, advisors, and partners worldwide, must adhere to this Code. While not comprehensive of all policies or laws, it provides minimum standards for conducting business responsibly. Everyone is expected to familiarize themselves with applicable laws and regulations in their area of operation.\n\nViolations of applicable laws, company policies, or this Code can result in serious individual consequences, including disciplinary actions and dismissal. These violations also create significant risks for Ultralytics as a whole, potentially exposing the company to legal liability, reputational damage, and threats to our operational continuity.\n\nWe trust you to exercise sound judgment and maintain the highest ethical standards in all business decisions. When facing uncertainty or ethical dilemmas, we encourage you to seek guidance and raise concerns promptly. For assistance or to report concerns, contact legal@ultralytics.com. Additional information on how to report concerns can be found in the final section, [Raising Concerns and Getting Help](#raising-concerns-and-getting-help).\n\n## Creating an Inclusive and Safe Workplace 🏡\n\n### Our Commitment to Respect and Inclusion\n\nUltralytics is committed to fostering a culture where respect, fairness, and integrity are fundamental to everything we do. We provide a safe, inclusive, and positive environment for all team members, regardless of gender, race, disability, nationality, sexual orientation, religion, age, or any other protected characteristic.\n\nWe prohibit discrimination, harassment, or bullying in any form. Every team member should feel valued, empowered, and safe to perform their best work. Harassment can take many forms, including unwelcome verbal or physical conduct, or repeated behavior that creates an intimidating, hostile, or offensive work environment.\n\nOur commitment to inclusion extends to our open-source community. See our [Open-Source Code of Conduct](https://docs.ultralytics.com/help/code-of-conduct) for community standards.\n\n### Workplace Safety and Security\n\nEveryone plays a role in maintaining a safe and secure workplace. We expect all team members to:\n\n- Follow security protocols, including proper badge usage and facility access procedures defined by our workspace provider\n- Report unsafe conditions, situations, or accidents immediately\n- Report any acts of violence or threats toward persons or property without delay\n\n### Substance Use Policy\n\nTeam members are expected to maintain a safe, professional, and respectful environment while working, representing Ultralytics, or participating in any company-related activities. The use, possession, or being under the influence of illegal drugs or alcohol during work hours, whether at company facilities, remote settings, or company events, is strictly prohibited.\n\nParticipation in company social events is entirely voluntary. While alcohol may be served at such gatherings, we ask that you enjoy it responsibly. Maintaining respectful behavior and ensuring that everyone feels comfortable is a shared responsibility; we count on you to uphold these values.\n\n## Fair Business Practices 💻\n\n### Anti-Corruption and Bribery\n\nUltralytics is committed to complying with all anti-bribery laws, including the United States Foreign Corrupt Practices Act (FCPA) and the United Kingdom Bribery Act. Any form of bribery, direct or indirect, is strictly prohibited. You must not offer a bribe to, or accept one from, any person, at any time, for any reason.\n\nAny third party, supplier, contractor, consultant, agent, or intermediary acting on behalf of Ultralytics is also prohibited from offering, giving, or accepting bribes. Cultural \"norms\" are never an excuse to make a bribe. When in doubt, consult the Legal Team before offering or receiving anything of value.\n\n### Gifts and Business Entertainment\n\nWe build relationships through professional excellence, not through excessive gifts or entertainment. Accept or offer only promotional items or gifts of nominal value. Business meals and entertainment must be reasonable, infrequent, and directly related to legitimate business purposes.\n\nDocument and disclose any gifts or entertainment that could appear to influence business decisions to the Legal Team. Report situations that make you uncomfortable or seem inappropriate.\n\n### Fair Competition\n\nCompetition laws worldwide ensure healthy markets by preventing practices that harm fair competition and consumer choice. These regulations prohibit competitors from coordinating on pricing, sales terms, or dividing customers and markets between them.\n\nUltralytics competes solely on the quality and value of our products and services, never through anticompetitive behavior or misleading practices. We maintain strict compliance with competition laws in all markets where we operate.\n\nContact Legal Team immediately if you have questions about competition law requirements or suspect any violations by Ultralytics, partners, suppliers, or competitors.\n\n### Business Partner Selection\n\nWhen engaging business partners, consider how they align with our values and conduct their businesses. Who we do business with directly impacts our reputation and may have legal and business implications.\n\nConduct appropriate due diligence and only select parties you trust to represent Ultralytics well and share our commitment to ethical conduct. Be alert to red flags such as vague service descriptions, unusual payment requests, reluctance to provide compliance certifications, or a history of illegal or questionable conduct.\n\n### Government and Public Sector Dealings\n\nWhen Ultralytics conducts business with government entities, state-owned enterprises, or public international organizations, we must comply with strict anti-corruption laws. Under statutes like the U.S. Foreign Corrupt Practices Act, providing anything of value to government officials to secure business or favorable treatment constitutes a criminal offense.\n\nGovernment officials include elected officials, candidates for public office, employees of government-owned companies, representatives of public international organizations, and political party members. The prohibition extends beyond traditional gifts to include meals, entertainment, travel expenses, political or charitable donations, and employment opportunities for officials' family members.\n\nIn limited circumstances, with proper pre-approval, modest expenditures may be permissible when directly related to legitimate product demonstrations or service presentations. For example, a reasonable meal during a day-long product demonstration may be acceptable with advance authorization.\n\nBefore offering any form of hospitality or benefit to government officials, consult with the Legal Team and your supervisor to ensure full compliance.\n\n### Insider Trading Prevention\n\nIf you learn material, nonpublic information about Ultralytics or any other company (such as customers, suppliers, or parties in potential transactions), you may not trade securities or \"tip\" others who might make investment decisions based on such information.\n\nInformation is \"material\" if a reasonable investor would consider it important in making trading decisions, and \"nonpublic\" if it hasn't been disseminated to investors generally. Trading on inside information is illegal and unethical, regardless of the trade size.\n\n## Conflict of interests 👥\n\nA conflict of interest occurs when your interests, whether financial, professional, or relational, could interfere with your ability to act in Ultralytics' best interests. These situations can compromise your objectivity and decision-making, potentially harming the company's reputation and business outcomes. Even the appearance of a conflict can undermine trust and credibility.\n\nIdentifying conflicts of interest can be challenging and isn't always straightforward. When you're uncertain whether a situation constitutes a conflict, always seek guidance from the Legal Team and copy your manager.\n\n### Outside Work and Activities\n\nWe respect that you have responsibilities and interests outside of work. However, you must avoid situations where outside employment, consulting, or board service could interfere with your professional judgment or responsibilities to Ultralytics.\n\nYou may not work for competitors or participate in activities that enhance a competitor's position. Other outside work is generally permitted if it doesn't create conflicts or impact your performance. Discuss any outside employment or board service with the Legal Team and obtain approval before proceeding.\n\n### Personal Relationships in Business\n\nPersonal relationships with colleagues create conflicts of interest when one person reports to the other or has decision-making authority that could affect the other's employment, compensation, or career advancement. Similarly, relationships with individuals at companies we do business with may compromise your objectivity.\n\nIf you have personal relationships that could affect business decisions, disclose them immediately to the Legal Team and remove yourself from related decision-making processes. This includes situations involving family members or significant others.\n\n### Financial Interests and Business Dealings\n\nYou may not have personal or family financial interests in Ultralytics customers, partners, suppliers, or competitors that could improperly influence your judgment or create divided loyalty. This includes investment, ownership, or creditor interests that might result in personal benefit from your role at Ultralytics.\n\nMultiple factors determine whether a conflict exists, including the investment size, your ability to influence decisions, access to confidential information, and any personal connections you may have with the other party. When conducting business with family, friends, or close personal contacts, disclosure to the Legal Team is required.\n\n## Protecting Data at Ultralytics 🔐\n\nAs a leader in AI and computer vision technology, Ultralytics is entrusted with sensitive data from our customers, partners, employees, and the broader community who rely on our open-source and commercial solutions. Each team member has a fundamental responsibility to protect the confidentiality, integrity, and availability of all data we handle.\n\nWe are committed to processing and protecting data according to applicable privacy and security requirements, regulations, and industry best practices worldwide. Our approach to data protection is built on transparency, accountability, and trust, recognizing that securing data is everyone's business.\n\n### Ultralytics Confidential Information\n\nConfidential Information generated and gathered in Ultralytics' business plays a vital role in our operations, competitive position, and ability to innovate in the AI industry. \"Confidential Information\" encompasses any material that Ultralytics does not make or want to make publicly known at a given time.\n\nAt a minimum, this information includes technical or scientific information about current and future AI services or research, non-public product roadmaps, customer data, usage analytics, business or marketing plans, financial data, personnel information, customer lists, and other non-public information that could benefit competitors or harm Ultralytics if disclosed.\n\nYou are expected to protect Ultralytics' Confidential Information and any trade secrets to which you may have access during your work, as outlined in your employment agreement and/or non-disclosure agreement. This responsibility applies while you work at Ultralytics and continues even after you leave the company.\n\nRead our [Data Classification Policy](https://app.vanta.com/c/ultralytics/employee/onboarding) to learn more about how different types of information should be handled.\n\n### Handling Confidential Information\n\nConfidential Information should be used solely for legitimate company purposes and shared only with authorized personnel who have a business need to know. You may not disclose or distribute Ultralytics' Confidential Information, except when disclosure is authorized by the company or required by applicable law, regulation, or legal orders (such as court orders, subpoenas, or government investigations).\n\nAll team members must complete mandatory security and privacy training through Vanta upon joining the company and then annually thereafter. When your engagement with Ultralytics ends, you must return all company Confidential Information and proprietary materials.\n\n### Third Party Confidential Information\n\nJust as Ultralytics protects its confidential materials, we respect the rights of other people and companies to protect their Confidential Information and trade secrets. If you have information that might reasonably be considered Confidential Information or a trade secret of another person or company, you must not reveal it to Ultralytics without authorization from the owner of the information. This includes information from prior employers.\n\nYou may, under an authorized non-disclosure agreement, become aware of another company's Confidential Information or trade secrets in the context of exploring business relationships, partnerships, or integrations. You must respect the proprietary nature of this information and not use it or disclose it without proper authorization.\n\n### Incident Reporting and Support\n\nAll security incidents must be reported immediately to security@ultralytics.com or [#compliance](https://ultralytics-work.slack.com/archives/C08EBUT9UCR) Slack channel. An incident includes any situation where protected data can be lost, stolen, compromised, or otherwise improperly handled, including attempts to gain unauthorized access to systems or data.\n\n## Financial Responsibility at Ultralytics 💳\n\nStakeholders depend on accurate financial information to make informed decisions about Ultralytics. All financial transactions require proper authorization and must comply with company policies. We are committed to honest, accurate recording and reporting of all financial data while maintaining strong internal controls and following applicable laws and regulations.\n\n### Responsible Business Expenses\n\nExercise good judgment when spending company money. All expenses must be reasonable, business-related, properly documented, and compliant with [Ultralytics Finance Handbook](https://handbook.ultralytics.com/finance). Submit expense reports promptly with clear business justification and complete details. When uncertain about expenditures, consult your manager first.\n\nManagers must review and approve all team member expenses, carefully examining both costs and supporting documentation before approval.\n\n### Ethical Procurement Practices\n\nWhen purchasing goods, services, or software tools for Ultralytics, act with integrity and obtain proper authorization before engaging vendors or suppliers. Make decisions based on business value and merit, not personal relationships or incentives. Ensure all purchases serve legitimate business purposes and maintain transparency in vendor selection and pricing decisions.\n\n### Honest Revenue Recording\n\nRecord all sales transactions accurately and completely, reflecting the true nature of business agreements. Never manipulate or misrepresent revenue timing or amounts to meet targets or expectations. Ensure all sales have genuine customer commitments before recording revenue, and report any questionable transactions or pressure to inappropriately record sales.\n\n### Enhanced Responsibilities\n\nOur CEO, Finance, and Legal Teams carry heightened obligations to maintain organizational integrity and serve stakeholders effectively. These roles must foster a company-wide culture of accurate, comprehensive, and timely financial reporting. Key responsibilities include:\n\n- Maintaining honesty and integrity while avoiding conflicts of interest\n- Ensuring all information provided for stakeholder communications is complete, accurate, and timely\n- Staying current with relevant laws and regulations, seeking legal guidance when needed\n- Immediately reporting suspected violations to the Legal Team\n- Championing adherence to this Code throughout the organization\n\n### Preventing Money Laundering\n\nUltralytics strictly complies with anti-money laundering and counter-terrorism financing laws globally. Money laundering involves concealing illegal funds or making them appear legitimate. Watch for and report suspicious payment activities, including:\n\n- Large cash payment attempts\n- Payments involving parties not in the contract\n- Payment requests exceeding contract amounts\n- Payments in unauthorized currencies\n- Payments from suspicious or non-business accounts\n\n## Responsible Use of Ultralytics Resources 🛠️\n\nUltralytics provides a range of tools and resources, such as office space, computers, software, internet access, and supplies. These are here to support our shared goals and your day-to-day work. We expect everyone to use them responsibly and in ways that benefit the company, while maintaining professionalism and security.\n\n### Equipment Protection and Accountability\n\nIf you're using Ultralytics equipment at home or while traveling, take steps to keep it safe from damage, theft, or unauthorized use. Please treat it with the same care you'd give your personal belongings. When your time with Ultralytics ends, you must return all company resources in good working order. If anything gets damaged beyond regular wear and tear, let your manager know as soon as possible.\n\n### Personal Use Guidelines\n\nWe understand that sometimes you might need to use company resources for personal reasons. Keep the personal use occasional and make sure it doesn’t interfere with your work, impact team performance, or conflict with company interests. Personal use should always be reasonable and maintain a professional work environment.\n\n### Prohibited Activities\n\nThere are certain things you shouldn’t do with Ultralytics resources. You’re not allowed to take or use company property without approval, use it for personal business ventures or consulting work, or run fundraising efforts unless you have authorization from the Legal Team.\n\n### Software Licensing and Intellectual Property\n\nUltralytics respects intellectual property rights and software licensing seriously, and we expect everyone to do the same. Only use software that’s been properly licensed or approved, whether it’s commercial or open source. Using unauthorized software is illegal for both you and the company. If you're unsure about licensing for any tools you need, raise your question in the [#it-support](https://ultralytics-work.slack.com/archives/C099NHUEHD1) channel.\n\n### Copyright and Protected Materials\n\nPhotos, videos, music, articles, white papers, and websites are usually protected by copyright, even if they’re online and easy to access. If you want to include this kind of content in a presentation, event, or marketing material, make sure you have the right permissions. If you're unsure, contact the [#it-support](https://ultralytics-work.slack.com/archives/C099NHUEHD1) channel for help. Our team can guide you to approved visual asset libraries within our authorized tools.\n\n### Privacy and Monitoring\n\nAt Ultralytics, we respect your privacy, but it's important to understand that the resources we provide for work, such as email, messaging platforms, devices, and network access, are company property. This includes personal devices if you use them for work purposes.\n\nTo keep our systems secure, ensure productivity, and protect sensitive information, Ultralytics may, as permitted by applicable laws, monitor or access information created, stored, transmitted, or accessed through company tools and systems. This could include emails, files, internet activity, or messages exchanged via work platforms.\n\nMonitoring is done only when needed for legitimate business reasons such as security checks, compliance reviews, or to investigate potential misuse. We don’t monitor without cause, and we aim to be transparent about how we handle digital tools and data. To support these monitoring objectives, we deploy a mobile device management (MDM) solution to all devices that access company systems and data. For more details, refer to our approved [Hardware Policy](https://handbook.ultralytics.com/tools/hardware).\n\n## Raising Concerns and Getting Help\n\nLiving up to our Code of Conduct is something we all share. If something doesn’t seem right, you’re encouraged and expected to speak up. Whether it’s a potential breach of our values, a legal concern, or just something that feels ethically questionable, raising it early helps prevent bigger issues and shows our commitment to integrity and trust.\n\n### Safe to Raise a Concern\n\nWe want everyone to feel confident and safe bringing concerns forward. Ultralytics doesn’t tolerate retaliation of any kind against anyone who, in good faith, asks a question, raises an issue, or takes part in an investigation. Retaliating against someone for speaking up is a serious violation and may result in disciplinary action, up to and including termination.\n\n### How to Raise Concerns\n\nThe first and often best step is to speak with your manager. They're usually well-positioned to help with questions or concerns and may be able to resolve the issue right away. If you're uncomfortable speaking with your manager, or if your concern hasn’t been addressed to your satisfaction, you can also contact the Legal Team at legal@ultralytics.com.\n\n### How to Reach Us\n\n- 📧 **Email:** the Legal Team (this option is not anonymous)\n- 🌐 **[Anonymous Form Reporting](https://docs.google.com/forms/d/e/1FAIpQLSdXE24kB5975eZZBJ_0t1E-w7TKlTCUFYpm_MvccXi9qvwJtQ/viewform)**\n- 📬 **By post:**\n  Judicial Way, Frederick\n  MD 21703\n  United States\n\n### Anonymous Reporting\n\nIf you prefer to raise a concern without sharing your name, Ultralytics offers a secure and anonymous reporting option through Google Forms. We understand that speaking up can be uncomfortable, and this anonymous channel provides you with a safe, confidential space to report any issues.\n\nThat said, if you feel comfortable, we do encourage you to identify yourself when submitting a report. Providing your name can help us investigate the matter more efficiently, follow up quickly if we need more information, and take meaningful corrective action when necessary. But if you’d rather stay anonymous, that’s entirely your choice - we respect that and will support it to the extent allowed by local laws.\n\nPlease keep in mind that the more detail you can share in your report, the better we’ll be able to understand and investigate the issue. Anonymous reports without enough context may limit our ability to take appropriate action.\n\n### What Happens After You Report\n\nOnce a concern is reported, it will be reviewed and investigated by trained team members. To keep things fair and unbiased, we ask that you don’t conduct your own investigation. Our goal is to handle every issue respectfully, professionally, and with the seriousness it deserves.\n\n### Consequences of Violations\n\nViolations of our Code or any laws or regulations can lead to disciplinary actions. These will depend on the nature and seriousness of the situation and may include formal warnings, demotion, or dismissal. In some cases, legal consequences may also apply.\n"}, {"type": "file", "name": "team.md", "path": "legal/team.md", "content": "---\ndescription: Ultralytics Legal Team overview covering legal services, contact information, anonymous reporting channels, and key company policies.\nkeywords: Ultralytics legal team, corporate compliance, employment law, intellectual property, privacy, data protection, anonymous reporting\n---\n\n# Ultralytics Legal Team ⚖️\n\n## Our Mission\n\n!!! success \"Mission\"\n\n    We provide comprehensive legal support to drive positive outcomes for Ultralytics and our customers in the AI and computer vision technology space — facilitating efficient, informed decision-making across all areas of the business so that compliance and innovation go hand in hand.\n\n## Legal Services & Responsibilities\n\n<div class=\"grid cards\" markdown>\n\n- :material-file-sign: **Commercial & Contracts**\n\n    ***\n    - Drafting and negotiating customer agreements\n    - Vendor procurement and contracts\n    - Partnership and licensing agreements\n    - Terms of service and user agreements\n    - Channel partner agreements\n\n- :material-office-building: **Corporate & Compliance**\n\n    ***\n    - Corporate governance and board support\n    - Securities compliance and regulatory filings\n    - Policy development and implementation\n    - Ethics and compliance program oversight\n    - Risk assessment and mitigation\n\n- :material-account-tie: **Employment Law**\n\n    ***\n    - Employment contracts and agreements\n    - HR and workplace policy development\n    - Workplace compliance issues\n    - Disciplinary and termination support\n    - Labor law compliance\n\n- :material-lightbulb: **Intellectual Property**\n\n    ***\n    - Trademark registration and protection\n    - Copyright support\n    - Patent strategy and filing\n    - IP licensing and agreements\n    - Handling infringement issues and disputes\n\n- :material-shield-account: **Privacy & Data Protection**\n\n    ***\n    - Privacy policy development\n    - Data processing agreements\n    - GDPR and global privacy compliance\n    - Data breach response and incident support\n    - Privacy impact assessments (PIAs)\n    - Cross-border data transfer compliance\n    - Data retention and disposal policies\n\n- :material-gavel: **Litigation & Disputes**\n\n    ***\n    - Managing contract disputes\n    - Employment-related claims\n    - IP infringement matters\n    - Regulatory investigations\n    - General business litigation\n\n</div>\n\n!!! question \"Reach the Legal Team\"\n\n    | Channel | Details |\n    | ------- | ------- |\n    | **Email** | [legal@ultralytics.com](mailto:legal@ultralytics.com) |\n    | **Slack** | `#compliance` (tag `@legal-team` for same-day response) |\n    | **Sales/Contracts** | `#sales` channel for contract reviews |\n\n### Priority Response (Same-Day)\n\n!!! warning \"Escalate Immediately\"\n\n    - Litigation or legal threats\n    - Regulatory investigations\n    - Data breaches or security incidents\n    - Employment terminations\n    - IP infringement claims\n\n## Policies & Resources\n\n### Company Policies\n\n- [Code of Business Conduct & Ethics](https://handbook.ultralytics.com/legal/code-of-business-conduct-and-ethics)\n- [GDPR Compliance Policy](https://app.vanta.com/c/ultralytics/employee/onboarding)\n\n### Legal Documents\n\n- [Terms of Service](https://www.ultralytics.com/legal/terms-of-service)\n- [Privacy Policy](https://www.ultralytics.com/legal/privacy)\n- [Enterprise Software License Terms](https://www.ultralytics.com/legal/enterprise-software-license)\n\n## Anonymous Reporting\n\n!!! info \"Speak Up Safely\"\n\n    We encourage open communication. If you need to raise a sensitive issue confidentially:\n\n    | Channel | Details |\n    | ------- | ------- |\n    | **Anonymous Form** | [Google Form Reporting](https://docs.google.com/forms/d/e/1FAIpQLSdXE24kB5975eZZBJ_0t1E-w7TKlTCUFYpm_MvccXi9qvwJtQ/viewform) |\n    | **By Post** | Judicial Way, Frederick, MD 21703, United States |\n\n    All reports are confidential and **protected from retaliation**.\n"}]}, {"type": "dir", "name": "mission-vision-values", "path": "mission-vision-values", "children": [{"type": "file", "name": "index.md", "path": "mission-vision-values/index.md", "content": "---\ndescription: Ultralytics Mission, Vision, and Values defining our commitment to advancing AI through open-source innovation and relentless execution.\nkeywords: Ultralytics mission, company vision, core values, AI mission, open source values, company culture, AI democratization\n---\n\n# Ultralytics Mission, Vision, & Values\n\n!!! success \"Our Purpose\"\n\n    We're on a mission to democratize AI and empower everyone, everywhere with transformative technology.\n\n## Mission\n\nTo move the world forward by first moving ourselves, continuously pushing the boundaries of AI through relentless execution, creating the world's best open-source solutions that benefit everyone equally and empower individuals to improve their lives and the lives of those around them.\n\n## Vision\n\nTo create a future where every person, regardless of means or background, has equal access to transformative AI, enabling them to seize opportunities and shape their own path. Aware that our time is finite, we strive to make a lasting impact that benefits future generations.\n\n## Values\n\n### 1. Relentless Progress 🚀\n\nWe are constantly evolving and improving. Just as life is ever-changing, we never rest at the middle - we aim for continuous progress in everything we do. We rise after every fall, knowing that lasting success is built through consistency.\n\n!!! example \"In Practice\"\n\n    === \"Development\"\n\n        - Ship features quickly and iterate based on feedback\n        - Learn from failures and adapt rapidly\n\n    === \"Culture\"\n\n        - Never settle for \"good enough\" when better is possible\n        - Maintain momentum even during challenges\n\n### 2. Strive for Excellence ⭐\n\nTrue excellence is achieved through perseverance. We believe that even the smallest details matter, and through steady refinement, we create great things.\n\n!!! example \"In Practice\"\n\n    === \"Code Quality\"\n\n        - Obsess over code quality and performance\n        - Review PRs thoroughly for correctness and clarity\n\n    === \"Documentation\"\n\n        - Write comprehensive tests and documentation\n        - Take pride in craftsmanship at every level\n\n### 3. Actions, Not Words 💪\n\nWe are defined by what we do, not what we say we will do. We focus on delivering results that truly matter, action by action.\n\n!!! example \"In Practice\"\n\n    === \"Delivery\"\n\n        - Deliver working code over lengthy proposals\n        - Measure impact by shipped features, not activity\n\n    === \"Communication\"\n\n        - Show progress through demos and metrics\n        - Let our work speak for itself\n\n### 4. Act with Urgency ⚡\n\nOur time is finite, and we do not know how finite. Opportunities are fleeting, and we move swiftly to capture them in a competitive world.\n\n!!! example \"In Practice\"\n\n    === \"Responsiveness\"\n\n        - Respond to issues and PRs within 24 hours\n        - Make decisions quickly with available information\n\n    === \"Execution\"\n\n        - Ship MVPs to gather feedback early\n        - Prioritize ruthlessly to focus on what matters most\n\n### 5. Open Access to All 🌍\n\nWe value open, honest, and transparent communication, where everyone's voice is heard and respected. We believe that sharing information openly and constructively empowers our team to collaborate effectively and innovate.\n\n!!! example \"In Practice\"\n\n    === \"Open Source\"\n\n        - Open-source by default for maximum community benefit\n        - Share knowledge freely through documentation and examples\n\n    === \"Collaboration\"\n\n        - Maintain transparent decision-making processes\n        - Welcome contributions from all skill levels and backgrounds\n        - Communicate clearly and proactively with stakeholders\n\n## High-Resolution Hybrid Culture 🎛️\n\nWe work where the speed is. Our computer vision breakthroughs demand high-bandwidth collaboration—real-time debugging, rapid whiteboarding, and fast decision loops. While we fiercely protect focus time, **Anchor Days (Tuesday-Thursday)** are the default operating system for anyone within commutable distance of our hubs. In-person collaboration on these days reduces latency across teams and keeps our innovation \"state of the art.\" Badge data verifies consistency, and presence is factored into performance and promotion to keep our cultural wiring aligned with our ambitions.\n\n!!! tip \"Why In-Person Wins\"\n\n    - **Speed:** Live decisions beat async threads when stakes are high.\n    - **Clarity:** Whiteboards, labs, and shared context cut ambiguity.\n    - **Growth:** Shoulder-to-shoulder mentoring accelerates skills and visibility.\n\n## Living Our Values 🤝\n\n<div class=\"grid cards\" markdown>\n\n- :material-code-braces: **In Development**\n\n    ***\n\n    **Relentless Progress:** Regular releases with continuous improvements\n\n    **Excellence:** Rigorous testing and code review standards\n\n    **Actions:** Working demos over extensive specifications\n\n    **Urgency:** Fast iteration cycles, sub-24-hour PR reviews\n\n    **Open Access:** Public development, welcoming all contributors\n\n- :material-account-group: **In Community**\n\n    ***\n\n    **Relentless Progress:** Regularly update documentation\n\n    **Excellence:** High-quality support and thorough answers\n\n    **Actions:** Show solutions through working code\n\n    **Urgency:** Respond promptly to issues and questions\n\n    **Open Access:** Free tools and knowledge for everyone\n\n- :material-briefcase: **In Operations**\n\n    ***\n\n    **Relentless Progress:** Continuous process improvement\n\n    **Excellence:** Professionalism in all communications\n\n    **Actions:** Clear accountability and ownership\n\n    **Urgency:** Efficient decision-making, minimal bureaucracy\n\n    **Open Access:** Transparent policies and accessible information\n\n</div>\n\n## Alignment with Mission 🎯\n\nOur values directly support our mission to advance AI for everyone:\n\n```mermaid\ngraph TD\n    A[Mission: Advance AI for Everyone]:::start --> B[Relentless Progress]:::proc\n    A --> C[Strive for Excellence]:::proc\n    A --> D[Actions Not Words]:::proc\n    A --> E[Act with Urgency]:::proc\n    A --> F[Open Access to All]:::proc\n\n    B --> G[Pushing Boundaries]:::out\n    C --> H[World's Best Solutions]:::out\n    D --> I[Real Results]:::out\n    E --> J[Democratize Before Opportunities Pass]:::out\n    F --> K[Equal Access Through Open Source]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n| Value                     | Mission Alignment                                          |\n| ------------------------- | ---------------------------------------------------------- |\n| **Relentless Progress**   | Continuously pushing boundaries through constant iteration |\n| **Strive for Excellence** | Creating world's best solutions through quality focus      |\n| **Actions, Not Words**    | Delivering real results that benefit users                 |\n| **Act with Urgency**      | Moving quickly to democratize AI before opportunities pass |\n| **Open Access to All**    | Ensuring equal access through open-source distribution     |\n\n## Cultural Expectations 🌱\n\n=== \"Team Members\"\n\n    **Your role in living our values:**\n\n    - [x] Embody these values in daily work\n    - [x] Hold yourself and others accountable to high standards\n    - [x] Speak up when you see values-aligned opportunities\n    - [x] Lead by example in demonstrating our culture\n\n=== \"Leaders\"\n\n    **Your responsibility in reinforcing culture:**\n\n    - [x] Model values consistently in decisions and actions\n    - [x] Recognize and reward values-aligned behavior\n    - [x] Address conflicts between actions and stated values\n    - [x] Continuously reinforce culture through communication\n\n=== \"Community\"\n\n    **How you can contribute:**\n\n    - [x] Respect our commitment to open-source principles\n    - [x] Contribute constructively following our guidelines\n    - [x] Help others in alignment with our inclusive values\n    - [x] Build on our work in ways that benefit all\n\n## Decision-Making Framework 🤔\n\nWhen facing difficult choices, ask:\n\n1. **Does this advance our mission?** Will it democratize AI or improve access?\n2. **Does it align with our values?** Specifically which values does it support or conflict with?\n3. **Does it serve the community?** Will it benefit users and contributors?\n4. **Can we execute with urgency?** Is the timeline appropriate for the opportunity?\n5. **Does it reflect excellence?** Are we proud of the quality?\n\n## Measuring Success 📊\n\nWe evaluate success through the lens of our values:\n\n<div class=\"grid cards\" markdown>\n\n- :material-star: **Community Growth**\n\n    ***\n    - GitHub Stars & Recognition\n    - Global AI community engagement\n\n- :material-download: **Adoption**\n\n    ***\n    - PyPI Downloads\n    - Active Users & Sustained Usage\n\n- :material-source-pull: **Contributors**\n\n    ***\n    - Diversity & Growth\n    - Open-source contributions\n\n- :material-speedometer: **Performance**\n\n    ***\n    - Speed, Accuracy Improvements\n    - Efficiency gains over time\n\n- :material-clock-fast: **Response Times**\n\n    ***\n    - Sub-24-hour issue responses\n    - Fast PR review cycles\n\n- :material-rocket-launch: **Innovation**\n\n    ***\n    - Features shipped per quarter\n    - Release frequency\n\n- :material-check-circle: **Customer Success**\n\n    ***\n    - Deployment success rates\n    - Production reliability metrics\n\n</div>\n\n## Living Document 📖\n\n!!! info \"Continuous Evolution\"\n\n    These values evolve as we grow. We regularly:\n\n    - Review values alignment in quarterly reflections\n    - Gather feedback on cultural health\n    - Update practices to better embody values\n    - Celebrate examples of values in action\n\n## Questions? 💬\n\n!!! question \"Unsure How to Apply These Values?\"\n\n    If you're unsure how to apply these values in a specific situation:\n\n    1. Discuss with your manager\n    2. Raise in team meetings\n    3. Reference decision-making framework above\n    4. Ask yourself: \"What would best serve our mission?\"\n\n_Our values aren't just words on a page - they're the foundation of how we work, innovate, and succeed together. Live them daily! 🚀_\n"}]}, {"type": "dir", "name": "people", "path": "people", "children": [{"type": "dir", "name": "careers", "path": "people/careers", "children": [{"type": "file", "name": "index.md", "path": "people/careers/index.md", "content": "---\ndescription: Ultralytics career progression framework overview with IC and Management tracks, promotion process, and track switching guidance.\nkeywords: Ultralytics careers, job levels, career progression, promotion criteria, IC levels, management levels, career ladder, YOLO\n---\n\n# Career Progression Framework\n\nUltralytics' career framework provides clear expectations for each level and guides professional development. We maintain two career tracks—Individual Contributor (IC) and Management—allowing team members to advance based on their strengths and interests.\n\n!!! info \"Equal Value\"\n\n    Both IC and Management tracks are valued equally and offer equivalent compensation and growth potential at similar scope levels. Choose the track that best aligns with your strengths and career goals.\n\n## Career Tracks\n\n**Individual Contributor (IC)**: [IC1](levels-ic.md#ic1-entry) → [IC2](levels-ic.md#ic2-mid-1-developing) → [IC3](levels-ic.md#ic3-mid-2-proficient) → [IC4](levels-ic.md#ic4-senior-1-skilled) → [IC5](levels-ic.md#ic5-senior-2-advanced) → [IC6](levels-ic.md#ic6-staff-expert) → [IC7](levels-ic.md#ic7-senior-staff-advisor) → [IC8](levels-ic.md#ic8-principal-strategist) → [IC9](levels-ic.md#ic9-distinguished-thought-leader)  \n**Management**: [M4](levels-management.md#m4-lead-manager) → [M5](levels-management.md#m5-manager) → [M6](levels-management.md#m6-senior-manager) → [M7](levels-management.md#m7-head-of) → [M8](levels-management.md#m8-director) → [M9](levels-management.md#m9-vp) → [M10](levels-management.md#m10-senior-vice-president)\n\n**Track switching**: IC4/IC5 ↔ M4 | M4/M5 ↔ IC5/IC6 | M6 ↔ IC6/IC7\n\n```mermaid\nflowchart TB\n    IC_TITLE[\"🔵 Individual Contributor Track\"]:::start\n    MGMT_TITLE[\"🟠 Management Track\"]:::start\n\n    subgraph IC [\" \"]\n        direction LR\n        IC1[\"IC1<br/>Entry\"]:::proc --> IC2[\"IC2<br/>Mid 1\"]:::proc\n        IC2 --> IC3[\"IC3<br/>Mid 2\"]:::proc\n        IC3 --> IC4[\"IC4<br/>Senior 1\"]:::proc\n        IC4 --> IC5[\"IC5<br/>Senior 2\"]:::proc\n        IC5 --> IC6[\"IC6<br/>Staff\"]:::proc\n        IC6 --> IC7[\"IC7<br/>Senior Staff\"]:::proc\n        IC7 --> IC8[\"IC8<br/>Principal\"]:::proc\n        IC8 --> IC9[\"IC9<br/>Distinguished\"]:::proc\n    end\n\n    subgraph MGMT [\" \"]\n        direction LR\n        M4[\"M4<br/>Lead Manager\"]:::decide --> M5[\"M5<br/>Manager\"]:::decide\n        M5 --> M6[\"M6<br/>Senior Manager\"]:::decide\n        M6 --> M7[\"M7<br/>Head of\"]:::decide\n        M7 --> M8[\"M8<br/>Director\"]:::decide\n        M8 --> M9[\"M9<br/>VP\"]:::decide\n        M9 --> M10[\"M10<br/>Senior VP\"]:::decide\n    end\n\n    IC_TITLE -.-> IC\n    MGMT_TITLE -.-> MGMT\n\n    IC4 <-.->|Switch| M4\n    IC5 <-.->|Switch| M4\n    IC5 <-.->|Switch| M5\n    IC6 <-.->|Switch| M5\n    IC6 <-.->|Switch| M6\n    IC7 <-.->|Switch| M6\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n```\n\n### Track Comparison\n\n| Aspect              | Individual Contributor (IC)                                      | Management                                                        |\n| ------------------- | ---------------------------------------------------------------- | ----------------------------------------------------------------- |\n| **Impact Through**  | Deep expertise and individual contributions                      | Building and leading teams to achieve collective goals            |\n| **Key Skills**      | Domain knowledge, problem-solving, innovation, execution         | People development, strategic planning, organizational leadership |\n| **Influence**       | Guiding decisions, setting standards, and sharing best practices | Team performance, culture, and organizational direction           |\n| **Scope Growth**    | Project → Team → Multi-team → Organization                       | Team → Department → Function → Division                           |\n| **Focus Evolution** | 100% Operational → 50% Ops / 50% Strategic                       | 80% Ops → 20% Ops / 80% Strategic                                 |\n\n**Full expectations**: [IC Levels (IC1-IC9)](levels-ic.md) | [Management Levels (M4-M10)](levels-management.md)\n\n## Switching Career Tracks\n\nTrack switches are normal and supported—discuss with your manager during quarterly reviews.\n\n| Direction           | Typical Path | Key Requirements                                                                                            |\n| ------------------- | ------------ | ----------------------------------------------------------------------------------------------------------- |\n| **IC → Management** | IC4/IC5→M4   | Excellence in role + leadership examples (mentoring, project leadership) + manager endorsement + 12+ months |\n| **Management → IC** | M4/M5→IC5+   | Maintained domain currency + manager discussion + business need + smooth team transition                    |\n\n**When to switch IC→Management**: Passionate about people development, organizational dynamics, and influencing through teams.\n**When to switch Management→IC**: Miss hands-on work, prefer expertise-based influence, and want deeper specialization in your field.\n\n---\n\n## Promotion Process\n\nPromotions require **sustained demonstration** of next-level performance across all dimensions:\n\n1. **Performance** - Meeting/exceeding current level for 6+ months\n2. **Next-Level Work** - Consistently operating at next level for 6-12 months\n3. **Scope** - Expanded scope and complexity appropriate to next level\n4. **Impact** - Demonstrated impact on team, function, or company\n5. **Readiness** - Manager and skip-level agreement\n6. **Presence** - Consistent Anchor Day participation (Tue/Wed/Thu) with badge data aligning to expectations keeps you promotion-ready.\n\n**Strong promotion cases include**: 3-5 specific examples with next-level impact, peer feedback, growth trajectory, and quantified business results.\n\n!!! tip \"Self-Advocacy\"\n\n    Document wins continuously • Seek feedback regularly • Proactively take next-level work • Build visibility through demos and docs • Be patient—promotions reward sustained performance\n\n---\n\n## Compensation\n\nCompensation reflects scope, impact, and market rates—not tenure. Both tracks offer equivalent pay at similar scope levels.\n\n**Components**: Base salary (market-competitive) • Equity (stock options) • Performance bonuses • Comprehensive benefits\n\n**Leveling factors**: Geographic location • Role specialization (i.e. ML/AI, Sales, Marketing) • Performance • Prior experience\n\n!!! info \"Reviews\"\n\n    Compensation reviewed annually at year-end and applied in Q1 (January paycheck). Adjustments consider performance, promotion eligibility, market changes, and company performance.\n\n---\n\n## Growth & Development\n\n**Learning Budget**: Annual allocation for courses, books, conferences, certifications (contact HR for amounts)\n\n**Resources**: Quarterly 1:1s for career planning • Mentorship programs • Internal workshops • 10% time for exploration • Conference attendance • Online courses • Certifications • Publications\n\n**Quarterly Growth Plan**: (1) Self-assess against level criteria → (2) Choose 2-3 skills to develop → (3) Find next-level opportunities with manager → (4) Get regular feedback → (5) Document impact for promotion discussions\n\n---\n\n## Typical Promotion Timelines\n\n| Level Transition | Typical Timeline | Key Demonstration                                 |\n| ---------------- | ---------------- | ------------------------------------------------- |\n| IC1 → IC2        | 12-18 months     | Independent task delivery                         |\n| IC2 → IC3        | 18-24 months     | Consistent mid-level impact                       |\n| IC3 → IC4        | 24-30 months     | Senior-level ownership and reliability            |\n| IC4 → IC5        | 24-36 months     | Cross-team leadership                             |\n| IC5 → IC6        | 36+ months       | Department-level strategic impact                 |\n| IC6 → IC7        | 36+ months       | Organization-wide strategic impact                |\n| IC7 → IC8        | 48+ months       | Company-level strategy and influence              |\n| IC8 → IC9        | Special appoint. | Industry impact and business-critical leadership  |\n| M4 → M5          | 18-24 months     | Multi-team coordination excellence                |\n| M5 → M6          | 24-36 months     | Functional leadership and strategic impact        |\n| M6 → M7          | 36+ months       | Executive-level influence                         |\n| M7 → M8          | 36+ months       | Director-level functional leadership              |\n| M8 → M9          | 48+ months       | Senior executive leadership                       |\n| M9 → M10         | 60+ months       | Enterprise leadership and board-level stewardship |\n\n!!! warning \"Sustained Performance Required\"\n\n    Timelines reflect typical progression. Exceptional contributions may accelerate, but promotions always require demonstrating readiness across **all dimensions**.\n\n---\n\n## Using This Framework\n\n**For ICs/Managers**: Read your [level guide](levels-ic.md) → Self-assess against dimensions → Identify 1-2 gaps → Study next level → Discuss with manager to create development plan\n\n**For Hiring Managers**: Use criteria for job leveling • Share expectations with candidates • Reference during onboarding • Apply consistently in reviews • Guide promotions with evidence\n\n---\n\n## Questions & Support\n\n### Career Development Questions\n\n- **Manager**: Primary resource for career discussions and promotion readiness\n- **HR Team**: Questions about levels, compensation, or promotion process\n- **Senior ICs/Managers**: Seek mentorship from those in roles you aspire to\n- **Skip-Level**: Discuss career with manager's manager for additional perspective\n\n### Additional Resources\n\n- **[IC Levels (IC1-IC9)](levels-ic.md)** - Detailed Individual Contributor expectations\n- **[Management Levels (M4-M10)](levels-management.md)** - Detailed Management expectations\n- **[People & Benefits](../index.md)** - Comprehensive people policies and resources\n- **[Onboarding](../onboarding.md)** - Level expectations for new team members\n"}, {"type": "file", "name": "levels-ic.md", "path": "people/careers/levels-ic.md", "content": "---\ndescription: Individual Contributor (IC) career levels IC1-IC9 at Ultralytics with detailed expectations and progression guidance.\nkeywords: IC levels, individual contributor, engineering ladder, career progression, technical levels, Ultralytics careers\n---\n\n# Individual Contributor Levels (IC1-IC9)\n\nComprehensive career framework for Individual Contributors at Ultralytics, defining expectations from entry-level through distinguished leadership. Use these descriptions for self-assessment, development planning, and promotion decisions.\n\n!!! info \"Career Framework Overview\"\n\n    Individual Contributors achieve impact through deep expertise and individual work. Both IC and [Management tracks](levels-management.md) offer equal advancement potential and compensation at equivalent scope levels. See [Career Progression](index.md) for the complete framework.\n\n!!! tip \"Presence & Collaboration\"\n\n    High-Resolution Hybrid is foundational: if you're within commutable distance, **Anchor Days (Tue/Wed/Thu) onsite** are mandatory. Badge consistency and in-person collaboration are baseline expectations at every IC level; reliable Anchor Day participation keeps you promotion-ready.\n\n## Career Progression\n\n```mermaid\ngraph LR\n    IC1[IC1<br/>Entry<br/>Associate]:::proc --> IC2[IC2<br/>Mid 1<br/>Developing]:::proc\n    IC2 --> IC3[IC3<br/>Mid 2<br/>Proficient]:::proc\n    IC3 --> IC4[IC4<br/>Senior 1<br/>Skilled]:::proc\n    IC4 --> IC5[IC5<br/>Senior 2<br/>Advanced]:::proc\n    IC5 --> IC6[IC6<br/>Staff<br/>Expert]:::proc\n    IC6 --> IC7[IC7<br/>Senior Staff<br/>Advisor]:::proc\n    IC7 --> IC8[IC8<br/>Principal<br/>Strategist]:::proc\n    IC8 --> IC9[IC9<br/>Distinguished<br/>Thought Leader]:::proc\n\n    classDef proc fill:#2196F3,color:#fff\n```\n\n## Level Overview\n\n| Level                                    | Title         | Career Stage   | Ops/Strategic Focus     |\n| ---------------------------------------- | ------------- | -------------- | ----------------------- |\n| [IC1](#ic1-entry)                        | Entry         | Entry          | 100% Operational        |\n| [IC2](#ic2-mid-1-developing)             | Mid 1         | Developing     | 100% Operational        |\n| [IC3](#ic3-mid-2-proficient)             | Mid 2         | Proficient     | 100% Operational        |\n| [IC4](#ic4-senior-1-skilled)             | Senior 1      | Skilled        | 100% Operational        |\n| [IC5](#ic5-senior-2-advanced)            | Senior 2      | Advanced       | 90% Ops / 10% Strategic |\n| [IC6](#ic6-staff-expert)                 | Staff         | Expert         | 80% Ops / 20% Strategic |\n| [IC7](#ic7-senior-staff-advisor)         | Senior Staff  | Advisor        | 70% Ops / 30% Strategic |\n| [IC8](#ic8-principal-strategist)         | Principal     | Strategist     | 60% Ops / 40% Strategic |\n| [IC9](#ic9-distinguished-thought-leader) | Distinguished | Thought Leader | 50% Ops / 50% Strategic |\n\n---\n\n## IC1: Entry\n\n- **Career Stage**: Entry\n- **Typical Roles**: Junior Engineer, Associate Product Manager, Junior Designer, Marketing Coordinator, Sales Development Rep\n- **Focus**: 100% Operational - Learning fundamentals under close supervision\n\n### Core Expectations\n\n| Dimension                            | IC1 Requirements
