const DATA = [{"type": "dir", "name": "contributions", "path": "contributions", "children": [{"type": "file", "name": "community-engagement.md", "path": "contributions/community-engagement.md", "content": "---\ndescription: Ultralytics community engagement guidelines covering Discord support, GitHub discussions, social media presence, and community building initiatives.\nkeywords: Ultralytics community, Discord support, GitHub discussions, community engagement, open source community, AI community\n---\n\n# Community Engagement 🌍\n\n## Overview\n\nUltralytics thrives on active community participation. Our open-source projects rely on contributions, feedback, and engagement from developers, researchers, and AI enthusiasts worldwide. This guide outlines how we engage with our community and how you can participate.\n\n## Community Platforms 💬\n\n### GitHub Discussions\n\n[GitHub Discussions](https://github.com/orgs/ultralytics/discussions) is our primary platform for technical conversations, feature requests, and community support.\n\n**Use GitHub Discussions for:**\n\n- Technical questions about [YOLO](https://docs.ultralytics.com/models) implementation\n- Feature requests and enhancement proposals\n- Sharing projects and use cases\n- General [YOLO](https://docs.ultralytics.com/models)-related discussions\n\n**Best Practices:**\n\n- Search existing discussions before posting\n- Use clear, descriptive titles\n- Include relevant code examples and error messages\n- Tag posts appropriately for better discoverability\n\n### Discord Community\n\n[Ultralytics Discord](https://discord.com/invite/ultralytics) provides real-time chat for community members.\n\n**Discord Channels:**\n\n- `#general` - General discussions\n- `#help` - Technical support\n- `#showcase` - Share your YOLO projects\n- `#announcements` - Official updates\n\n**Guidelines:**\n\n- Be respectful and professional\n- Help others when you can\n- Keep conversations on-topic per channel\n- Follow our [Code of Conduct](https://docs.ultralytics.com/help/code-of-conduct)\n\n### Social Media\n\nFollow and engage with us on:\n\n- **GitHub**: [@ultralytics](https://github.com/ultralytics)\n- **LinkedIn**: [@ultralytics](https://www.linkedin.com/company/ultralytics/)\n- **X (Twitter)**: [@ultralytics](https://x.com/ultralytics)\n- **YouTube**: [@ultralytics](https://www.youtube.com/ultralytics)\n- **Discord**: [Join Server](https://discord.com/invite/ultralytics)\n- **Reddit**: [r/ultralytics](https://www.reddit.com/r/ultralytics/)\n\n!!! note\n\n    Team members representing Ultralytics should follow our [Social Media Policy](social-media-policy.md) for professional conduct and brand guidelines.\n\n## Contributing to the Community 🤝\n\n### Answer Questions\n\nHelp fellow community members by:\n\n- Responding to GitHub Discussions\n- Providing support on Discord\n- Sharing your experience and solutions\n\n### Share Your Work\n\nShowcase projects built with [YOLO](https://docs.ultralytics.com/models):\n\n- Post in `#showcase` on Discord\n- Create GitHub Discussions posts\n- Tag us on social media\n- Write blog posts or [tutorials](https://docs.ultralytics.com/guides)\n\n### Report Issues\n\nHelp improve YOLO by reporting bugs with:\n\n- Clear [Minimum Reproducible Examples](https://docs.ultralytics.com/help/minimum-reproducible-example/)\n- Detailed environment information\n- Expected vs actual behavior\n- Error messages and logs\n\n### Contribute Code\n\nSee [How to Contribute](how-to-contribute.md) for guidelines on submitting code contributions.\n\n## Community Events 🎉\n\n### YOLO Vision Conference\n\nAnnual conference bringing together the YOLO community for talks, workshops, and networking. Check [ultralytics.com](https://www.ultralytics.com/) for announcements.\n\n### Online Workshops\n\nRegular online workshops covering:\n\n- [YOLO fundamentals](https://docs.ultralytics.com/)\n- Advanced [training techniques](https://docs.ultralytics.com/modes/train)\n- [Deployment strategies](https://docs.ultralytics.com/guides/model-deployment-options)\n- [Real-world applications](https://docs.ultralytics.com/guides)\n\n### Community Challenges\n\nPeriodic challenges and competitions to showcase innovative YOLO applications.\n\n## Recognition & Support 🌟\n\n### Top Contributors\n\nWe recognize outstanding community members through:\n\n- GitHub profile features\n- Social media shoutouts\n- Conference speaker invitations\n- Swag and merchandise\n\n### Support Resources\n\n- [Documentation](https://docs.ultralytics.com/)\n- [GitHub Discussions](https://github.com/orgs/ultralytics/discussions)\n- [Discord Community](https://discord.com/invite/ultralytics)\n- [Development Team](how-to-contribute.md#our-development-team)\n\n## Community Guidelines ✅\n\n| ✅ Do                           | 🚫 Don't                               |\n| ------------------------------- | -------------------------------------- |\n| Be respectful and inclusive     | Engage in harassment or discrimination |\n| Help others learn and grow      | Spam or self-promote excessively       |\n| Share knowledge and experiences | Share others' work without attribution |\n| Provide constructive feedback   | Post off-topic content repeatedly      |\n| Give credit where credit is due | Violate intellectual property rights   |\n\n## Get Involved Today! 🚀\n\nThe strength of Ultralytics comes from our community. Whether you're answering questions, contributing code, or sharing your projects, every contribution matters. Join us in advancing computer vision and AI for everyone.\n"}, {"type": "file", "name": "how-to-contribute.md", "path": "contributions/how-to-contribute.md", "content": "---\ndescription: Ultralytics open-source contribution guidelines covering pull requests, code standards, CLA signing, bug reporting, and community engagement.\nkeywords: Ultralytics, contributing, open source, pull requests, code of conduct, CLA, bug reporting, YOLO development, GitHub\n---\n\n# How to Contribute 🚀\n\nWelcome! We're thrilled you're considering contributing to [Ultralytics](https://www.ultralytics.com/) open-source projects. Your involvement helps enhance the quality of our repositories and benefits the entire computer vision community.\n\n!!! tip \"Complete Guidelines\"\n\n    For comprehensive contribution guidelines, also see the [Official Ultralytics Contributing Guide](https://docs.ultralytics.com/help/contributing) in our main documentation.\n\n[![Ultralytics open-source contributors](https://raw.githubusercontent.com/ultralytics/assets/main/im/image-contributors.png)](https://github.com/ultralytics/ultralytics/graphs/contributors)\n\n## Watch: Contributing to Ultralytics\n\n<iframe width=\"100%\" height=\"469\" src=\"https://www.youtube.com/embed/yMR7BgwHQ3g\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen></iframe>\n\n## Quick Start Guide 🎯\n\nReady to contribute? Follow these steps:\n\n1. **Read our [Code of Conduct](https://docs.ultralytics.com/help/code-of-conduct)** - Respect, kindness, and professionalism\n2. **Fork the repository** you want to contribute to\n3. **Create a feature branch** with descriptive name\n4. **Make your changes** following coding standards\n5. **Write tests** for new functionality\n6. **Submit a pull request** with clear description\n7. **Sign the CLA** by commenting in your PR\n8. **Respond to feedback** from reviewers\n\nSee [Development Workflow](../workflows/development.md) for detailed PR process.\n\n## Contributing Guidelines 📋\n\n### Code of Conduct 🤝\n\nAll contributors must adhere to our [Code of Conduct](https://docs.ultralytics.com/help/code-of-conduct), which is based on the [Contributor Covenant](https://www.contributor-covenant.org/). This ensures a welcoming and inclusive environment for everyone. **Respect**, **kindness**, and **professionalism** are at the heart of our community.\n\n### Contributor License Agreement (CLA) 📝\n\nBefore we can merge your PR, you must sign our [CLA](https://docs.ultralytics.com/help/CLA). This legal agreement ensures contributions are properly licensed under [AGPL-3.0](https://www.ultralytics.com/legal/agpl-3-0-software-license), protecting both you and the project.\n\nAfter submitting your PR, the CLA bot will guide you. To sign, comment:\n\n```\nI have read the CLA Document and I sign the CLA\n```\n\nThe CLA covers:\n\n- Copyright and patent licenses for your contributions\n- Rights for Ultralytics to use and distribute your work\n- Representations that you own the rights to your contributions\n- Disclaimer of warranties\n\nReview the full [CLA document](https://docs.ultralytics.com/help/CLA) for complete terms.\n\n### Best Practices ✨\n\nWhen contributing code:\n\n- **Avoid duplication**: Reuse existing code where possible\n- **Make smaller changes**: Focused modifications over large-scale changes\n- **Simplify**: Look for simplification opportunities\n- **Consider compatibility**: Avoid breaking existing code\n- **Use consistent formatting**: Follow [Ruff Formatter](https://github.com/astral-sh/ruff)\n- **Add tests**: Include tests for new features\n- **Update docs**: Keep [documentation](https://docs.ultralytics.com/) current\n\n### Coding Standards 📐\n\n- **Docstrings**: Use [Google-style docstrings](https://google.github.io/styleguide/pyguide.html) with types in parentheses\n- **Line width**: 120 characters maximum\n- **Imports**: Use `pathlib` instead of `os`\n- **Testing**: All PRs must pass [CI tests](https://docs.ultralytics.com/help/CI)\n- **Type hints**: Use where beneficial\n\nSee [Development Workflow](../workflows/development.md) for complete coding standards.\n\n## Ways to Contribute 🌟\n\n### Code Contributions 💻\n\n- New features and enhancements for [YOLO models](https://docs.ultralytics.com/models)\n- Bug fixes and issue resolution\n- Performance optimizations for [training](https://docs.ultralytics.com/modes/train) and [inference](https://docs.ultralytics.com/modes/predict)\n- Export format support for various [deployment options](https://docs.ultralytics.com/guides/model-deployment-options)\n- Platform compatibility improvements\n\n### Documentation 📚\n\n- Improve existing [documentation](https://docs.ultralytics.com/)\n- Add [tutorials and guides](https://docs.ultralytics.com/guides) for specific use cases\n- Fix typos and errors\n- Translate documentation to other languages\n\n### Testing 🧪\n\n- Write unit tests for new functionality\n- Test new features across different [models](https://docs.ultralytics.com/models) and [tasks](https://docs.ultralytics.com/tasks)\n- Report test coverage gaps\n- Performance [benchmarking](https://docs.ultralytics.com/modes/benchmark) across platforms\n\n### Community Support 💬\n\n- Answer questions in [GitHub Discussions](https://github.com/orgs/ultralytics/discussions)\n- Help users on [Discord](https://discord.com/invite/ultralytics)\n- Review pull requests\n- Triage issues\n\n## Reporting Bugs 🐞\n\nHelp us improve by reporting bugs via [GitHub Issues](https://github.com/ultralytics/ultralytics/issues):\n\n### Bug Report Requirements\n\n1. **Check existing issues** to avoid duplicates\n2. **Create [Minimum Reproducible Example (MRE)](https://docs.ultralytics.com/help/minimum-reproducible-example/)** - Small, self-contained code that reproduces the issue\n3. **Describe environment**: OS, Python version, library versions, hardware (CPU/GPU)\n4. **Explain expected vs actual behavior** with error messages and tracebacks\n\n### What Makes a Good MRE\n\nA Minimum Reproducible Example should:\n\n- **Isolate the problem**: Remove unnecessary code\n- **Use public models and datasets**: e.g., `yolo26n.pt` and `coco8.yaml`\n- **Include dependencies**: List with `yolo checks` or `pip list`\n- **Provide clear description**: Expected vs actual behavior\n- **Format properly**: Use code blocks with triple backticks\n- **Be testable**: Others can run it without modifications\n\nSee the complete [MRE Guide](https://docs.ultralytics.com/help/minimum-reproducible-example/) for detailed instructions.\n\n## Reviewing Pull Requests 👀\n\nReviewing PRs is valuable contribution:\n\n- **Check unit tests**: Verify tests for new features\n- **Review documentation**: Ensure docs are updated\n- **Evaluate performance**: Consider impact on speed/memory\n- **Verify CI tests**: Confirm all tests pass\n- **Provide constructive feedback**: Be specific and helpful\n- **Recognize effort**: Thank contributors\n\n## License Information 📜\n\n### AGPL-3.0 License\n\nUltralytics uses [AGPL-3.0](https://www.ultralytics.com/legal/agpl-3-0-software-license) for repositories. This promotes openness, transparency, and collaborative improvement.\n\n### Using YOLO in Your Project\n\nIf you use [Ultralytics YOLO](https://www.ultralytics.com/yolo) models or code in your project, AGPL-3.0 requires your entire derivative work also be open-sourced under AGPL-3.0.\n\n**Why compliance matters:**\n\n- Keeps software open for community benefit\n- Legal requirement when using AGPL-3.0 code\n- Fosters collaboration and transparency\n\n**Alternative:** If you prefer not to open-source your project, obtain an [Enterprise License](https://www.ultralytics.com/license).\n\n### How to Comply with AGPL-3.0\n\nMake complete source code publicly available under AGPL-3.0:\n\n1. **Choose starting point**:\n    - Fork [Ultralytics YOLO repository](https://github.com/ultralytics/ultralytics)\n    - Use [Ultralytics template repository](https://github.com/ultralytics/template)\n\n2. **License your project**:\n    - Add `LICENSE` file with full [AGPL-3.0 text](https://opensource.org/license/agpl-3.0)\n    - Add license notice at top of source files\n\n3. **Publish source code** including:\n    - Complete application/system\n    - Modifications to Ultralytics code\n    - [Training](https://docs.ultralytics.com/modes/train)/[validation](https://docs.ultralytics.com/modes/val)/[inference](https://docs.ultralytics.com/modes/predict) scripts\n    - Model weights if modified\n    - Configuration files and [datasets](https://docs.ultralytics.com/datasets) used\n    - Backend/frontend code\n    - Third-party libraries modified\n    - Training data if redistributable\n\n4. **Document clearly**:\n    - State AGPL-3.0 license in `README.md`\n    - Include setup instructions\n    - Attribute Ultralytics YOLO appropriately\n\nSee [Ultralytics Template Repository](https://github.com/ultralytics/template) for example structure.\n\n## Our Development Team 👥\n\nFeel free to reach out to team members for guidance:\n\n| Name                    | GitHub Profile                                                        |\n| ----------------------- | --------------------------------------------------------------------- |\n| Abi Anderson            | [UltralyticsAbi](https://github.com/UltralyticsAbi)                   |\n| Abirami Vina            | [abirami-vina](https://github.com/abirami-vina)                       |\n| Alex Wong               | [UltraAlex118](https://github.com/UltraAlex118)                       |\n| Alexis Schutzger        | [picsalex](https://github.com/picsalex)                               |\n| Altaïr Kabunda-Margalet | [altair-jpg](https://github.com/altair-jpg)                           |\n| Anastasiia Khrapal      | [nastijakh](https://github.com/nastijakh)                             |\n| Andrei Banica           | [banica-ultralytics](https://github.com/banica-ultralytics)           |\n| Antonina Poludena       | [Antonina2111](https://github.com/Antonina2111)                       |\n| Craig Johnston          | [craigjohnston1](https://github.com/craigjohnston1)                   |\n| Darin Kabashi           | [darin-k](https://github.com/darin-k))                                |\n| Esat Kalfaoglu          | [artest08](https://github.com/artest08)                               |\n| Fatih Akyon             | [fcakyon](https://github.com/fcakyon)                                 |\n| Francesco Mattioli      | [ambitious-octopus](https://github.com/ambitious-octopus)             |\n| Giovanni Dal Zillio     | [ggg-dz-ultralytics](https://github.com/ggg-dz-ultralytics)           |\n| Glenn Jocher            | [glenn-jocher](https://github.com/glenn-jocher)                       |\n| Hannah Streif           | [HannahStreif](https://github.com/HannahStreif)                       |\n| Jake Qian               | [fengqianjake](https://github.com/fengqianjake)                       |\n| Jianing Qi （Jalyn）    | [jianing-Jalyn](https://github.com/jianing-Jalyn)                     |\n| Jin Xu                  | [laodouya](https://github.com/laodouya)                               |\n| Jing Qiu                | [Laughing-q](https://github.com/Laughing-q)                           |\n| Joey Tjon               | [NoCodeJoey](https://github.com/NoCodeJoey)                           |\n| Joey Cherisea           | [Cherisea](https://github.com/Cherisea)                               |\n| Kasim Acikbas           | [kayselmecnun](https://github.com/kayselmecnun)                       |\n| Kristian Sommer         | [sokrisba](https://github.com/sokrisba)                               |\n| Lakshantha Dissanayake  | [lakshanthad](https://github.com/lakshanthad)                         |\n| Leo Samsinger           | [lsamsinger](https://github.com/lsamsinger)                           |\n| Marius Keiser           | [Skillnoob](https://github.com/Skillnoob)                             |\n| Matt Bristow            | [matt-ultralytics](https://github.com/matt-ultralytics)               |\n| Mengyu (Mason) Liu      | [lmycross](https://github.com/lmycross)                               |\n| Miles Deans             | [miles-deans-ultralytics](https://github.com/miles-deans-ultralytics) |\n| Mohammed Yasin          | [Y-T-G](https://github.com/Y-T-G)                                     |\n| Muhammad Rizwan Munawar | [RizwanMunawar](https://github.com/RizwanMunawar)                     |\n| Mykola Boiko            | [mykolaxboiko](https://github.com/mykolaxboiko)                       |\n| Nicolai Nielsen         | [niconielsen32](https://github.com/niconielsen32)                     |\n| Nuvola Ladi             | [NLadi](https://github.com/NLadi)                                     |\n| Olivia Wang             | [ziyue-olivia](https://github.com/ziyue-olivia)                       |\n| Onuralp Sezer           | [onuralpszr](https://github.com/onuralpszr)                           |\n| Pablo Karnbaum          | [pablokarnbaum](https://github.com/pablokarnbaum)                     |\n| Paula Derrenger         | [pderrenger](https://github.com/pderrenger)                           |\n| Rick Hou                | [Bovey0809](https://github.com/Bovey0809)                             |\n| Sergiu Waxmann          | [sergiuwaxmann](https://github.com/sergiuwaxmann)                     |\n| Shuai (Louis) Lyu       | [ShuaiLYU](https://github.com/ShuaiLYU)                               |\n| Thomas Chuang           | [chuang091](https://github.com/chuang091)                             |\n| Yogendra Singh          | [yogendrasinghx](https://github.com/yogendrasinghx)                   |\n| Tigran Hakobyan         | [t-hakobyan](https://github.com/t-hakobyan)                           |\n| Zinnia Pourdad          | [zinnialp](https://github.com/zinnialp)                               |\n| Zuzana Kontrikova       | [zkontri](https://github.com/zkontri)                                 |\n\n## Get Support 💬\n\nQuestions or need help?\n\n- Open an issue on [GitHub](https://github.com/ultralytics/ultralytics/issues)\n- Join [GitHub Discussions](https://github.com/orgs/ultralytics/discussions)\n- Connect on [Discord](https://discord.com/invite/ultralytics)\n- Check [documentation](https://docs.ultralytics.com/)\n- Visit [Help Center](https://docs.ultralytics.com/help)\n- Browse [Ultralytics Blog](https://www.ultralytics.com/blog) for tutorials and guides\n- Explore [Solutions](https://www.ultralytics.com/solutions) for industry-specific applications\n\n## Thank You! 🎉\n\nThank you for your interest in contributing to Ultralytics open-source projects. Your participation is essential in shaping the future of our software and building a vibrant community of innovation and collaboration.\n\nWe're excited to see your ideas come to life and appreciate your commitment to advancing object detection technology. Together, let's continue to grow and innovate! 🚀🌟\n\n## Resources 📚\n\n- [Official Contributing Guide](https://docs.ultralytics.com/help/contributing) - Complete contribution guidelines\n- [Development Workflow](../workflows/development.md) - PR process and code standards\n- [CI/Testing](../workflows/ci-testing.md) - Testing and quality checks\n- [Documentation Workflow](../workflows/documentation.md) - Writing docs\n- [Code of Conduct](https://docs.ultralytics.com/help/code-of-conduct) - Community standards\n- [CLA Document](https://docs.ultralytics.com/help/CLA) - Contributor License Agreement\n- [MRE Guide](https://docs.ultralytics.com/help/minimum-reproducible-example/) - Bug reporting best practices\n- [Ultralytics Blog](https://www.ultralytics.com/blog) - Tutorials and case studies\n- [Community Events](https://www.ultralytics.com/events) - Webinars and conferences\n- [Customer Stories](https://www.ultralytics.com/customers) - Real-world applications\n"}, {"type": "file", "name": "publications.md", "path": "contributions/publications.md", "content": "---\ntitle: Publications Guidelines\ndescription: Ultralytics publications guidelines covering eligibility criteria and how to submit research papers to the official Ultralytics Publications page.\nkeywords: Ultralytics publications, research papers, YOLO publications, publication guidelines, paper submission, computer vision research\n---\n\n# Publications 📚\n\n## Overview\n\nThe [Ultralytics Publications page](https://www.ultralytics.com/publications) showcases research papers authored by Ultralytics team members that are tied to our core work in computer vision and Ultralytics [YOLO](https://docs.ultralytics.com/models) model development. This page is a reflection of the team's technical contributions to the field — the criteria below ensure the content remains relevant, high-quality, and aligned with our brand.\n\n## Eligibility Criteria\n\nBefore submitting a paper, confirm it meets **all** of the following requirements:\n\n- ✅ **Ultralytics YOLO or computer vision focused** — the paper must be directly related to [YOLO](https://docs.ultralytics.com/models) or computer vision more broadly\n- ✅ **References Ultralytics models** — the paper must reference YOLOv5, YOLOv8, YOLO11, YOLO26, or any future Ultralytics-developed models\n- ✅ **No competitor mentions** — the paper must not reference or promote competing models or companies\n- ✅ **Current full-time employee** — you must be a full-time Ultralytics employee at the time of submission\n\n## How to Submit\n\nIf your paper meets all the eligibility criteria above, send the following details to the website team via Slack:\n\n| Field                    | Notes                             |\n| ------------------------ | --------------------------------- |\n| **Paper title**          | Full title of the paper           |\n| **Authors**              | All authors listed on the paper   |\n| **Short description**    | Max 240 characters                |\n| **Year**                 | Year of publication               |\n| **Journal / Conference** | Name of the journal or conference |\n| **Link**                 | URL to the published paper        |\n\nPapers will be reviewed before being added to [ultralytics.com/publications](https://www.ultralytics.com/publications).\n\n## Questions?\n\nReach out to the website team in the **`#website`** Slack channel if you have any questions about eligibility or the submission process.\n"}, {"type": "file", "name": "social-media-policy.md", "path": "contributions/social-media-policy.md", "content": "---\ndescription: Ultralytics social media policy covering content sharing, brand representation, confidentiality, and professional conduct guidelines for all employees.\nkeywords: Ultralytics social media, employee social media policy, brand guidelines, professional conduct, content sharing, confidentiality policy\n---\n\n# Social Media Policy\n\n## Overview 📱\n\nUltralytics believes social media is a powerful way to share our mission, connect with our [community](community-engagement.md), and celebrate our progress in AI and open source. This policy ensures all team members represent Ultralytics responsibly, professionally, and in alignment with our [Mission & Values](../mission-vision-values/index.md).\n\nThis policy applies to all employees, contractors, interns, and partners representing Ultralytics — whether on or off duty, and whether using company or personal accounts.\n\n!!! note\n\n    💡 **Remember:** You represent Ultralytics and our culture. If you're unsure, pause and ask before posting.\n\n## Policy Updates & Adaptability\n\nTechnology and communication norms evolve quickly. These guidelines are designed to be flexible and may be updated as social platforms, best practices, or company needs change.\n\nUltralytics reserves the right to modify this policy at any time, for any reason, without prior notice. However, we commit to being transparent about changes — communicating what is changing, why, and when updates will take effect.\n\n## Definition of Social Media\n\nThis policy applies to any platform where you can share or comment publicly, including but not limited to: LinkedIn, X (Twitter), Instagram, YouTube, Reddit, Facebook, TikTok, Discord, Medium, Substack, blogs, and forums.\n\n## Representing Ultralytics Online\n\n- ✅ **Disclose that you work at Ultralytics** when relevant\n- ✅ **Clarify that your opinions are your own.** Example: \"Views are my own, not those of my employer.\"\n- ✅ **Keep your professional profiles up to date**\n    - We **encourage** everyone to use the official **Ultralytics profile picture and LinkedIn banner** provided by the Marketing team\n    - While not mandatory, it helps maintain a unified and credible professional image\n- ✅ **Act in line with Ultralytics' values:** [Relentless Progress, Strive for Excellence, Actions Not Words, Act with Urgency, and Open Access to All](../mission-vision-values/index.md)\n- ✅ **Be factual, clear, and positive** in all interactions\n\n## What You Can Share\n\nWe encourage you to celebrate Ultralytics' work and community impact. You may share:\n\n- Official Ultralytics blogs, documentation, or updates **after** they've been published on our [website](https://www.ultralytics.com/) and/or social media channels\n- Public press coverage or media mentions\n- Partner announcements or collaborations **after** Ultralytics has shared them\n- Open-source highlights, YOLO model releases, and event recaps already visible online\n- Personal insights, experiences, or stories — your authenticity strengthens our [community](community-engagement.md)\n\n!!! tip\n\n    💬 _When in doubt, confirm with the Marketing team before posting._\n\n## What You Should Not Share\n\nTo protect Ultralytics, our partners, and our community:\n\n- ❌ **Product launches or announcements** before the Ultralytics brand does\n- ❌ **Partner names or clients** before official disclosure\n- ❌ **Comparisons or commentary** on competitors\n- ❌ **Confidential, revenue or financial information** (pricing, strategy, or internal docs)\n- ❌ **Screenshots or snippets** from Slack, emails, or internal dashboards\n- ❌ **Photos or videos of teammates** without consent\n- ❌ **Third-party content** (logos, images, text) without permission\n\n## Courses and Revenue-Generating Content\n\nWe encourage sharing knowledge — but Ultralytics' brand must **never** be monetized without approval.\n\n- ❌ Employees may **not create, sell, or promote paid courses, workshops, or tutorials** using the _Ultralytics_ name, logo, or content\n- ❌ You may **not present yourself as an official Ultralytics instructor** unless formally authorized\n- ✅ You may publish non-commercial educational content (e.g., blog posts, demos, open tutorials) that aligns with our mission\n- ✅ Commercial training or partnerships require **written approval** from your manager and the Marketing team\n\n## Brand Representation and Visual Identity\n\n- Only official Ultralytics social media accounts may publish on behalf of the company\n- Do **not** create new accounts, pages, or groups using Ultralytics' name or logo\n- Avoid posting content that could appear to be an official company statement\n- You may **reshare official Ultralytics posts** once they're published — never before\n\n## Confidentiality and Privacy\n\n- Protect internal and partner information at all times\n- Do not post unreleased product details, contracts, or communications\n- Obtain consent before sharing photos or quotes from colleagues\n- Remember that even \"private\" groups can become public\n\n## Professional Conduct and Tone\n\n- Be respectful, inclusive, and constructive\n- Avoid heated debates or confrontations\n- Never vent about internal issues publicly — use internal channels only\n- If you spot misinformation or negative commentary, alert the Marketing team rather than responding directly\n\nAll interactions should align with our [Code of Business Conduct and Ethics](../legal/code-of-business-conduct-and-ethics.md).\n\n## Security and Access\n\n- Never reuse your Ultralytics password for social media or third-party tools\n- Be cautious when granting apps or integrations permission to access company data\n- Report suspicious activity to IT or Marketing immediately\n\nFor more information, see our [Information Security Management System](../security/isms.md).\n\n## Connecting with Teammates\n\nWe encourage you to connect with colleagues on social media respectfully. Always follow our communication guidelines.\n\n## If You're Contacted by the Press\n\nIf journalists, influencers, or media outlets contact you about Ultralytics, do **not** respond directly. Forward all requests to the **Marketing team** or message **#PR** in Slack.\n\n## Our Shared Responsibility\n\nEvery [team member](https://www.ultralytics.com/about) shapes how Ultralytics is perceived worldwide. Acting with integrity, professionalism, and respect ensures we continue to earn the trust of our [community](community-engagement.md), partners, and contributors.\n\n## Quick-Reference Table\n\n| ✅ **Do**                                                          | 🚫 **Don't**                                                                   |\n| ------------------------------------------------------------------ | ------------------------------------------------------------------------------ |\n| Use the official Ultralytics profile photo or banner on LinkedIn   | Use the Ultralytics logo in personal profile handles or create new brand pages |\n| Share official posts _after_ they're live, adding your perspective | Announce new products or partnerships before the company does                  |\n| Clarify that opinions are your own                                 | Present yourself as an Ultralytics spokesperson without approval               |\n| Protect confidential and partner information                       | Share screenshots, pricing, or private Slack discussions                       |\n| Be polite, transparent, and inclusive                              | Engage negatively or debate competitors online                                 |\n| Report press or influencer inquiries to Marketing                  | Respond directly to journalists or public criticism                            |\n| Publish non-commercial tutorials using Ultralytics tools           | Create or sell paid courses or content using the Ultralytics name              |\n"}]}, {"type": "dir", "name": "faq", "path": "faq", "children": [{"type": "file", "name": "index.md", "path": "faq/index.md", "content": "---\ndescription: Frequently Asked Questions about working at Ultralytics, covering finance, equipment, workflows, policies, and support resources.\nkeywords: Ultralytics FAQ, employee questions, company policies, expense reimbursement, hardware policy, YOLO development, onsite work, office locations\n---\n\n# Frequently Asked Questions 💬\n\n!!! tip \"Quick Navigation\"\n\n    Jump to: [Getting Started](#getting-started) · [Finance](#finance-expenses) · [Hardware](#hardware-equipment) · [Development](#development-contributions) · [Time Off](#time-off-policies) · [Policies](#policies-procedures) · [Culture](#company-culture-goals) · [YOLO Technical](#technical-yolo-questions)\n\n## Getting Started 🚀\n\n??? question \"Where do I find the most important information as a new hire?\"\n\n    Start with these key resources:\n\n    <div class=\"grid cards\" markdown>\n\n    -   :material-rocket-launch: **[Onboarding Guide](../people/onboarding.md)**\n\n        ---\n\n        Your complete first 90 days roadmap\n\n    -   :material-book-open-variant: **[Introduction](../introduction.md)**\n\n        ---\n\n        Overview of the handbook\n\n    -   :material-target: **[Mission & Values](../mission-vision-values/index.md)**\n\n        ---\n\n        What drives us\n\n    -   :material-laptop: **[Hardware Policy](../tools/hardware.md)**\n\n        ---\n\n        Equipment setup\n\n    -   :material-code-braces: **[Development Workflow](../workflows/development.md)**\n\n        ---\n\n        Getting started with code\n\n    </div>\n\n??? question \"Are all positions onsite?\"\n\n    We operate a **High-Resolution Hybrid** model. If you live within commutable distance of our London, Madrid, or Shenzhen hubs, you are expected to be **onsite every Tuesday, Wednesday, and Thursday**.\n\n    :material-dog: **All our offices are dog-friendly!**\n\n    Anchor Days are a performance expectation: badge data is reviewed for consistency, and participation influences performance ratings and promotion eligibility. Mondays/Fridays are flex for deep work; full-week onsite may be required for launches.\n\n??? question \"Why do we emphasize in-person collaboration?\"\n\n    - **Speed:** Faster decisions and debugging on whiteboards.\n    - **Quality:** Shared context reduces rework and ambiguity.\n    - **Growth:** Shoulder-to-shoulder mentoring accelerates your skills and visibility.\n    - **Perks:** Better hardware, labs, company-paid Wednesday lunch for in-office employees, and real-time feedback.\n\n    Badge data is used to credit consistent attendance and keep spaces safe, handled per our privacy commitments.\n\n??? question \"Who do I contact for different types of questions?\"\n\n    | Question Type | Contact |\n    |--------------|---------|\n    | **IT/Technical** | `#it-support` on Slack |\n    | **Finance/Expenses** | `#finance` on Slack |\n    | **Legal/Compliance** | [legal@ultralytics.com](mailto:legal@ultralytics.com) or `#compliance` |\n    | **Security** | [security@ultralytics.com](mailto:security@ultralytics.com) |\n    | **HR/Policies** | Your manager or HR team |\n    | **General Questions** | Your direct manager |\n\n## Finance & Expenses 💰\n\n??? question \"How do I submit expenses for reimbursement?\"\n\n    === \"Under $3,000\"\n\n        1. Pay personally and keep receipts\n        2. Submit via company platform with receipts and business justification by the monthly cutoff\n        3. Receive approved expenses together in the next monthly reimbursement batch\n\n    === \"$3,000+\"\n\n        1. Submit request with cost estimate for **pre-approval**\n        2. Receive approval before purchasing\n        3. Submit receipts after purchase\n\n    See [Finance Handbook](../finance/index.md) for complete details.\n\n??? question \"What's the typical reimbursement timeline?\"\n\n    Finance processes one reimbursement batch per employee per month. The cutoff is the **25th calendar day** of the month, or the previous business day if the 25th falls on a weekend or company holiday. Approved expenses submitted after the cutoff roll into the following month's reimbursement batch.\n\n    Small expenses are not paid individually or immediately. For example, if two taxi receipts are approved before the May cutoff, both are paid together in the end-of-May reimbursement.\n\n    !!! tip \"Pro Tip\"\n\n        Submit receipts promptly with the business purpose and required documentation.\n\n??? question \"What does per diem cover when traveling?\"\n\n    === \"Included in Per Diem\"\n\n        - [x] All meals (breakfast, lunch, dinner)\n        - [x] Ground transportation (taxis, rideshares, public transit)\n        - [x] Incidental expenses (tips, laundry, parking)\n\n    === \"Reimbursed Separately\"\n\n        - :material-airplane: Airfare (economy class only)\n\n    See [Travel Policy](../finance/travel.md) for per diem rates by city.\n\n??? question \"Does Ultralytics provide company credit cards?\"\n\n    **No**, Ultralytics does not issue corporate credit cards.\n\n    Use personal payment methods for approved business expenses and submit for reimbursement following standard procedures.\n\n??? question \"What's the referral bonus program?\"\n\n    **$5,000 bonus** for referring a qualified candidate who:\n\n    - Gets hired\n    - Completes 3 months of employment\n\n    See [Referral Bonus Policy](../finance/referral-bonus.md) for eligibility and requirements.\n\n## Hardware & Equipment 🖥️\n\n??? question \"What equipment do new hires receive?\"\n\n    <div class=\"grid cards\" markdown>\n\n    -   :material-laptop: **Laptop**\n\n        ---\n\n        - **MacBook Air** (13\", M5, 16GB RAM, 512GB)\n        - **MacBook Pro** (14\", M5, 16GB RAM, 512GB) for technical roles\n\n    -   :material-headphones: **Audio**\n\n        ---\n\n        **AirPods Pro**\n\n    -   :material-monitor: **Display**\n\n        ---\n\n        **Apple Studio Display** (onsite employees at office desk)\n\n    </div>\n\n??? question \"How is equipment delivered?\"\n\n    === \"Onsite Employees\"\n\n        Equipment ready at your office on **day one**.\n\n    === \"Remote Employees\"\n\n        For the rare approved-remote roles outside commutable distance:\n        1. Order independently\n        2. Submit receipts for reimbursement\n        3. Follow [Finance procedures](../finance/index.md#reimbursements)\n\n??? question \"When can I upgrade my equipment?\"\n\n    **Hardware refresh cycle: Every 2 years**\n\n    ```mermaid\n    graph LR\n        A[Get Manager Approval]:::start --> B[Order New Device]:::proc\n        B --> C[Use Apple Trade-In]:::proc\n        C --> D[Submit for Reimbursement]:::out\n\n        classDef start fill:#4CAF50,color:#fff\n        classDef proc fill:#2196F3,color:#fff\n        classDef out fill:#9C27B0,color:#fff\n    ```\n\n    Reimbursed amount = **net cost** (new device - trade-in credit)\n\n    See [Hardware Policy](../tools/hardware.md) for complete details.\n\n??? question \"Is Rippling MDM required?\"\n\n    !!! warning \"Mandatory Requirement\"\n\n        **Yes**, Rippling MDM is **mandatory** on all devices used for work before accessing company data.\n\n    Install from the device enrollment page in your Rippling account.\n\n??? question \"What if my equipment breaks or gets lost?\"\n\n    Contact **IT Support immediately**:\n\n    - **Slack**: `#it-support` channel\n\n    Report:\n\n    - [ ] Physical damage to equipment\n    - [ ] Lost or stolen devices\n    - [ ] Hardware malfunctions\n    - [ ] Security incidents\n\n??? question \"Can I use my personal device for work?\"\n\n    Personal devices (BYOD) require:\n\n    1. ✅ Explicit approval from manager and IT\n    2. ✅ **Mandatory Rippling MDM installation**\n    3. ✅ Compliance with all security policies\n\n    !!! info \"Recommendation\"\n\n        Company-provided hardware is the standard approach.\n\n## Development & Contributions 💻\n\n??? question \"How do I start contributing to the codebase?\"\n\n    ```mermaid\n    graph TD\n        A[Fork Repository]:::start --> B[Install Package]:::proc\n        B --> C[Create Feature Branch]:::proc\n        C --> D[Follow Coding Standards]:::proc\n        D --> E[Submit PR]:::proc\n        E --> F[Sign CLA]:::proc\n        F --> G[Address Feedback]:::proc\n        G --> H[Merge!]:::out\n\n        classDef start fill:#4CAF50,color:#fff\n        classDef proc fill:#2196F3,color:#fff\n        classDef out fill:#9C27B0,color:#fff\n    ```\n\n    See [How to Contribute](../contributions/how-to-contribute.md) for complete guide.\n\n??? question \"What are the coding standards?\"\n\n    | Standard | Requirement |\n    |----------|-------------|\n    | **Line Width** | 120 characters maximum |\n    | **Docstrings** | Google-style with types |\n    | **Imports** | Use `pathlib` over `os` |\n    | **Functions** | Keep short and focused |\n    | **Testing** | All PRs must pass CI tests |\n\n    See [Development Workflow](../workflows/development.md) for complete standards.\n\n??? question \"What's the PR review process?\"\n\n    1. Submit PR with clear description\n    2. CI tests run automatically\n    3. [Ultralytics Assistant](https://github.com/ultralytics/handbook/pull/204#pullrequestreview-3467954430) reviews within minutes\n    4. Team reviews within **1-2 business days**\n    5. Address feedback with additional commits\n    6. Once approved, changes merge to main\n\n    See [Development Workflow](../workflows/development.md) for details.\n\n??? question \"Where can I find the development team contacts?\"\n\n    See [Development Team Directory](../contributions/how-to-contribute.md#our-development-team) for the complete team list with GitHub profiles.\n\n## Time Off & Policies 📅\n\n??? question \"How much PTO do I get?\"\n\n    **25 days** of annual PTO (24 days + 1 birthday), plus:\n\n    - :material-calendar: All official public holidays in your country\n    - :material-medical-bag: Unlimited sick leave as needed\n\n    | Benefit | Details |\n    |---------|---------|\n    | **Allocation** | Full from day one |\n    | **Rollover** | Up to 10 days (35 day max balance) |\n    | **Tenure Bonus** | +1 day every 2 years (up to 30 days total) |\n\n    See [PTO Policy](../people/pto-policy.md).\n\n??? question \"How do I request time off?\"\n\n    1. Submit request in [Rippling](https://www.rippling.com/)\n    2. Wait for manager approval\n    3. Update team calendar and Slack status\n\n    See the [PTO Policy](../people/pto-policy.md) for mandatory notice periods and counting rules.\n\n??? question \"What's the relocation policy?\"\n\n    Eligible employees relocating to hub cities receive:\n\n    | Benefit | Amount | Requirements |\n    |---------|--------|--------------|\n    | **Payment** | $10,000 flat one-time | 30-min commute to hub |\n    | **Cities** | Madrid, London, Shenzhen | Pre-approval required |\n    | **Clawback** | 100% (0–12 mo) / 50% (12–24 mo) | Applies on voluntary departure |\n\n    See [Relocation Policy](../finance/relocation.md) for eligibility.\n\n## Policies & Procedures 📋\n\n??? question \"What software can I use?\"\n\n    Only approved software listed in the [Software Policy](../tools/software.md).\n\n    **Request new software:**\n\n    1. Check [Approved Vendor Database](https://www.notion.so/218fe6fef1c3804d9479f0d3dd78ca62?v=218fe6fef1c3819b804e000c8232e2c2)\n    2. Get manager approval\n    3. Submit via [Vendor Onboarding Form](https://www.notion.so/218fe6fef1c38093a6cef5c63000dfaf?pvs=106)\n    4. Security and Legal review\n    5. Install after final approval\n\n??? question \"How are email signatures managed?\"\n\n    Email signatures are **automated** via Google Workspace:\n\n    - ✅ Pulls info from your Google Workspace profile\n    - ✅ Updates automatically across the organization\n    - ✅ No manual configuration needed\n\n    Ensure \"My signature\" is enabled in Gmail Settings. See [Email Signatures](../tools/email-signatures.md).\n\n??? question \"What training is required?\"\n\n    All employees complete annual mandatory training:\n\n    === \"General (All Employees)\"\n\n        - **CCPA** (California Consumer Privacy Act)\n        - **GDPR** (General Data Protection Regulation)\n        - **General Security Awareness**\n\n    === \"Engineering Teams\"\n\n        - **Secure Code Training** (YOLO and Platform teams only)\n\n    Training delivered via [Vanta](https://app.vanta.com/c/ultralytics/employee/onboarding).\n\n??? question \"Where do I report security incidents?\"\n\n    !!! danger \"Report Immediately\"\n\n        - **Email**: [security@ultralytics.com](mailto:security@ultralytics.com)\n        - **Slack**: `#compliance` channel (tag `@compliance-team`)\n\n    See [Security Requirements](../security/employee-security-compliance-requirements.md).\n\n## Company Culture & Goals 🎯\n\n??? question \"What are Ultralytics' core values?\"\n\n    <div class=\"grid cards\" markdown>\n\n    -   :material-rocket-launch: **Relentless Progress**\n\n        ---\n\n        Constantly evolving and improving\n\n    -   :material-star: **Strive for Excellence**\n\n        ---\n\n        Perseverance in achieving quality\n\n    -   :material-check-bold: **Actions, Not Words**\n\n        ---\n\n        Defined by what we do\n\n    -   :material-clock-fast: **Act with Urgency**\n\n        ---\n\n        Move swiftly to capture opportunities\n\n    -   :material-earth: **Open Access to All**\n\n        ---\n\n        Transparent communication for everyone\n\n    </div>\n\n    See [Mission & Values](../mission-vision-values/index.md).\n\n??? question \"What are the company goals?\"\n\n    **Current strategic priorities:**\n\n    | Focus Area | Goals |\n    |-----------|-------|\n    | **Product Excellence** | YOLO leadership, best-in-class performance |\n    | **Community Growth** | 1M+ monthly downloads, 50K+ Discord members |\n    | **Business Development** | Scale commercial licensing, expand customer base |\n    | **Platform & Infrastructure** | Advance Platform capabilities, achieve 99.9% uptime |\n    | **Security & Compliance** | Complete SOC 2 and ISO 27001 certifications |\n\n    See [Company Goals](../goals/company-goals.md) for complete KPIs.\n\n??? question \"How does Ultralytics use OKRs?\"\n\n    We use quarterly OKRs (Objectives and Key Results) for goal setting:\n\n    - Company-level OKRs cascade to team and individual goals\n    - Quarterly planning and review cycles\n    - Target 70-80% achievement (not 100%)\n    - Transparent and visible across organization\n\n    See [OKRs](../goals/okrs.md) for framework details.\n\n## Technical YOLO Questions 🤖\n\n??? question \"Where do I find technical documentation for YOLO models?\"\n\n    For technical questions about YOLO models, training, inference, and deployment:\n\n    <div class=\"grid cards\" markdown>\n\n    -   :material-book: **[YOLO Documentation](https://docs.ultralytics.com/)**\n\n        ---\n\n        Complete technical guides\n\n    -   :material-help-circle: **[YOLO FAQ](https://docs.ultralytics.com/help/FAQ)**\n\n        ---\n\n        Common technical questions\n\n    -   :material-school: **[Training Guide](https://docs.ultralytics.com/modes/train)**\n\n        ---\n\n        Model training\n\n    -   :material-rocket-launch: **[Deployment Options](https://docs.ultralytics.com/guides/model-deployment-options)**\n\n        ---\n\n        Export and inference\n\n    -   :material-forum: **[GitHub Discussions](https://github.com/orgs/ultralytics/discussions)**\n\n        ---\n\n        Community support\n\n    -   :material-code-braces: **[Contributing Guide](https://docs.ultralytics.com/help/contributing)**\n\n        ---\n\n        Open-source contribution\n\n    </div>\n\n## Still Have Questions? 🤔\n\n!!! question \"Can't find what you're looking for?\"\n\n    1. **Browse the handbook**: Use search or navigation to find specific topics\n    2. **Ask your manager**: First point of contact for most questions\n    3. **Contact specialized teams**: IT, Finance, Legal, Security\n    4. **Check documentation**: [YOLO Docs](https://docs.ultralytics.com/) for technical questions\n"}]}, {"type": "dir", "name": "finance", "path": "finance", "children": [{"type": "file", "name": "index.md", "path": "finance/index.md", "content": "---\ndescription: Ultralytics Finance Handbook covering financial procedures, travel policy, relocation, referral bonuses, and expense reimbursement for all employees.\nkeywords: Ultralytics finance, finance handbook, expense reporting, reimbursements, travel policy, relocation, referral bonus, budget guidelines, onsite setup\n---\n\n# Ultralytics Finance Handbook 📘\n\nWelcome to the [Ultralytics](https://www.ultralytics.com/) Finance Handbook. This resource provides clear guidelines for employees regarding financial processes, reimbursements, budgeting, and expense management.\n\n## Finance Overview 💡\n\nUltralytics is committed to transparent financial practices that empower our employees to make responsible financial decisions. This handbook section outlines key financial processes employees should follow to ensure smooth operations and timely reimbursements.\n\n## Expense Guidelines 🧾\n\nEmployees are expected to manage expenses responsibly and ethically, ensuring all expenditures are business-critical and compliant with company policy.\n\n### Hardware Policy 🖥️\n\nAll hardware equipment requests and procedures are covered under the comprehensive [Hardware Policy](../tools/hardware.md). This includes computer equipment, mobile devices, refresh cycles, and approval processes for all employees.\n\n## Travel Policy ✈️🌎\n\nEmployees traveling for business must adhere to the detailed [Ultralytics Employee Travel Policy](travel.md), which outlines per diem rates, airfare guidelines, and expense reimbursement processes.\n\n!!! info \"Travel Policy Highlights\"\n\n    - **Per Diem:** Covers all meals, ground transportation, and incidental expenses\n    - **Airfare:** Economy class flights only, reimbursable separately\n    - **Advance Notice:** Minimum 2 weeks for booking\n\n## Relocation Policy 📍\n\nHigh-value employees approved for relocation to designated hub cities may be eligible for relocation compensation. Refer to the comprehensive [Ultralytics Employee Relocation Policy](relocation.md) for complete details.\n\n!!! success \"Relocation Benefits\"\n\n    - **Compensation:** $10,000 flat one-time payment\n    - **Eligible Cities:** Madrid, London, or Shenzhen\n    - **Clawback:** 24-month repayment schedule applies\n\n## Referral Bonus 🤝\n\nUltralytics rewards employees who refer qualified candidates that successfully join our team. Refer to the comprehensive [Ultralytics Employee Referral Bonus Policy](referral-bonus.md) for complete details.\n\n!!! success \"Referral Rewards\"\n\n    - **Bonus Amount:** $5,000 paid after candidate completes 3 months\n    - **Eligibility:** All full-time positions at Ultralytics\n    - **Requirement:** Candidate must not already be in recruitment pipeline\n\n## Reimbursements 💸\n\nFinance processes one employee reimbursement batch per month. To be included in the current month's batch, expenses must be submitted with receipts, business purpose, and any required approval by the **25th calendar day** of the month. If the 25th falls on a weekend or company holiday, the cutoff is the previous business day. Approved expenses submitted after the cutoff roll into the following month's reimbursement batch.\n\nFinance does not issue separate off-cycle payments for individual small expenses. For example, if two taxi receipts are approved before the May cutoff, both are reimbursed together in the end-of-May payment.\n\n!!! info \"Accountable Plan Requirements\"\n\n    Reimbursement requests must have a business connection, be substantiated with receipts or required documentation, and include a clear business purpose. Any duplicate, excess, or incorrect reimbursement must be returned promptly.\n\n    This follows IRS accountable plan guidance for employee business expense reimbursements, including business connection, adequate accounting, and return of excess reimbursement requirements. See [IRS Publication 463](https://www.irs.gov/publications/p463) and [IRS Publication 15](https://www.irs.gov/publications/p15).\n\n!!! warning \"Reimbursement Thresholds\"\n\n    **Two different processes based on expense amount:**\n\n=== \"Under $3,000\"\n\n    **Standard Reimbursement Process:**\n\n    1. Pay expenses personally\n    2. Submit receipts with business justification by the monthly cutoff\n    3. Receive approved expenses together in the next monthly reimbursement batch\n\n    !!! tip \"Best Practice\"\n\n        Submit receipts as soon as possible instead of waiting for the cutoff. Late, incomplete, or unapproved requests roll into the following month's reimbursement batch.\n\n=== \"$3,000+\"\n\n    **Upfront Reimbursement Process:**\n\n    1. Submit expense request with cost estimate and business justification\n    2. Receive approval and payment **before** incurring expenses\n    3. Submit receipts after purchase for reconciliation\n\n    !!! info \"Timeline\"\n\n        Allow **5 business days** for approval and payment processing\n\n## Employee Credit Cards 💳\n\n!!! info \"No Corporate Cards\"\n\n    Ultralytics does not issue corporate credit cards to employees. Use personal payment methods for approved business expenses and submit for reimbursement following standard procedures.\n\n## Budget Management 📊\n\nEmployees are encouraged to proactively manage departmental budgets responsibly:\n\n- Consult your manager to understand your department's budget allocations\n- Regularly review expenses to remain within budget\n- Notify your manager and Finance team immediately if you anticipate exceeding budget\n\n## Questions and Support 📞\n\n!!! question \"Need Help?\"\n\n    | Question Type | Contact |\n    |--------------|---------|\n    | **Reimbursement Questions** | Finance team via Slack `#finance` |\n    | **Budget Questions** | Your direct manager |\n    | **Policy Clarification** | Finance team |\n    | **Urgent Issues** | Contact your manager immediately |\n"}, {"type": "file", "name": "referral-bonus.md", "path": "finance/referral-bonus.md", "content": "---\ndescription: Ultralytics Employee Referral Bonus Policy offering $5,000 for successful referrals who complete 3 months of employment.\nkeywords: Ultralytics, Employee Referral, Referral Bonus, Hiring, Recruitment, Talent Acquisition\n---\n\n# Ultralytics Employee Referral Bonus Policy 🤝\n\n## Overview 📌\n\n[Ultralytics](https://www.ultralytics.com/) offers a $5,000 bonus to employees who refer qualified candidates that join our team. This program helps us grow with talented individuals from employee networks.\n\n!!! success \"Referral Bonus\"\n\n    **$5,000** paid after your referral completes 3 months of employment\n\n## Eligibility 💰\n\n<div class=\"grid cards\" markdown>\n\n- :material-cash-multiple: **Bonus Amount**\n\n    ***\n\n    **$5,000.00** per successful referral\n\n- :material-clock-check: **Payment Timing**\n\n    ***\n\n    After candidate completes **3 months** of employment\n\n- :material-briefcase: **Eligible Positions**\n\n    ***\n\n    All full-time positions at Ultralytics\n\n</div>\n\n## Requirements ✅\n\n!!! warning \"All Requirements Must Be Met\"\n\n    === \"Referrer Requirements\"\n\n        - [x] Must be a current Ultralytics employee at time of referral\n        - [x] Must still be employed at time of payout\n        - [x] Cannot be involved in hiring decision for referred candidate\n\n    === \"Candidate Requirements\"\n\n        - [x] Must be hired for a full-time position\n        - [x] Cannot already be in our recruitment pipeline\n        - [x] Must successfully complete 3-month probationary period\n\n    === \"General Rules\"\n\n        - [x] Only one referral bonus per hire\n        - [x] First referrer receives bonus if multiple employees refer same candidate\n\n## Process 📋\n\n```mermaid\ngraph TD\n    A[Submit Referral to HR]:::start --> B[HR Confirms Eligibility]:::proc\n    B --> C{Candidate in Pipeline?}:::decide\n    C -->|Yes| D[Referral Not Eligible]:::error\n    C -->|No| E[Process Application]:::proc\n    E --> F{Candidate Hired?}:::decide\n    F -->|No| G[No Bonus]:::error\n    F -->|Yes| H[Track 3-Month Period]:::proc\n    H --> I{Completes 3 Months?}:::decide\n    I -->|No| J[No Bonus]:::error\n    I -->|Yes| K[Process $5,000 Bonus]:::proc\n    K --> L[Bonus Paid in Next Payroll]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n    classDef error fill:#F44336,color:#fff\n```\n\n### Step-by-Step\n\n1. **Submit Referral** - Send candidate information to HR with your referral\n2. **Eligibility Check** - HR confirms eligibility and processes application\n3. **Hiring Decision** - Candidate goes through standard interview process\n4. **3-Month Tracking** - If hired, track completion of probationary period\n5. **Bonus Payment** - After 3 months, bonus paid in next payroll cycle\n\n!!! info \"Tax Information\"\n\n    Bonus is subject to standard payroll taxes and deductions\n\n## Exclusions ⚠️\n\n!!! danger \"Not Eligible for Referral Bonus\"\n\n    === \"Position Exclusions\"\n\n        - Executive-level positions (may have different terms on case-by-case basis)\n\n    === \"Employee Exclusions\"\n\n        - Employees involved in hiring decision for the referred candidate\n        - Employees who are not current at time of referral or payout\n\n    === \"Source Exclusions\"\n\n        - Referrals from recruiting agencies\n        - Referrals from external parties\n        - Candidates already in recruitment pipeline\n\n## Examples 💡\n\n??? example \"Successful Referral\"\n\n    **Scenario:** You refer a friend for a Software Engineer position in January.\n\n    - ✅ January 15: You submit referral to HR\n    - ✅ February 1: Candidate hired, starts work\n    - ✅ May 1: Candidate completes 3 months\n    - ✅ May 15: You receive $5,000 bonus in payroll\n\n    **Result:** Bonus paid successfully! 🎉\n\n??? example \"Candidate Leaves Before 3 Months\"\n\n    **Scenario:** You refer a candidate who gets hired but leaves after 2 months.\n\n    - ✅ March 1: Candidate starts work\n    - ❌ April 25: Candidate resigns (only 2 months)\n    - ❌ No bonus paid\n\n    **Result:** No bonus - must complete full 3 months\n\n??? example \"Multiple Referrers\"\n\n    **Scenario:** Two employees refer the same candidate.\n\n    - Employee A refers on March 1\n    - Employee B refers on March 5\n    - Candidate hired on March 15\n\n    **Result:** Employee A receives the bonus (first referrer)\n\n## Tips for Successful Referrals 🎯\n\n!!! tip \"Maximize Your Referral Success\"\n\n    <div class=\"grid cards\" markdown>\n\n    -   :material-account-search: **Know the Role**\n\n        ---\n\n        Review job description thoroughly before referring\n\n    -   :material-account-check: **Qualify Candidates**\n\n        ---\n\n        Ensure they meet minimum requirements\n\n    -   :material-information: **Provide Context**\n\n        ---\n\n        Give HR detailed information about candidate's background\n\n    -   :material-speedometer: **Act Quickly**\n\n        ---\n\n        Refer before candidate applies through other channels\n\n    -   :material-handshake: **Stay Connected**\n\n        ---\n\n        Help candidate understand our culture and values\n\n    </div>\n\n## Questions ❓\n\n!!! question \"Need Clarification?\"\n\n    Contact HR for any questions about:\n\n    - Specific eligibility cases\n    - Referral program details\n    - Bonus payment status\n    - Candidate pipeline status\n\n    **Email:** Contact your HR representative\n    **Slack:** `#hr` channel\n"}, {"type": "file", "name": "relocation.md", "path": "finance/relocation.md", "content": "---\ndescription: Ultralytics Employee Relocation Policy covering the $10K Proximity Package, 30-minute commute eligibility, flat-rate payment, and clawback terms.\nkeywords: Ultralytics, Employee Relocation, Relocation Policy, Proximity Package, office locations, relocation compensation, flat rate, commute\n---\n\n# Ultralytics Employee Relocation Policy 📍\n\n## Purpose and Scope 📌\n\nWe want you to love where you live and work. Long commutes drain energy that could be spent on innovation (or life!). To keep our High-Resolution Hybrid model humming, we need you close enough to collaborate at full bandwidth on Anchor Days (Tue/Wed/Thu). To encourage you to live near our vibrant hubs, we offer a **Proximity Relocation Package**.\n\nThis policy applies to new hires or existing employees relocating to be near our London, Madrid, or Shenzhen offices.\n\n!!! info \"Quick Summary\"\n\n    **$10,000 one-time payment** for employees moving within a **30-minute commute** of a Hub Office.\n\n## Approved Office Locations 🌎\n\n<div class=\"grid cards\" markdown>\n\n- :flag_es: **Madrid, Spain**\n\n    ***\n\n    [Cra de S. Jerónimo, 15 Centro, 28014 Madrid](https://maps.app.goo.gl/nxB8YygRQeXSS9G18)\n\n- :flag_cn: **Shenzhen, China**\n\n    ***\n\n    [Room 126, 6F, CR Land Tower D, 91 Kefa Road, Nanshan District](https://maps.google.com/maps?q=6F,+CR+Land+Tower+D,+91+Kefa+Road,+Nanshan+District,+Shenzhen,+China)\n\n- :flag_gb: **London, UK**\n\n    ***\n\n    [50 York Way, London N1 9AB](https://maps.app.goo.gl/9sdE3KrQVwc2shb86)\n\n</div>\n\n## Eligibility Requirements ✅\n\nTo qualify for the Proximity Relocation Package, you must meet the following criteria:\n\n| Requirement         | Details                                                                                                                                                |\n| :------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **Employee Status** | New hires or existing employees.                                                                                                                       |\n| **Proximity Rule**  | You must move to a location within a **30-minute commute** of a Hub Office.                                                                            |\n| **Measurement**     | Commute time is measured door-to-door via **walking, cycling, public transit, or driving** as calculated by Google Maps during standard commute hours. |\n\n!!! tip \"Check Your Commute\"\n\n    Before signing a lease, use Google Maps to verify the commute time to the office address matches the eligibility criteria.\n\n## Relocation Compensation 💰\n\n```mermaid\ngraph TD\n    A[Eligibility Confirmed]:::start --> B[$10,000 One-Time Payment]:::proc\n    B --> C[Covers All Moving Expenses]:::proc\n    C --> D[Paid After Relocation Complete]:::proc\n    D --> E[New Address Confirmed]:::proc\n    E --> F[Payment in Next Payroll]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n### Standard Flat Rate\n\nEligible employees receive a **one-time, flat-rate payment of $10,000 USD** (Global).\n\nThis simplifies your move by providing funds upfront or upon completion without the need to submit individual receipts to Ultralytics.\n\n=== \"What's Covered\"\n\n    The payment is intended to cover expenses such as:\n\n    - :truck: **Moving Services:** Moving van or professional removal services.\n    - :package: **Shipping:** Shipping of personal belongings.\n    - :airplane: **Travel:** Travel costs for the move.\n    - :hotel: **Temporary Stay:** Temporary accommodation (up to 30 days).\n    - :scroll: **Legal:** Legal fees for tenancy agreements.\n\n=== \"Payment Process\"\n\n    - **Timing:** Processed in the first payroll cycle after your new address is confirmed.\n    - **Method:** Lump sum payment.\n    - **Receipts:** Not required by Ultralytics for payment, but **highly recommended** you keep them for tax purposes.\n\n### UK Tax Note :flag_gb:\n\nFor employees relocating to the **London** office: The first **£8,000** of qualifying relocation expenses are currently tax-exempt by HMRC.\n\n!!! warning \"Keep Your Receipts\"\n\n    While Ultralytics pays a flat rate, to claim the HMRC tax exemption, you may need to prove you incurred \"qualifying expenses\" up to that amount. Please consult a tax advisor.\n\n## Approval Process 🔄\n\n1.  **Request Submission**\n    - Inform your manager of your intent to utilize the Proximity Package.\n    - Provide the proposed new address and Google Maps commute verification.\n\n2.  **Confirmation**\n    - HR verifies the distance eligibility.\n    - Relocation agreement issued detailing the clawback terms.\n\n3.  **Agreement**\n    - Employee signs the relocation agreement before relocating.\n\n## Employee Obligations & Clawback ⚖️\n\nTo ensure mutual commitment, this package includes a repayment (clawback) clause based on your tenure following the relocation.\n\n### Repayment Schedule\n\nIf you leave Ultralytics voluntarily within 24 months of your relocation/payment date, you must repay a portion of the payment:\n\n| Time Since Relocation | Repayment Amount                 |\n| :-------------------- | :------------------------------- |\n| **0 - 12 Months**     | **100%** of payment is repayable |\n| **12 - 24 Months**    | **50%** of payment is repayable  |\n| **24+ Months**        | **0%** (No repayment required)   |\n\n!!! warning \"Repayment Terms\"\n\n    - **Voluntary Resignation:** Repayment is required as per the table above.\n    - **Involuntary Termination:** Typically, no repayment is required (subject to specific termination conditions).\n    - **Method:** Payment is due within 30 days of departure or deducted from the final paycheck where legally permitted.\n\n### Documentation Requirements\n\n<div class=\"grid cards\" markdown>\n\n- :material-map-marker-radius: **Proof of Commute**\n\n    ***\n\n    Google Maps screenshot showing <30 min commute to office.\n\n- :material-home-city: **Proof of Residence**\n\n    ***\n\n    Lease agreement or utility bill confirming new address.\n\n- :material-file-sign: **Signed Agreement**\n\n    ***\n\n    Signed acceptance of the clawback terms.\n\n</div>\n\n## Important Considerations ⚠️\n\n### Onsite Work Requirements\n\n!!! warning \"Office Attendance\"\n\n    **Anchor Days (Tue/Wed/Thu) are mandatory onsite** for anyone within commutable distance. The Proximity Package ensures you can reliably badge in, collaborate in real time, and meet performance expectations tied to in-office presence.\n\n## Questions?\n\n!!! question \"Need Help?\"\n\n    Contact the appropriate team:\n\n    | Question Type | Contact |\n    |--------------|---------|\n    | **Eligibility/Commute Check** | HR Team |\n    | **Payment Status** | Finance Team |\n    | **Tax Questions** | External tax advisor |\n"}, {"type": "file", "name": "travel.md", "path": "finance/travel.md", "content": "---\ndescription: Ultralytics Employee Travel Policy covering per diem rates, booking procedures, expense reporting, and sustainability guidelines for business travel.\nkeywords: Ultralytics, Employee Travel Policy, per diem rates, travel responsibilities, airfare, expense reporting, sustainability, business travel\n---\n\n# Ultralytics Employee Travel Policy 🌐\n\n## Scope 📌\n\nThis policy applies to all employees of [Ultralytics](https://www.ultralytics.com/) who are required to travel for business purposes. Employees are responsible for making their own travel arrangements while adhering to the guidelines outlined in this policy.\n\n## Employee Responsibilities 📋\n\n!!! warning \"Pre-Approval Required\"\n\n    All business travel must be approved by your manager **before booking**. Unapproved travel may not be reimbursed.\n\n- :material-cash-check: Travel must be business-critical, cost-effective, and approved by your manager prior to booking\n- :material-receipt-text: Expense claims must include a clear description of the business purpose\n- :material-clock-fast: Submit expenses promptly and before the monthly reimbursement cutoff when possible\n\n## Reimbursement Procedures 💰\n\n```mermaid\ngraph TD\n    A[Travel Need]:::start --> B{Cost Estimate}:::decide\n    B -->|Under $3,000| C[Pay Personally]:::proc\n    B -->|$3,000+| D[Request Upfront Approval]:::proc\n    C --> E[Travel]:::proc\n    D --> F[Receive Approval]:::proc\n    F --> G[Receive Payment]:::proc\n    G --> E\n    E --> H[Submit Receipts]:::proc\n    H --> I[Reimbursement/Reconciliation]:::out\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n    classDef decide fill:#FF9800,color:#fff\n    classDef out fill:#9C27B0,color:#fff\n```\n\n=== \"Under $3,000\"\n\n    **Standard Reimbursement Process:**\n\n    1. Pay expenses personally during travel\n    2. Submit receipts with business purpose by the monthly cutoff\n    3. Receive approved travel expenses together in the next monthly reimbursement batch\n\n    !!! tip \"Best Practice\"\n\n        The monthly cutoff is the 25th calendar day, or the previous business day if the 25th falls on a weekend or company holiday.\n\n=== \"$3,000+\"\n\n    **Upfront Reimbursement Process:**\n\n    1. Submit expense request with cost estimate and business justification\n    2. Receive approval and payment before incurring expenses\n    3. Submit receipts after travel for reconciliation\n\n    !!! info \"Timeline\"\n\n        Allow **5 business days** for approval and payment processing.\n\n## Per Diem Rates 💳\n\n!!! info \"What Per Diem Covers\"\n\n    **Total per diem = Lodging + M&IE (Meals, Incidentals & Expenses)**\n\n    === \"Included\"\n\n        - Accommodation\n        - All meals (breakfast, lunch, dinner)\n        - Tips and gratuities\n        - Ground transportation (taxi, metro, bus)\n        - Incidental costs (laundry, parking, etc.)\n\n    === \"Not Included\"\n\n        - Airfare (reimbursed separately)\n        - Personal expenses\n        - Alcohol\n        - Entertainment\n\nEmployees traveling for business will receive a daily per diem allowance based on their destination. The following rates are reviewed annually and updated when Finance publishes a new schedule:\n\n| Country               | City          | Lodging | M&IE   | Total Per Diem |\n| --------------------- | ------------- | ------- | ------ | -------------- |\n| **China 🇨🇳**          | Beijing       | $123.50 | $69.00 | $192.50        |\n|                       | Shanghai      | $187.50 | $80.00 | $267.50        |\n|                       | Shenzhen      | $115.00 | $71.00 | $186.00        |\n|                       | Hong Kong     | $177.50 | $90.00 | $267.50        |\n| **France 🇫🇷**         | Paris         | $255.50 | $86.50 | $342.00        |\n| **Germany 🇩🇪**        | Berlin        | $135.50 | $72.50 | $208.00        |\n|                       | Dusseldorf    | $159.00 | $75.50 | $234.50        |\n|                       | Nuremberg     | $147.50 | $75.50 | $223.00        |\n|                       | Munich        | $156.00 | $77.00 | $233.00        |\n| **Italy 🇮🇹**          | Rome          | $244.50 | $89.50 | $334.00        |\n| **Japan 🇯🇵**          | Tokyo         | $187.50 | $65.00 | $252.50        |\n| **Netherlands 🇳🇱**    | Amsterdam     | $226.50 | $96.00 | $322.50        |\n|                       | Eindhoven     | $117.00 | $70.50 | $187.50        |\n| **Portugal 🇵🇹**       | Lisbon        | $140.00 | $56.00 | $196.00        |\n| **Singapore 🇸🇬**      | Singapore     | $152.00 | $75.00 | $227.00        |\n| **Spain 🇪🇸**          | Barcelona     | $153.50 | $67.00 | $220.50        |\n|                       | Madrid        | $187.50 | $68.50 | $256.00        |\n|                       | Malaga        | $139.00 | $73.50 | $212.50        |\n| **United Kingdom 🇬🇧** | London        | $212.00 | $87.00 | $299.00        |\n| **United States 🇺🇸**  | Denver        | $161.25 | $69.00 | $230.25        |\n|                       | Las Vegas     | $119.25 | $64.50 | $183.75        |\n|                       | Los Angeles   | $143.25 | $64.50 | $207.75        |\n|                       | Santa Clara   | $153.50 | $59.50 | $213.00        |\n|                       | New York      | $256.50 | $69.00 | $325.50        |\n|                       | San Francisco | $204.00 | $69.00 | $273.00        |\n|                       | San Jose      | $144.00 | $69.00 | $213.00        |\n\n### Methodology 📚\n\n??? info \"How We Calculate Per Diem Rates\"\n\n    Ultralytics bases daily per diem rates on official U.S. government sources, adjusted to reflect our company's size and budget considerations.\n\n    | Region | Source | Ultralytics Rate |\n    |--------|--------|------------------|\n    | 🇺🇸 **CONUS** | [GSA Per Diem Rates](https://www.gsa.gov/travel/plan-book/per-diem-rates) | **75%** of official |\n    | 🌍 **OCONUS** | [U.S. Department of State](https://allowances.state.gov/web920/per_diem.asp) | **50%** of official |\n\n    - **CONUS** = Continental United States\n    - **OCONUS** = Outside Continental United States\n    - Rates reviewed and updated annually on January 1st\n\n## Travel Booking 🛫\n\n<div class=\"grid cards\" markdown>\n\n- :material-airplane: **Flights**\n\n    ***\n    - Book **14 days in advance** (domestic)\n    - Book **21 days in advance** (international)\n    - **Economy class only** (no exceptions)\n    - Reimbursed separately from per diem\n\n- :material-bed: **Accommodation**\n\n    ***\n    - Covered by per diem lodging allowance\n    - **Not reimbursed separately**\n    - Book within per diem budget\n    - Business-appropriate location\n\n- :material-car: **Ground Transportation**\n\n    ***\n    - Covered by M&IE allowance\n    - Use most cost-effective option\n    - Taxi, metro, bus, rideshare OK\n    - Rental cars require pre-approval\n\n- :material-cash-multiple: **Cost-Effectiveness**\n\n    ***\n    - Choose efficient and economical options\n    - Balance cost with convenience\n    - Employees arrange their own travel\n    - Manager approval required\n\n</div>\n\n!!! tip \"Booking Tips\"\n\n    - Compare prices across multiple platforms\n    - Consider alternative airports for better rates\n    - Use company travel portal if available\n    - Book refundable tickets when possible for flexibility\n\n## Sustainability ♻️\n\n!!! success \"Environmental Responsibility\"\n\n    Prioritize virtual meetings whenever possible to minimize environmental impact. Consider:\n\n    - Video conferencing for routine meetings\n    - Combining multiple trips into one journey\n    - Direct flights to reduce emissions\n    - Public transportation when available\n\n## Expense Reporting 🧾\n\n!!! warning \"Receipt Requirements\"\n\n    **Receipts required for ALL reimbursements**\n\n    - Upload clear photos or PDFs\n    - Include itemized details\n    - Submit before the monthly reimbursement cutoff when possible\n    - Use Rippling expense management system\n\n## Exceptions ⚠️\n\n??? question \"Need an Exception?\"\n\n    Any exceptions to this policy must be **pre-approved by your line manager** prior to travel.\n\n    **Common exception scenarios:**\n\n    - Premium cabin for flights over 8 hours (rarely approved)\n    - Higher per diem for special circumstances\n    - Rental car when public transport unavailable\n    - Extended stays for business reasons\n\n    Submit exception requests with:\n\n    1. Business justification\n    2. Cost comparison\n    3. Alternative options considered\n    4. Expected ROI or benefit\n\n    Requests reviewed case-by-case. Allow 5 business days for approval.\n"}]}, {"type": "dir", "name": "goals", "path": "goals", "children": [{"type": "file", "name": "company-goals.md", "path": "goals/company-goals.md", "content": "---\ndescription: Ultralytics company goals defining our strategic priorities, growth objectives, and key performance indicators for advancing AI and computer vision.\nkeywords: Ultralytics goals, company objectives, strategic priorities, growth targets, AI advancement, YOLO development\n---\n\n# Company Goals 🎯\n\n## Overview\n\n!!! success \"Annual Strategic Goals\"\n\n    Ultralytics sets annual goals aligned with our mission to democratize AI and advance computer vision. Goals span product excellence, community growth, business development, and technical infrastructure — all reviewed quarterly against measurable targets.\n\n## Strategic Priorities\n\n<div class=\"grid cards\" markdown>\n\n- :material-speedometer: **Product Excellence**\n\n    ***\n    - Maintain YOLO model leadership in accuracy, speed, and ease of use\n    - Expand capabilities across detection, segmentation, tracking, and classification\n    - Achieve sub-30ms latency on standard hardware for edge deployment\n    - Deliver best-in-class developer experience with intuitive APIs and comprehensive docs\n\n- :material-account-group: **Community Growth & Engagement**\n\n    ***\n    - Reach 1M+ monthly PyPI downloads\n    - Grow Discord community to 50K+ active members\n    - Maintain sub-24-hour average response time on GitHub issues\n    - Cultivate 100+ active open-source contributors per quarter\n    - Achieve 90%+ satisfaction in community surveys\n\n- :material-chart-line: **Revenue Growth & Market Expansion**\n\n    ***\n    - Scale ARR through accelerated enterprise adoption\n    - Expand into key verticals: automotive, manufacturing, agriculture, security, healthcare\n    - Build strategic partnerships with cloud providers and hardware manufacturers\n    - Achieve 120%+ net dollar retention rate\n    - Grow enterprise customer base by 200% YoY\n\n- :material-cloud: **Platform & Infrastructure**\n\n    ***\n    - Launch Platform with enhanced training and deployment capabilities\n    - Achieve 99.9% uptime SLA for production services\n    - Support inference across CPU, GPU, NPU, and specialized AI accelerators\n    - Deliver <100ms API response times at scale\n    - Enable seamless deployment to cloud, edge, and mobile environments\n\n</div>\n\n!!! warning \"Security, Compliance & Trust\"\n\n    | Goal | Target | Status |\n    | ---- | ------ | ------ |\n    | SOC 2 Type I attestation | Q1 2026 | Completed |\n    | ISO 27001:2022 certification | Q1 2026 | Completed |\n    | GDPR, CCPA & global privacy compliance | Ongoing | Active |\n    | Critical security incidents | Zero | On Target |\n    | Annual security audits & vulnerability assessments | Annually | Scheduled |\n\n## Goal Setting Process\n\n```mermaid\ngraph LR\n    A[Annual Strategy]:::start --> B[Quarterly Planning]:::proc\n    B --> C[Sprint Execution]:::proc\n    C --> D[Monthly Check-ins]:::proc\n    D --> E[Quarterly Reviews]:::proc\n    E --> F[Annual Retrospective]:::proc\n    F --> A\n\n    classDef start fill:#4CAF50,color:#fff\n    classDef proc fill:#2196F3,color:#fff\n```\n\n| Step                     | Cadence        | Description                                                    |\n| ------------------------ | -------------- | -------------------------------------------------------------- |\n| **Annual Strategy**      | Yearly         | Leadership defines company-level OKRs and strategic priorities |\n| **Quarterly Planning**   | Every 13 weeks | Teams cascade objectives and define key results                |\n| **Sprint Execution**     | Every 2 weeks  | 2-week sprints with weekly progress reviews                    |\n| **Monthly Check-ins**    | Monthly        | Cross-functional syncs to ensure alignment                     |\n| **Quarterl
